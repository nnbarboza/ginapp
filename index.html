function pintarHoy(){
  var hoy = state.data.hoy;
  var c = custodiaDe(hoy), t = tramoDe(hoy);
  var q = c.quien, esMio = q === state.user;
  var k = q ? claveColor(q) : '';
  var corto = state.data.config.nombre_corto || 'Gina';

  var titulo = !q ? corto + ': día sin asignar'
             : esMio ? corto + ' está contigo'
             : corto + ' está con ' + nombreDe(q).toLowerCase();

  var sub = '';
  if(q){
    var h = horaCambio(t.hasta);
    /* Más allá de una semana, el día de la semana engaña: "hasta el martes"
       se lee como el martes que viene, no como el de dentro de trece días. */
    var dFin = diffDias(hoy, t.hasta);
    var fin = dFin===0 ? 'hoy' : dFin===1 ? 'mañana'
            : dFin<=6 ? 'el ' + DOW_LARGO[dow(t.hasta)]
            : 'el ' + (+t.hasta.split('-')[2]) + ' de ' + MESES[+t.hasta.split('-')[1]-1];
    var dIni = diffDias(t.desde, hoy);
    var ini = dIni===0 ? 'Desde hoy'
            : dIni<=6 ? 'Desde el ' + DOW_LARGO[dow(t.desde)]
            : 'Desde el ' + (+t.desde.split('-')[2]) + ' de ' + MESES[+t.desde.split('-')[1]-1];
    /* Si el día que rompe el tramo es estimado, el final tampoco es seguro. */
    var finSeguro = !custodiaDe(addDays(t.hasta,1)).estimado;
    var total = diffDias(t.desde, t.hasta) + 1;
    sub = ini + ' · <b>hasta ' + fin + (h ? ' a las ' + esc(h) : '') +
          (finSeguro ? '' : ' (aprox.)') + '</b>' +
          (total >= 8 ? '<br><span style="color:var(--t3)">' + total + ' días seguidos</span>' : '');
  }

  var html =
    '<div class="hoy-top">' +
      '<div class="hoy-casa" style="background:var(--'+(k||'gina')+'-s);color:var(--'+(k||'gina')+')">' +
        svg('casa', 42, ' stroke-width="1.5"') +
      '</div>' +
      '<div class="hoy-tx">' +
        '<div class="kick" style="color:var(--'+(k||'gina')+'-d)">Hoy · ' +
          DOW_LARGO[dow(hoy)] + ' ' + (+hoy.split('-')[2]) + '</div>' +
        '<h2>' + esc(titulo) + (c.estimado ? '<span class="est-b">ESTIMADO</span>' : '') + '</h2>' +
        (sub ? '<div class="sub">' + sub + '</div>' : '') +
      '</div>' +
    '</div>';

  var prox = proximosEventos(2);
  if(prox.length){
    html += '<div class="hoy-sep"></div><div class="hoy-evs">' + prox.map(function(o){
      var tp = tipoEvento(o.ev.tipo);
      var extra = [cuandoEvento(o)];
      if(o.ev.lugar) extra.push(esc(o.ev.lugar));
      else if(o.ev.responsable) extra.push('lleva ' + esc(nombreDe(o.ev.responsable).toLowerCase()));
      /* Un tramo de varios días no tiene "hora": ponerla confunde. */
      var hora = esLargo(o.ev) ? '' : String(o.hora || '');
      return '<div class="ev">' +
        '<div class="ev-i" style="background:'+tp.color+'1F;color:'+tp.color+'">' +
          svg(icoEvento(tp.id), 20) + '</div>' +
        '<div class="ev-t"><b>'+esc(o.ev.titulo)+'</b><span>'+extra.join(' · ')+'</span></div>' +
        '<div class="ev-h">'+esc(hora)+'</div></div>';
    }).join('') + '</div>';

    /* La nota accionable del evento que ya está a la vista se pega aquí, sin
       repetir el título. El bloque Recordatorio queda para lo que no se ve. */
    var conAccion = prox.filter(function(o){ return String(o.ev.accion||'').trim(); })[0];
    if(conAccion){
      html += '<div class="hoy-nota"><span class="i">' + svg('pin',15) + '</span>' +
              '<span>' + esc(conAccion.ev.accion) + '</span></div>';
    }
  } else {
    html += '<div class="hoy-sep"></div>' +
            '<div class="hoy-vacio">No hay nada apuntado en los próximos días.</div>';
  }
  $('#cardHoy').innerHTML = html;
}

function tarjeta(c, ico, titulo, cuerpo, pie, ir){
  return '<button class="sec-c" data-ir="'+ir+'" style="background:var(--'+c+'-c)">' +
    '<div class="sec-hd"><span class="i" style="background:var(--'+c+'-s);color:var(--'+c+'-d)">' +
      svg(ico,22) + '</span><b style="color:var(--'+c+'-d)">'+titulo+'</b></div>' +
    cuerpo +
    '<div class="sec-pie" style="background:var(--'+c+'-s);color:var(--'+c+'-d)">' +
      '<span>'+pie+'</span>' + svg('chevron',14) + '</div></button>';
}

function pintarSecciones(){
  var out = [];

  /* --- Calendario --- */
  var prox = proximosEventos(1)[0];
  out.push(tarjeta('cal','calendario','Calendario',
    prox ? '<div class="sec-l">Próximo evento</div>' +
           '<div class="sec-v">'+esc(prox.ev.titulo)+'</div>' +
           '<div class="sec-s">'+cuandoEvento(prox) +
           (esLargo(prox.ev)||!prox.hora ? '' : ' · '+esc(prox.hora))+'</div>'
         : '<div class="vac"><b>Sin eventos</b>Añade el primero y aparecerá aquí.</div>',
    'Ver semana completa','calendario'));

  /* --- Alimentación --- */
  var rs = resumenSemana(), ali;
  if(rs.suficiente){
    ali = '<div class="sec-l">Alimentos distintos</div>' +
          '<div class="kpi"><b style="color:var(--ali-d)">'+rs.variedad+'</b>' +
          '<span>esta semana</span></div>' +
          '<div class="barra"><i style="width:'+Math.min(100, rs.variedad*3)+'%;' +
          'background:var(--ali)"></i></div>' +
          '<div class="sec-s">'+rs.diasConRegistro+' días registrados</div>';
  } else if(rs.diasConRegistro){
    ali = '<div class="vac"><b>'+rs.registrosHoy+' registros hoy</b>Faltan ' +
          (rs.minDias-rs.diasConRegistro)+' días para calcular el índice de la semana.</div>';
  } else {
    ali = '<div class="vac"><b>Sin registros</b>Aún no hay nada apuntado esta semana.</div>';
  }
  out.push(tarjeta('ali','alimentacion','Alimentación', ali,
    rs.diasConRegistro ? 'Ver resumen semanal' : 'Registrar comida','alimentacion'));

  /* --- Gastos --- */
  var ug = ultimoGasto(), gas;
  if(!state.data.gastos.length && !state.data.cuenta.length){
    gas = '<div class="vac"><b>Sin gastos</b>Cuando apuntéis alguno verás aquí la cuenta.</div>';
  } else {
    /* En la portada interesa el ritmo del mes, no el saldo: el saldo se
       mira cuando vas a pagar algo, y para eso ya entras en la sección. */
    var pr = pendientesReembolso();
    var ymH = mesDe(state.data.hoy);
    var gastadoMes = gastosDeMes(ymH).reduce(function(a,g){ return a + num(g.importe); }, 0);
    gas = '<div class="sec-l">Gastado en '+MESES[+ymH.split('-')[1]-1].toLowerCase()+'</div>' +
      '<div class="kpi"><b style="color:var(--gas-d)">'+eur(gastadoMes)+'</b></div>';
    if(pr.n){
      var aQuien = pr.papa >= pr.mama ? 'papa' : 'mama';
      gas += '<div class="chip-d"><span class="pt" style="background:'+colorDe(aQuien)+'"></span>' +
        '<span style="color:var(--t2)">'+eur(pr.papa+pr.mama)+' por devolver</span></div>';
    } else if(ug){
      gas += '<div class="sec-s">Último: '+esc(ug.descripcion||ug.categoria)+' · ' +
             eur(num(ug.importe))+'</div>';
    }
  }
  out.push(tarjeta('gas','gastos','Gastos', gas, 'Ver cuentas','gastos'));

  /* --- Salud --- */
  var meds = medicacionActiva(), cita = proximaCita(), sal;
  if(meds.length){
    var m = meds[0], ud = ultimaDosis(m.id);
    sal = '<div class="sec-l">Medicación activa</div>' +
          '<div class="sec-v">'+esc(m.nombre)+(m.dosis?' · '+esc(m.dosis):'')+'</div>' +
          '<div class="sec-s">'+(ud ? 'Última: '+esc(ud.hora||'')+', ' +
            esc(nombreDe(ud.dado_por).toLowerCase()) : 'Sin dosis registradas')+'</div>';
  } else if(cita){
    sal = '<div class="sec-l">Próxima revisión</div>' +
          '<div class="sec-v">'+esc(cita.motivo || cita.tipo || 'Cita')+'</div>' +
          '<div class="sec-s">'+fechaCorta(fechaKey(cita.fecha)) +
            (cita.hora?' · '+esc(cita.hora):'')+'</div>';
  } else {
    sal = '<div class="vac"><b>Todo al día</b>No hay nada pendiente ahora mismo.</div>';
  }
  out.push(tarjeta('sal','salud','Salud', sal, 'Ver historial de salud','salud'));

  $('#secs').innerHTML = out.join('');
}

function pintarSemana(){
  var lun = state.lunes || lunesDe(state.data.hoy);
  state.lunes = lun;
  var dom = addDays(lun,6), mismoMes = lun.slice(0,7)===dom.slice(0,7);
  $('#semTit').textContent = lun===lunesDe(state.data.hoy) ? 'Esta semana'
    : (mismoMes ? (+lun.split('-')[2])+'–'+(+dom.split('-')[2])+' '+MESES[+lun.split('-')[1]-1]
                : fechaCorta(lun)+' – '+fechaCorta(dom));
  $('#semPrev').innerHTML = svg('chevronI',16);
  $('#semNext').innerHTML = svg('chevron',16);

  /* Una columna de 48px no aguanta un título. Antes se metía icono, hora
     y nombre recortado dentro de cada día y no se leía nada. Ahora la
     columna solo dice de quién es el día, los eventos de un día son
     puntos, y lo que dura varios días se dibuja como una BANDA que
     cruza las columnas: así un viaje se ve como lo que es, un tramo. */
  var html = '';
  for(var i=0;i<7;i++){
    var f = addDays(lun,i), c = custodiaDe(f);
    var sueltos = eventosDe(f).filter(function(o){ return !esLargo(o.ev); });
    var cls = ['d', c.quien?claveColor(c.quien):'', (c.estimado&&c.quien)?'est':'',
               f===state.data.hoy?'hoy':''].filter(String).join(' ');
    var col = c.quien ? 'var(--'+claveColor(c.quien)+')' : 'var(--t3)';
    html += '<div class="'+cls+'">' +
      '<span class="dw">'+DOW_CORTO[i]+'</span>' +
      '<span class="nu">'+(+f.split('-')[2])+'</span>' +
      '<span class="i" style="color:'+col+'">'+svg('casa',16)+'</span>' +
      '<span class="qn">'+(c.quien?esc(nombreDe(c.quien)):'—')+'</span>' +
      '<div class="pts">' +
        sueltos.slice(0,3).map(function(o){
          return '<i style="background:'+tipoEvento(o.ev.tipo).color+'"></i>';
        }).join('') +
        (sueltos.length>3 ? '<span class="mas">+'+(sueltos.length-3)+'</span>' : '') +
      '</div></div>';
  }
  $('#semDias').innerHTML = html;
  $('#semBandas').innerHTML = bandasSemana(lun);

  /* La leyenda solo nombra lo que de verdad se ve como punto: las bandas
     ya llevan su nombre escrito dentro. */
  var usados = {};
  for(var j=0;j<7;j++){
    eventosDe(addDays(lun,j)).forEach(function(o){
      if(!esLargo(o.ev)) usados[String(o.ev.tipo)] = true;
    });
  }
  var tipos = state.data.tipos_evento.filter(function(t){ return usados[String(t.id)]; });
  var hayBandas = $('#semBandas').innerHTML !== '';
  $('#semLeg').innerHTML = tipos.length
    ? tipos.map(function(t){
        return '<span><i style="background:'+t.color+'"></i>'+esc(t.nombre)+'</span>'; }).join('')
    : (hayBandas ? '' : '<span style="color:var(--t3)">Sin eventos esta semana</span>');
}

/**
 * Bandas de lo que dura varios días, colocadas sobre la rejilla de 7.
 * Cada una ocupa las columnas que abarca DENTRO de esta semana, y las
 * puntas indican si viene de antes o sigue después.
 */
function bandasSemana(lun){
  var dom = addDays(lun,6), vistos = {}, bandas = [];
  state.data.eventos.forEach(function(ev){
    if(!esLargo(ev) || vistos[ev.id]) return;
    var ini = fechaKey(ev.fecha), fin = fechaKey(ev.fecha_fin) || ini;
    if(fin < lun || ini > dom) return;                 /* no toca esta semana */
    vistos[ev.id] = true;
    var desde = Math.max(0, diffDias(lun, ini));
    var hasta = Math.min(6, diffDias(lun, fin));
    bandas.push({ ev:ev, a:desde, b:hasta,
                  viene: ini < lun, sigue: fin > dom });
  });
  if(!bandas.length) return '';
  bandas.sort(function(x,y){ return x.a - y.a || (y.b-y.a) - (x.b-x.a); });
  return bandas.slice(0,3).map(function(b){
    var tp = tipoEvento(b.ev.tipo);
    return '<button class="bnd-s" data-calev="'+esc(b.ev.id)+'" ' +
      'style="grid-column:'+(b.a+1)+' / '+(b.b+2)+';background:'+tp.color+'18;' +
      'color:'+tp.color+';border-color:'+tp.color+'40">' +
      (b.viene ? '<span class="pt-a">‹</span>' : '') +
      svg(icoEvento(tp.id),13) +
      '<span class="nm">'+esc(b.ev.titulo)+'</span>' +
      (b.sigue ? '<span class="pt-a">›</span>' : '') +
      '</button>';
  }).join('') +
  (bandas.length>3 ? '<div class="bnd-mas">y '+(bandas.length-3)+' más</div>' : '');
}

/**
 * Recordatorio: una sola pieza accionable (§14).
 * Solo aparece si el evento trae una nota de acción Y no está ya
 * a la vista en la tarjeta de hoy. Repetir tres veces el mismo
 * dentista es la forma más rápida de que se deje de leer.
 */
/** ¿Está hecho el recordatorio de esta ocurrencia? Se guarda por
    evento + fecha: la mochila del viaje de agosto no es la de diciembre. */
function recordatorioHecho(evId, fecha){
  return state.data.recordatorios.some(function(r){
    return String(r.evento_id) === String(evId) && fechaKey(r.fecha) === fecha;
  });
}

function pintarRecordatorio(){
  var yaVisibles = proximosEventos(2).map(function(o){ return o.ev.id + '@' + o.fecha; });
  /* Un recado ya hecho deja de reclamar sitio: es lo que se pide de un
     recordatorio. Sigue en el evento, pero no en la portada. */
  var cand = proximosEventos(14).filter(function(o){
    return String(o.ev.accion||'').trim() &&
           yaVisibles.indexOf(o.ev.id + '@' + o.fecha) < 0 &&
           !recordatorioHecho(o.ev.id, o.fecha);
  })[0];
  if(!cand){ $('#cardRec').innerHTML = ''; return; }
  $('#cardRec').innerHTML =
    '<div class="rec"><button class="rc-ok" data-rechecho="'+esc(cand.ev.id) +
      '|'+cand.fecha+'" aria-label="Marcar como hecho"></button><div>' +
      '<div class="tt">Recordatorio</div>' +
      '<b>'+esc(cand.ev.titulo)+' · '+cuando(cand.fecha).toLowerCase() +
        (cand.hora?' a las '+esc(cand.hora):'')+'</b>' +
      '<p>'+esc(cand.ev.accion)+'</p>' +
    '</div><span class="ir" data-calev="'+esc(cand.ev.id)+'">' +
      svg('chevron',16)+'</span></div>';
}

function marcarRecordatorio(clave, hecho){
  var p = String(clave).split('|');
  cargando(true);
  llamarPost({ action:'marcarRecordatorio', payload:{
    evento_id:p[0], fecha:p[1], hecho:hecho, creado_por:state.user } })
    .then(function(){ return recargar(); })
    .then(function(){ cargando(false); if(hecho) toast('Hecho ✓'); })
    .catch(function(err){ cargando(false); toast(String(err.message||err), true); });
}

/* ============================================================
   ATENCIÓN
   Tres cosas del otro merecen no pasar desapercibidas: un mensaje
   del tablón, un día de custodia que se sale del convenio, y la
   salud en curso. No son avisos del registro de actividad: son
   ESTADOS que se calculan al pintar. Por eso no se apagan por
   entrar en la sección — se apagan cuando dejan de estar
   pendientes. Y por eso tampoco se guarda nada.
   ============================================================ */
var DIAS_VISTA_CUSTODIA = 14;   /* más allá no es urgente, es agenda */
var DIAS_VISTA_CITA     = 7;
var DIAS_EPISODIO       = 2;    /* una fiebre de hace 3 días ya no es noticia */

function atencion(){
  var out = [], hoy = state.data.hoy;

  mensajesSinLeer().forEach(function(m){
    out.push({ ico:'ticket', tit:'Mensaje de '+nombreDe(m.autor),
      sub:String(m.texto||'').replace(/\s+/g,' '), ir:'mensajes', id:m.id });
  });

  var tope = addDays(hoy, DIAS_VISTA_CUSTODIA);
  state.data.custodia.filter(function(c){
    var f = fechaKey(c.fecha);
    return f >= hoy && f <= tope &&
           String(c.origen||'') !== 'convenio' &&
           String(c.creado_por||'') !== state.user &&
           String(c.creado_por||'') !== 'convenio';
  }).sort(function(a,b){ return fechaKey(a.fecha).localeCompare(fechaKey(b.fecha)); })
    .forEach(function(c){
      out.push({ ico:'calendario', tit:'Cambio de custodia · '+fechaCorta(fechaKey(c.fecha)),
        sub: (fechaKey(c.fecha)===hoy ? 'Esta noche' : 'Esa noche') + ' duerme con ' +
             nombreDe(c.username).toLowerCase() +
             (c.motivo ? ' · '+String(c.motivo) : ''),
        ir:'calendario', dia:fechaKey(c.fecha) });
    });

  /* No hay campo "cerrado": un episodio se considera en curso mientras
     sea de los últimos DIAS_EPISODIO. Se apaga solo con el calendario. */
  state.data.episodios.filter(function(e){
    return fechaKey(e.fecha) >= addDays(hoy, -DIAS_EPISODIO) &&
           String(e.creado_por||'') !== state.user;
  }).sort(function(a,b){ return fechaKey(b.fecha).localeCompare(fechaKey(a.fecha)); })
    .forEach(function(e){
      out.push({ ico:'termometro', tit:'Episodio · '+(e.tipo||'salud'),
        sub:(fechaKey(e.fecha)===hoy ? 'Hoy' : fechaCorta(fechaKey(e.fecha))) + ' · ' +
            String(e.descripcion||e.evolucion||'sin detalle').replace(/\s+/g,' '),
        ir:'salud', id:e.id, tipo:'episodio' });
    });

  medicacionActiva().filter(function(m){
    return String(m.creado_por||'') !== state.user;
  }).forEach(function(m){
    out.push({ ico:'pastilla', tit:'Medicación en curso · '+(m.nombre||''),
      sub:(m.dosis||'') + (m.cada_horas ? ' cada '+m.cada_horas+' h' : ''),
      ir:'salud', id:m.id, tipo:'medicacion' });
  });

  var topeC = addDays(hoy, DIAS_VISTA_CITA);
  state.data.citas.filter(function(c){
    var f = fechaKey(c.fecha);
    return f >= hoy && f <= topeC && String(c.creado_por||'') !== state.user;
  }).sort(function(a,b){ return fechaKey(a.fecha).localeCompare(fechaKey(b.fecha)); })
    .forEach(function(c){
      out.push({ ico:'pediatra', tit:'Cita · '+(c.tipo||'médico'),
        sub:fechaCorta(fechaKey(c.fecha)) + (c.hora ? ' · '+c.hora : '') +
            (c.centro ? ' · '+c.centro : ''),
        ir:'salud', id:c.id, tipo:'cita' });
    });

  return out;
}

/* ============================================================
   ALIMENTACIÓN
   Nada se guarda calculado: raciones, variedad, alimentos nuevos
   e ÍCH salen de las filas de Comidas en cada render.
   ============================================================ */

/* Pesos del ICH (§19). Constantes a propósito: si vivieran en el Sheet,
   dos semanas dejarían de ser comparables entre sí. */
var ICH_PESOS = { variedad:40, grupos:25, nuevos:20, limites:15 };

/* Una toma cuenta entera si se la comió y media si solo la probó:
   para un niño, probar dos bocados de calabacín también es exposición. */
var VALOR_TOMA = { comio:1, probo:0.5, rechazo:0 };

/* Las cinco comidas del día. Esta lista es el respaldo: si la pestaña
   Tipos_Comida tiene filas, mandan ellas — nombre, emoji e icono. */
var TIPOS_COMIDA_FB = [
  {id:'desayuno', nom:'Desayuno', em:'🥣'}, {id:'almuerzo', nom:'Almuerzo', em:'🍎'},
  {id:'comida',   nom:'Comida',   em:'🍽️'}, {id:'merienda', nom:'Merienda', em:'🍪'},
  {id:'cena',     nom:'Cena',     em:'🌙'}, {id:'otro',     nom:'Otra',     em:'🍴'}
];
var TIPOS_COMIDA = TIPOS_COMIDA_FB;

/** Un tipo de comida por id, sin suponer nunca cuántos hay ni en qué orden. */
function tipoComida(id){
  return TIPOS_COMIDA.filter(function(x){ return x.id === String(id); })[0] ||
         TIPOS_COMIDA_FB.filter(function(x){ return x.id === String(id); })[0] ||
         { id:'otro', nom:'Otra', em:'🍴', emoji:'🍴', icono:'' };
}

/** Refresca TIPOS_COMIDA con lo que diga el Sheet. Se llama tras cargar. */
function tiposComidaDelSheet(){
  var filas = (state.data && state.data.tipos_comida) || [];
  if(!filas.length || !filas[0] || filas[0].id === undefined){
    TIPOS_COMIDA = TIPOS_COMIDA_FB;
    return;
  }
  /* Una fila del Sheet solo pisa lo que trae: quitar el nombre no debería
     dejar la comida sin etiqueta. */
  TIPOS_COMIDA = filas.map(function(r){
    var fb = TIPOS_COMIDA_FB.filter(function(x){ return x.id === String(r.id); })[0] || {};
    return { id:String(r.id), nom:String(r.nombre||fb.nom||r.id),
             em:String(r.emoji||fb.em||'🍴'), emoji:String(r.emoji||fb.em||'🍴'),
             icono:String(r.icono||'') };
  });
}
/* DÓNDE comió. Antes esto mezclaba dos preguntas distintas en un solo
   campo: "con papá" y "fuera" no se excluyen — se puede comer fuera con
   papá. Ahora `lugar` dice dónde y `con` dice a cargo de quién. */
var LUGARES_C = [
  {id:'casa',  nom:'En casa'}, {id:'cole', nom:'Cole'},
  {id:'fuera', nom:'Fuera'},   {id:'otros', nom:'Otros'}
];

/** Compatibilidad con lo apuntado antes de separar los dos campos. */
function migraComida(c){
  var l = String(c.lugar||'').trim().toLowerCase();
  if(l === 'papa' || l === 'mama'){
    if(!c.con) c.con = l;
    c.lugar = 'casa';
  }
  return c;
}
var ESTADOS_T = [
  {id:'comio',   nom:'Se lo comió', col:'var(--ali)'},
  {id:'probo',   nom:'Lo probó',    col:'var(--cal)'},
  {id:'rechazo', nom:'Lo rechazó',  col:'var(--t3)'}
];

function cfgNum(clave, defecto){
  var v = num(state.data.config[clave]);
  return v > 0 ? v : defecto;
}
function objetivosSemana(){ return state.data.objetivos_semana || []; }

/* ============================================================
   CRECIMIENTO

   Peso, talla y edad. La edad NO se guarda en ninguna parte: se calcula
   de la fecha de nacimiento, que va en Config. Guardar una edad sería
   guardar algo que caduca solo, y en tres meses estaría mal.
   ============================================================ */

/** Años y meses cumplidos en una fecha. null si no hay fecha de nacimiento. */
function edadEn(f){
  var nac = fechaKey(state.data.config.fecha_nacimiento || '');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(nac)) return null;
  var a = nac.split('-').map(Number), b = String(f).split('-').map(Number);
  if(b.length !== 3) return null;
  var meses = (b[0]-a[0])*12 + (b[1]-a[1]);
  if(b[2] < a[2]) meses--;
  if(meses < 0) return null;
  return { anios: Math.floor(meses/12), meses: meses%12, total: meses };
}
function edadTexto(f){
  var e = edadEn(f || state.data.hoy);
  if(!e) return '';
  if(e.anios < 2) return e.total + (e.total===1 ? ' mes' : ' meses');
  return e.anios + ' años' + (e.meses ? ' y ' + e.meses + (e.meses===1?' mes':' meses') : '');
}

/** Mediciones ordenadas de más antigua a más reciente. */
function medidas(){
  return (state.data.crecimiento||[]).slice().sort(function(a,b){
    return fechaKey(a.fecha).localeCompare(fechaKey(b.fecha));
  });
}
/** Última medición con ese campo relleno. Se miden por separado. */
function ultimaMedida(campo){
  var ms = medidas();
  for(var i = ms.length-1; i >= 0; i--){ if(num(ms[i][campo]) > 0) return ms[i]; }
  return null;
}
function objGrupo(g){
  return objetivosSemana().filter(function(o){ return String(o.grupo)===g; })[0] || null;
}
function alimento(id){
  return state.data.alimentos.filter(function(a){ return String(a.id)===String(id); })[0] || null;
}

/** Raciones de un grupo en un día. comió = 1 · probó = 0,5 · rechazó = 0 */
/**
 * Raciones de un grupo en un día.
 *
 * Cuenta por COMIDA, no por alimento: una ensalada con cinco verduras
 * es UNA ración de verdura, no cinco. Lo contrario premiaba apuntar con
 * detalle y castigaba apuntar rápido, que es justo al revés de lo que
 * interesa. Dentro de una comida se queda el estado más favorable: si
 * se comió el tomate y rechazó el pimiento, la verdura cuenta.
 */
function racionesDia(grupo, f){
  var porComida = {};
  state.data.comidas.forEach(function(c){
    if(fechaKey(c.fecha) !== f || String(c.grupo) !== grupo) return;
    var k = String(c.grupo_id || c.id);
    var v = VALOR_TOMA[String(c.estado_toma||'comio')] || 0;
    if(porComida[k] === undefined || v > porComida[k]) porComida[k] = v;
  });
  var n = 0;
  Object.keys(porComida).forEach(function(k){ n += porComida[k]; });
  return n;
}
function racionesSemana(grupo, lunes){
  var n = 0;
  for(var i=0;i<7;i++) n += racionesDia(grupo, addDays(lunes,i));
  return Math.round(n*10)/10;
}
function comidasDeSemana(lunes){
  var dom = addDays(lunes,6);
  return state.data.comidas.filter(function(c){
    var f = fechaKey(c.fecha); return f>=lunes && f<=dom;
  });
}
/** Alimentos concretos distintos que no fueron rechazados. */
function variedadDe(lunes){
  var s = {};
  comidasDeSemana(lunes).forEach(function(c){
    if(c.alimento_id && String(c.estado_toma)!=='rechazo') s[String(c.alimento_id)] = true;
  });
  return Object.keys(s);
}
/** Primera vez que aparece un alimento en TODO el histórico: eso es "nuevo". */
function primeraVezDe(){
  if(state._primeraVez) return state._primeraVez;
  var m = {};
  state.data.comidas.forEach(function(c){
    if(!c.alimento_id) return;
    var id = String(c.alimento_id), f = fechaKey(c.fecha);
    if(!m[id] || f < m[id]) m[id] = f;
  });
  state._primeraVez = m;
  return m;
}
function nuevosDe(lunes){
  var pv = primeraVezDe(), dom = addDays(lunes,6), out = [];
  Object.keys(pv).forEach(function(id){
    if(pv[id] >= lunes && pv[id] <= dom) out.push(id);
  });
  return out;
}
function diasConRegistro(lunes){
  var d = {};
  comidasDeSemana(lunes).forEach(function(c){ d[fechaKey(c.fecha)] = true; });
  return Object.keys(d).length;
}

/**
 * Índice de Construcción de Hábitos. No es una nota: mide si el
 * repertorio se amplía. Devuelve null si no hay datos suficientes,
 * porque un número inventado destruye la confianza en el indicador.
 */
function ich(lunes){
  var minDias = cfgNum('dias_min_ich', 3);
  var nd = diasConRegistro(lunes);
  if(nd < minDias) return null;

  var objVar = cfgNum('objetivo_variedad', 25);
  var sVar = Math.min(100, variedadDe(lunes).length / objVar * 100);

  var sumP = 0, sumR = 0;
  objetivosSemana().forEach(function(o){
    if(String(o.tipo) !== 'min') return;
    var obj = num(o.objetivo), p = num(o.peso) || 1;
    if(obj <= 0) return;
    sumP += p;
    sumR += p * Math.min(1, racionesSemana(String(o.grupo), lunes) / obj);
  });
  var sGrp = sumP ? (sumR / sumP * 100) : 100;

  var objNue = cfgNum('objetivo_nuevos', 2);
  var sNue = Math.min(100, nuevosDe(lunes).length / objNue * 100);

  var lp = 0, lr = 0;
  objetivosSemana().forEach(function(o){
    if(String(o.tipo) !== 'max') return;
    var obj = num(o.objetivo), p = num(o.peso) || 1;
    lp += p;
    var exceso = Math.max(0, racionesSemana(String(o.grupo), lunes) - obj);
    /* El margen de tolerancia es el propio objetivo: pasarse del doble
       es lo que agota la puntuación, no un solo capricho de más. */
    lr += p * (1 - Math.min(1, exceso / Math.max(1, obj)));
  });
  var sLim = lp ? (lr / lp * 100) : 100;

  var total = (ICH_PESOS.variedad*sVar + ICH_PESOS.grupos*sGrp +
               ICH_PESOS.nuevos*sNue + ICH_PESOS.limites*sLim) / 100;

  return { total: Math.round(total), dias: nd,
           comp: { variedad:Math.round(sVar), grupos:Math.round(sGrp),
                   nuevos:Math.round(sNue), limites:Math.round(sLim) } };
}

/* Mensajes: siempre en positivo y orientados a la oportunidad (§25).
   Se elige el primero que aplique, así el consejo es el más útil, no el más bonito. */
/* ============================================================
   ESTADÍSTICAS
   Todo se calcula al pintar, desde lo registrado. Nada se guarda.
   ============================================================ */

/** Cuántas veces aparece cada alimento, en todo el histórico o en un tramo. */
function rankingAlimentos(desde, hasta, n){
  var cuenta = {};
  state.data.comidas.forEach(function(c){
    if(!c.alimento_id) return;                       /* solo alimentos concretos */
    if(String(c.estado_toma) === 'rechazo') return;  /* rechazado no es consumido */
    var f = fechaKey(c.fecha);
    if(desde && f < desde) return;
    if(hasta && f > hasta) return;
    var k = String(c.alimento_id);
    cuenta[k] = (cuenta[k] || 0) + 1;
  });
  return Object.keys(cuenta).map(function(k){
    var a = alimento(k) || { id:k, nombre:'(borrado)', grupo:'otros' };
    return { id:k, nombre:String(a.nombre||''), grupo:String(a.grupo||'otros'),
             emoji:String(a.emoji||''), estado:String(a.estado||''), veces:cuenta[k] };
  }).sort(function(a,b){ return b.veces - a.veces || a.nombre.localeCompare(b.nombre); })
    .slice(0, n || 999);
}

/** El índice de las últimas n semanas, para ver la evolución. */
function serieIch(n){
  var out = [], lun = lunesDe(state.data.hoy);
  for(var i = n - 1; i >= 0; i--){
    var l = addDays(lun, -7 * i);
    out.push({ lunes:l, v: ich(l), variedad: variedadDe(l).length });
  }
  return out;
}

/** Cuántos alimentos distintos se han probado alguna vez, por grupo. */
function repertorioPorGrupo(){
  var vistos = {};
  state.data.comidas.forEach(function(c){
    if(c.alimento_id && String(c.estado_toma) !== 'rechazo') vistos[String(c.alimento_id)] = true;
  });
  var por = {};
  Object.keys(vistos).forEach(function(id){
    var a = alimento(id);
    if(!a) return;
    var g = String(a.grupo || 'otros');
    por[g] = (por[g] || 0) + 1;
  });
  return por;
}

/* ---------- GRÁFICAS ----------
   Una sola serie por gráfica, un solo color. Colorear cada barra según
   su tamaño sería pintar dos veces el mismo dato y gastar el único
   canal libre que queda. La rejilla es una línea fina, nunca de puntos.
   Y el valor va escrito al lado de cada barra: un tooltip no puede ser
   la única forma de leer un número. */

/** Barras horizontales ordenadas. Es a la vez gráfica y tabla. */
function barrasH(filas, color){
  if(!filas.length) return '';
  var max = Math.max.apply(null, filas.map(function(f){ return f.v; })) || 1;
  return '<div class="bh">' + filas.map(function(f){
    var pc = Math.max(2, Math.round(f.v / max * 100));
    return '<div class="bh-r">' +
      '<span class="nm">'+(f.em ? '<i>'+esc(f.em)+'</i>' : '')+esc(f.n)+'</span>' +
      '<span class="tr"><i style="width:'+pc+'%;background:'+color+'"></i></span>' +
      '<span class="vl">'+esc(String(f.t !== undefined ? f.t : f.v))+'</span>' +
      '</div>';
  }).join('') + '</div>';
}

/**
 * Línea de evolución. Un solo trazo, sin leyenda (el título ya lo
 * nombra), con el último punto etiquetado y el eje llevando el resto.
 * El alto incluye la banda del eje: si no, el card se queda con un
 * scroll interno de dos píxeles.
 */
function lineaEvolucion(puntos, color){
  var conDato = puntos.filter(function(p){ return p.y !== null; });
  if(conDato.length < 2) return '';
  /* Deja hueco a la izquierda para las etiquetas del eje: sin escala,
     un "29" suelto no dice si es mucho o poco. */
  var W = 320, H = 96, P = 6, EJE = 20, EY = 20;
  var max = 100, min = 0;
  var x = function(i){ return EY + P + i * (W - EY - P*2) / (puntos.length - 1); };
  var y = function(v){ return P + (1 - (v - min) / (max - min)) * (H - P*2); };

  var d = '', primero = true;
  puntos.forEach(function(p, i){
    if(p.y === null){ primero = true; return; }
    d += (primero ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(p.y).toFixed(1) + ' ';
    primero = false;
  });

  var ult = null;
  for(var i = puntos.length - 1; i >= 0; i--){ if(puntos[i].y !== null){ ult = i; break; } }

  return '<div class="ln-c"><svg viewBox="0 0 '+W+' '+(H+EJE)+'" ' +
    'preserveAspectRatio="none" class="ln-svg" aria-hidden="true">' +
    /* Rejilla: dos líneas finas, sólidas, un tono por debajo del fondo */
    [0,50,100].map(function(v){
      return '<line x1="'+(EY+P)+'" x2="'+(W-P)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+
        '" stroke="var(--border)" stroke-width="1"/>' +
        '<text x="'+(EY-2)+'" y="'+(y(v)+3.5).toFixed(1)+'" text-anchor="end" ' +
        'font-size="9" fill="var(--t3)">'+v+'</text>';
    }).join('') +
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' +
    puntos.map(function(p, i){
      if(p.y === null) return '';
      var r = i === ult ? 5 : 3.5;
      return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" r="'+r+'" ' +
        'fill="'+color+'" stroke="var(--surface)" stroke-width="2"/>';
    }).join('') +
    '</svg><div class="ln-x">' + puntos.map(function(p){
      return '<span>'+esc(p.x)+'</span>';
    }).join('') + '</div></div>' +
    '<div class="ln-nota">Semanas sin datos suficientes no dibujan punto.</div>' +
    (ult !== null ? '<div class="ln-ult">Última semana: <b>'+puntos[ult].y+'</b></div>' : '');
}

/**
 * Evolución de una medida con escala propia.
 *
 * `lineaEvolucion` está clavada a 0-100 porque dibuja el índice semanal;
 * un peso de 26,4 kg ahí sería una raya pegada al suelo. Esta calcula su
 * escala y redondea los extremos para que las etiquetas del eje sean
 * números que alguien diría en voz alta.
 *
 * Una serie por gráfica, siempre. Peso y talla se miden en unidades
 * distintas: meterlas en el mismo dibujo con dos escalas inventaría una
 * relación entre las dos que no está en los datos.
 */
function lineaMedida(puntos, color, unidad){
  if(puntos.length < 2) return '';
  var vs = puntos.map(function(p){ return p.y; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  /* Un margen del 12% arriba y abajo: sin él, el primer y el último punto
     se pegan al borde y la línea parece que se sale. */
  var pad = Math.max((hi - lo) * 0.12, hi * 0.02, 0.5);
  var min = Math.floor(lo - pad), max = Math.ceil(hi + pad);
  if(max <= min) max = min + 2;
  /* Que el recorrido sea par: así la marca de en medio es un entero. Con
     extremos 114 y 131,5 el centro salía "122,8", que nadie diría en voz
     alta y no ayuda a leer la gráfica. */
  if((max - min) % 2) max++;

  var W = 320, H = 104, P = 8, EJE = 22, EY = 30;
  var x = function(i){ return EY + P + i * (W - EY - P*2) / (puntos.length - 1); };
  var y = function(v){ return P + (1 - (v - min) / (max - min)) * (H - P*2); };
  var fmt = function(v){ return (Math.round(v*10)/10).toLocaleString('es-ES'); };

  var d = puntos.map(function(p, i){
    return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.y).toFixed(1);
  }).join(' ');
  var ult = puntos.length - 1;

  return '<div class="ln-c"><svg viewBox="0 0 '+W+' '+(H+EJE)+'" ' +
    'preserveAspectRatio="none" class="ln-svg" aria-hidden="true">' +

        'font-size="9" fill="var(--t3)">'+fmt(v)+'</text>';

    puntos.map(function(p, i){
      return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" ' +
        'r="'+(i===ult?5:3.5)+'" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/>';
    }).join('') +

      esc(puntos[ult].x)+'</div>';
}

function mensajeSemana(lunes){
  var i = ich(lunes);
  var nuevos = nuevosDe(lunes).length;
  var v = variedadDe(lunes).length;
  var vAnt = variedadDe(addDays(lunes,-7)).length;
  var corto = state.data.config.nombre_corto || 'Gina';

  if(!i){
    return { k:'ich_empezando', em:'🌱', t:'Aún estamos empezando',
      p:'Con tres días registrados esta semana ya se puede calcular el índice.' };
  }
  if(nuevos >= 2){
    return { k:'ich_genial', em:'🌟', t:'¡Gran trabajo!',
      p:'Habéis introducido ' + nuevos + ' alimentos nuevos y la variedad sigue en aumento.' };
  }
  if(nuevos === 1){
    return { k:'ich_nuevo', em:'✨', t:'Un alimento nuevo esta semana',
      p:'Lo importante ahora es repetir la experiencia dentro de unos días.' };
  }
  if(v > vAnt && vAnt > 0){
    return { k:'ich_progreso', em:'📈', t:'Más variedad que la semana pasada',
      p:corto+' ha conocido '+(v-vAnt)+' alimentos más que la anterior. Ese progreso vale muchísimo.' };
  }
  /* Grupo saludable más lejos de su objetivo → una sola prioridad, nunca dos */
  var flojo = null, peor = 1;
  objetivosSemana().forEach(function(o){
    if(String(o.tipo)!=='min') return;
    var obj = num(o.objetivo);
    if(obj<=0) return;
    var r = racionesSemana(String(o.grupo), lunes) / obj;
    if(r < peor){ peor = r; flojo = o; }
  });
  if(flojo && peor < 0.5){
    return { k:'ich_oportunidad', em: String(flojo.emoji||'🥦'), t:'Una oportunidad',
      p:'Esta semana ha aparecido poco '+String(flojo.nombre||flojo.grupo).toLowerCase()+
        '. Buscad una ocasión sencilla para introducirlo.' };
  }
  return { k:'ich_bien', em:'💚', t:'Buena semana',
    p:'Hay bastante variedad. Mantened el ritmo.' };
}

function arcoGauge(pct, px){
  var r = 44, c = 2*Math.PI*r, ini = c*0.25;   /* hueco inferior de 90° */
  var largo = (c - ini) * Math.max(0, Math.min(100, pct)) / 100;
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 104 104">' +
    '<circle cx="52" cy="52" r="'+r+'" fill="none" stroke="var(--ali-s)" stroke-width="9" ' +
      'stroke-linecap="round" stroke-dasharray="'+(c-ini)+' '+c+'" ' +
      'transform="rotate(135 52 52)"/>' +
    '<circle cx="52" cy="52" r="'+r+'" fill="none" stroke="var(--ali)" stroke-width="9" ' +
      'stroke-linecap="round" stroke-dasharray="'+largo+' '+c+'" ' +
      'transform="rotate(135 52 52)"/></svg>';
}

/* ============================================================
   QUÉ CONVIENE PARA LA SIGUIENTE COMIDA

   La app no dice si ha comido bien o mal: eso no se decide en una
   comida. Solo responde a la pregunta práctica de quien está delante
   de la nevera — qué falta y qué ya está cubierto.

   Todo se calcula al pintar, desde lo registrado. No hay IA aquí:
   con los objetivos semanales del Sheet basta y sobra.
   ============================================================ */

/** ¿Qué comida toca ahora? La siguiente que no esté ya registrada hoy. */
function siguienteComida(){
  var h = new Date().getHours();
  var orden = ['desayuno','almuerzo','comida','merienda','cena'];
  var hechas = {};
  comidasDelDia(state.data.hoy).forEach(function(c){ hechas[String(c.tipo)] = true; });
  var toca = h < 10 ? 'desayuno' : h < 12 ? 'almuerzo' : h < 15 ? 'comida'
           : h < 18 ? 'merienda' : 'cena';
  var i = orden.indexOf(toca);
  for(; i < orden.length; i++){ if(!hechas[orden[i]]) return orden[i]; }
  return '';                                   /* el día ya está completo */
}

/**
 * Qué falta y qué sobra, mirando el día Y la semana.
 * Devuelve listas ordenadas por urgencia real, no por peso teórico.
 */
function consejoComida(){
  var hoy = state.data.hoy, lun = lunesDe(hoy);
  var diasPasados = diffDias(lun, hoy) + 1;
  var faltan = [], cubiertos = [], pasados = [];

  objetivosSemana().forEach(function(o){
    var g = String(o.grupo), obj = num(o.objetivo);
    if(!obj) return;
    var sem = racionesSemana(g, lun), dia = racionesDia(g, hoy);

    if(String(o.tipo) === 'max'){
      if(sem > obj) pasados.push({ o:o, sem:sem, obj:obj });
      return;
    }
    /* Lo que tocaría llevar a estas alturas de la semana, no el total:
       pedir 14 raciones de verdura un lunes no ayuda a nadie. */
    var esperado = obj * (diasPasados / 7);
    if(dia > 0){ cubiertos.push({ o:o, dia:dia }); return; }
    if(sem < esperado * 0.75) faltan.push({ o:o, sem:sem, obj:obj, deuda:esperado - sem });
  });

  faltan.sort(function(a,b){ return b.deuda - a.deuda; });
  cubiertos.sort(function(a,b){ return b.dia - a.dia; });
  return { faltan:faltan, cubiertos:cubiertos, pasados:pasados,
           comida:siguienteComida(), dias:diasPasados };
}

function pintarConsejo(){
  var c = consejoComida();
  var nom = { desayuno:'el desayuno', almuerzo:'el almuerzo', comida:'la comida',
              merienda:'la merienda', cena:'la cena' }[c.comida] || '';
  var reg = comidasDelDia(state.data.hoy).length;

  /* Sin nada registrado hoy no hay nada que aconsejar: inventarlo sería
     justo lo que el planteamiento pide no hacer. */
  if(!reg){
    return '<div class="cons"><div class="cons-hd">' + svg('destello',16) +
      '<b>' + (nom ? 'Para ' + nom : 'Hoy') + '</b></div>' +
      '<p class="cons-vacio">Cuando apuntéis la primera comida del día, aquí ' +
      'aparecerá qué conviene para la siguiente.</p></div>';
  }

  var h = '<div class="cons"><div class="cons-hd">' + svg('destello',16) +
    '<b>' + (nom ? 'Para ' + nom : 'Por hoy ya está') + '</b></div>';

  if(c.faltan.length){
    h += '<ul class="cons-l">' + c.faltan.slice(0,3).map(function(f){
      return '<li class="si"><span class="em">'+ico(f.o,17,'•')+'</span>' +
        '<span>'+esc(String(f.o.nombre||f.o.grupo))+'</span></li>';
    }).join('') + '</ul>';
  }

  var lineas = [];
  if(c.cubiertos.length){
    lineas.push('Hoy ' + listaEs(c.cubiertos.slice(0,3).map(function(x){
      return String(x.o.nombre||x.o.grupo).toLowerCase(); })) +
      (c.cubiertos.length === 1 ? ' ya está' : ' ya están') + ': no hace falta insistir.');
  }
  if(!c.faltan.length && !c.cubiertos.length){
    lineas.push('La semana va equilibrada. Lo que apetezca.');
  } else if(!c.faltan.length){
    lineas.push('No falta ningún grupo a estas alturas de la semana.');
  }
  c.pasados.slice(0,2).forEach(function(p){
    lineas.push(String(p.o.nombre||p.o.grupo) + ': ya van ' +
      String(Math.round(p.sem*10)/10).replace('.',',') + ' esta semana, de ' + p.obj + '.');
  });

  h += lineas.map(function(l){ return '<p class="cons-p">'+esc(l)+'</p>'; }).join('');
  return h + '</div>';
}

/** "verdura, fruta y pescado" — con la coma y la y en su sitio. */
function listaEs(a){
  if(!a.length) return '';
  if(a.length === 1) return a[0];
  return a.slice(0,-1).join(', ') + ' y ' + a[a.length-1];
}

function pintarAlimentacion(){
  var lun = state.aliLunes || lunesDe(state.data.hoy);
  state.aliLunes = lun;
  var dom = addDays(lun,6);
  var esActual = lun === lunesDe(state.data.hoy);
  var mismoMes = lun.slice(0,7)===dom.slice(0,7);

  /* Orden de la pantalla, de lo que se usa a diario a lo que se consulta:
       1. el índice de la semana
       2. las comidas de HOY, que es a lo que vienes
       3. qué conviene para la siguiente
       4. el selector de semana y la tabla, juntos: son la misma cosa */
  var navSem = '<div class="ali-nav">' +
    '<button class="fl" id="aliPrev">'+svg('chevronI',17)+'</button>' +
    '<div class="rango">'+svg('calendario',18) +

      '<span>'+(+lun.split('-')[2])+(mismoMes?'':' '+MESES[+lun.split('-')[1]-1]) +
      ' – '+(+dom.split('-')[2])+' '+MESES[+dom.split('-')[1]-1]+'</span></div></div>' +
    '<button class="fl" id="aliNext"'+(esActual?' style="visibility:hidden"':'')+'>' +
      svg('chevron',17)+'</button></div>';

  var out = '';

  /* ---- ICH ---- */
  var i = ich(lun), iAnt = ich(addDays(lun,-7));
  if(i){
    var d = iAnt ? i.total - iAnt.total : null;
    var comps = [
      {em:'🌿', nm:'Variedad',      v:i.comp.variedad, p:ICH_PESOS.variedad, c:'var(--ali-d)'},
      {em:'💚', nm:'Grupos saludables', v:i.comp.grupos, p:ICH_PESOS.grupos, c:'var(--ali-d)'},
      {em:'⭐', nm:'Nuevos alimentos', v:i.comp.nuevos, p:ICH_PESOS.nuevos, c:'var(--cal-d)'},
      {em:'🛡️', nm:'Límites',       v:i.comp.limites,  p:ICH_PESOS.limites, c:'var(--sal-d)'}
    ];
    out += '<div class="ich-c"><div class="ich-top">' +
      '<div class="gauge">'+arcoGauge(i.total,104) +
        '<div class="tx"><span class="lb">ICH</span>' +
        '<span class="vl">'+i.total+'</span><span class="mx">/100</span></div></div>' +
      '<div class="ich-tx"><h3>Índice de Construcción de Hábitos</h3>' +
        (d===null
          ? '<div class="ich-delta">Primera semana con datos suficientes</div>'
          : '<div class="ich-delta">'+(d>0?'↑':d<0?'↓':'→')+' <b style="color:' +
            (d>0?'var(--ali-d)':d<0?'var(--t2)':'var(--t2)')+'">'+(d>0?'+':'')+d+
            ' pts</b> vs semana pasada</div>') +
        '<div class="ich-chip">'+(i.total>=80?'¡Buena evolución! ⭐':
           i.total>=60?'Vais construyendo 🌱':'Semana tranquila 🍃')+'</div>' +
      '</div></div>' +
      '<div class="ich-comp">' + comps.map(function(c){
        return '<div><div class="em">'+c.em+'</div><div class="nm">'+c.nm+'</div>' +
          '<div class="pc" style="color:'+c.c+'">'+c.v+'</div>' +
          '<div class="pe">peso '+c.p+'%</div></div>';
      }).join('') + '</div></div>';
  } else {
    var nd = diasConRegistro(lun), md = cfgNum('dias_min_ich',3);
    out += '<div class="ich-c"><div class="ich-top">' +
      '<div class="gauge">'+arcoGauge(0,104) +
        '<div class="tx"><span class="lb">ICH</span>' +
        '<span class="vl" style="color:var(--t3)">—</span></div></div>' +
      '<div class="ich-tx"><h3>Aún no hay datos suficientes</h3>' +
      '<div class="ich-delta">'+nd+' de '+md+' días registrados esta semana. ' +
      'Sin eso, el índice sería un número inventado.</div></div></div></div>';
  }

  var dia = (state.aliDia && state.aliDia>=lun && state.aliDia<=dom)
    ? state.aliDia : (esActual ? state.data.hoy : lun);
  state.aliDia = dia;
  out += pintarDiaComidas(dia);

  /* ---- Qué conviene para la siguiente ---- */
  if(esActual) out += pintarConsejo();
  if(esActual) out += pintarInsights();

  /* ---- Selector de semana + tabla, juntos ---- */
  var objs = objetivosSemana();
  if(objs.length){
    var cab = '';
    for(var k=0;k<7;k++){
      var f = addDays(lun,k), es = f===state.data.hoy;
      cab += '<th class="'+(es?'hoy':'')+'">'+DOW_INI[k] +
             '<b>'+(+f.split('-')[2])+'</b></th>';
    }
    /* TODOS los grupos, siempre. Antes se cortaba a 8 detrás de un botón
       que ni siquiera estaba enganchado: lo que quedaba escondido eran
       justo los límites (carne roja, ultraprocesados, caprichos), que es
       lo que más interesa mirar. Un panel de nutrición que esconde media
       tabla no sirve para nada. */
    function filaGrupo(o){
      var g = String(o.grupo), lim = String(o.tipo)==='max';
      var tds = '';
      for(var k2=0;k2<7;k2++){
        var r = racionesDia(g, addDays(lun,k2));
        var cls = r<=0 ? '' : (lim ? 'lim' : (r>=1 ? 'on' : 'md'));
        tds += '<td><span class="pt-d '+cls+'"></span></td>';
      }
      var tot = racionesSemana(g, lun), obj = num(o.objetivo);
      var clsO = lim ? (tot>obj ? 'pas' : '') : (tot>=obj ? 'cum' : '');

      return '<tr><td class="g"><em>'+ico(o,15,'•')+'</em>'+esc(o.nombre||g)+'</td>' +
        tds + '<td class="o '+clsO+'">'+totTx+' / '+obj+'</td></tr>';
    }
    /* Los dos bloques se leen al revés: arriba llegar, abajo no pasarse.
       Mezclados, un punto verde y un punto naranja dicen cosas opuestas
       sin avisar. */
    var minimos = objs.filter(function(o){ return String(o.tipo)!=='max'; });
    var limites = objs.filter(function(o){ return String(o.tipo)==='max'; });
    var filas = minimos.map(filaGrupo).join('');
    if(limites.length){
      filas += '<tr class="sep"><td class="g" colspan="9">Sin pasarse</td></tr>' +
               limites.map(filaGrupo).join('');
    }
    out += '<div class="tabla">' + navSem + '<table class="tb">' +
      '<tr><th class="g">Grupo</th>'+cab+'<th class="o">Objetivo</th></tr>' +
      filas + '</table></div>';
  }

  /* ---- Mensaje ---- */
  var m = mensajeSemana(lun);
  out += '<div class="msg"><div class="em">'+iconoDe(m.k, 30, m.em)+'</div>' +
    '<div><b>'+esc(m.t)+'</b><p>'+esc(m.p)+'</p></div></div>';

  /* ---- Al fondo, lo que se consulta de vez en cuando ---- */
  out += '<div class="ali-pies">' +
    '<button id="aliBib">'+svg('carpeta',18) +
      '<div><b>Biblioteca de alimentos</b>' +
      '<span>'+state.data.alimentos.length+' dados de alta · buscar y corregir</span></div>' +
      svg('chevron',15)+'</button>' +
    '<button id="aliStats">'+svg('grafica',18) +
      '<div><b>Estadísticas</b><span>Lo que más come y cómo evoluciona</span></div>' +
      svg('chevron',15)+'</button>' +
    '</div>';

  $('#aliCuerpo').innerHTML = out;

  var vv = variedadDe(lun).length;
  $('#aliSub').textContent = vv
    ? vv + ' alimentos distintos esta semana'
    : 'Variedad y hábitos, semana a semana.';
}

/** Comidas de un día agrupadas por grupo_id, en orden de hora. */
function comidasDelDia(f){
  var g = {};
  state.data.comidas.forEach(function(c){
    if(fechaKey(c.fecha) !== f) return;
    var k = String(c.grupo_id || c.id);
    if(!g[k]) g[k] = { grupo_id:k, hora:String(c.hora||''), tipo:String(c.tipo_comida||'otro'),
                       lugar:String(c.lugar||''), con:String(c.con||''),
                       nombre:String(c.nota||''), items:[] };
    g[k].items.push(c);
  });
  return Object.keys(g).map(function(k){ return g[k]; })
    .sort(function(a,b){ return (a.hora||'99:99').localeCompare(b.hora||'99:99'); });
}
/** Color del grupo predominante: informa de QUÉ comió, no de si estuvo bien. */
function colorComida(items){
  var cuenta = {};
  items.forEach(function(it){
    var g = String(it.grupo||'otros');
    cuenta[g] = (cuenta[g]||0) + (VALOR_TOMA[String(it.estado_toma||'comio')]||0);
  });
  var mejor = null, max = 0;
  Object.keys(cuenta).forEach(function(g){ if(cuenta[g]>max){ max=cuenta[g]; mejor=g; } });
  return COLOR_GRUPO[mejor] || 'var(--t3)';
}
/* Tonos apagados a propósito: ninguno puede confundirse con el azul de papá,
   el rojo de mamá, el lila de Gina ni el rojo de alerta. El color de una
   comida dice QUÉ comió, nunca si estuvo bien. */
var COLOR_GRUPO = {
  verduras:'#4C9A5C', fruta:'#E08A3C', legumbres:'#A2704A', pescado:'#4FA3B0',
  proteina_blanca:'#C99A5B', carnes_rojas:'#8C5A5A', huevos:'#DDB341',
  lacteos:'#7C86C4', frutos_secos:'#8A6A4B', cereales:'#C9A44C',
  ultraprocesado:'#9AA6B2', capricho:'#C58BB0', permitido:'#8894A6',
  agua:'#6FA8D6', otros:'#9AA6B2'
};
/**
 * Las cinco comidas del día, SIEMPRE las cinco.
 *
 * Antes solo salían las registradas y había un "Añadir comida" abajo,
 * así que para apuntar la merienda había que abrir un formulario y
 * elegir "merienda" a mano. Con las cinco a la vista, apuntar es tocar
 * la que toca: un gesto en vez de tres.
 */
function pintarDiaComidas(f){
  var cs = comidasDelDia(f);
  var porTipo = {};
  cs.forEach(function(c){ (porTipo[c.tipo] = porTipo[c.tipo] || []).push(c); });

  var titulo = f===state.data.hoy ? 'Hoy'
             : f===addDays(state.data.hoy,-1) ? 'Ayer'
             : fechaCorta(f);
  var lun = state.aliLunes;

  /* Tira de días de la semana: cambiar de día no debería obligar a
     salir de aquí. */
  var tira = '<div class="dtira">' + [0,1,2,3,4,5,6].map(function(i){
    var d = addDays(lun,i), on = d===f, fut = d > state.data.hoy;
    var n = comidasDelDia(d).length;
    return '<button class="dt'+(on?' on':'')+(fut?' fut':'')+'" data-alidia="'+d+'">' +
      '<span class="dw">'+DOW_INI[i]+'</span><span class="nu">'+(+d.split('-')[2])+'</span>' +
      '<span class="pt'+(n?' hay':'')+'"></span></button>';
  }).join('') + '</div>';

  var filas = TIPOS_COMIDA.filter(function(t){ return t.id !== 'otro'; }).map(function(t){
    var lista = porTipo[t.id] || [];
    if(!lista.length){
      return '<button class="cm sinp" data-nuevacomida="'+t.id+'">' +
        '<span class="em">'+ico(t,20,t.em)+'</span>' +
        '<div class="tx"><b>'+esc(t.nom)+'</b><p>Sin apuntar</p></div>' +
        '<span class="ad">'+svg('mas',15)+'</span></button>';
    }
    return lista.map(function(c){
      var partes = resumenComida(c);
      return '<button class="cm" data-comida="'+esc(c.grupo_id)+'">' +
        '<span class="em">'+ico(t,20,t.em)+'</span>' +
        '<div class="tx"><b>'+esc(c.nombre || t.nom)+'</b>' +
          '<p>'+partes+'</p></div>' +
        '<span class="hr">'+esc(c.hora||'')+'</span>' +
        '<span class="ed">'+svg('lapiz',14)+'</span></button>';
    }).join('');
  }).join('');

  /* Las que no encajan en ninguna de las cinco (tipo "otra") van al final. */
  (porTipo['otro'] || []).forEach(function(c){
    filas += '<button class="cm" data-comida="'+esc(c.grupo_id)+'">' +
      '<span class="em">'+ico(tipoComida('otro'),20,'🍴')+'</span>' +
      '<div class="tx"><b>'+esc(c.nombre || 'Otra')+'</b><p>'+resumenComida(c)+'</p></div>' +
      '<span class="hr">'+esc(c.hora||'')+'</span>' +
      '<span class="ed">'+svg('lapiz',14)+'</span></button>';
  });

  return '<div class="comidas"><div class="cm-hd"><h3>'+esc(titulo)+'</h3>' +
    '<button class="cm-add" id="addComida">'+svg('mas',14)+' Otra</button></div>' +
    tira + '<div class="cm-l">' + filas + '</div></div>';
}

/**
 * En la tarjeta del día se ve el NOMBRE del plato y sus categorías.
 * Nada más: listar ahí todos los alimentos convertía la tarjeta en un
 * muro de texto y tapaba lo único que se lee de un vistazo — qué comió
 * y de qué grupos fue.
 */
function resumenComida(c){
  /* Las categorías de TODA la comida, vengan de un check o de un
     alimento: para los objetivos valen lo mismo, así que esconder las
     de los alimentos detrás de un "+2 más" ocultaba justo lo que se
     mira de un vistazo. Cada una sale una vez. */
  var vistos = {}, grupos = [];
  c.items.forEach(function(it){
    var g = String(it.grupo);
    if(vistos[g]) return;
    vistos[g] = true;
    var o = objGrupo(g);
    grupos.push(String((o && o.nombre) || g));
  });
  var out = grupos.slice(0,3).map(function(g){
    return '<i class="gp">'+esc(g)+'</i>'; }).join('');
  if(grupos.length > 3) out += '<span class="ex">+'+(grupos.length-3)+' más</span>';
  return out || '<span class="ex">Sin categorías</span>';
}

   HOJA DE REGISTRO DE COMIDA
   ============================================================ */
var borrador = null;

function abrirComida(grupoId, tipo){
  var base = { grupo_id:'', fecha:state.aliDia || state.data.hoy, hora:'',
               tipo_comida:tipo || '', lugar:'', items:[] };
  if(grupoId){
    var c = comidasDelDia(state.aliDia).filter(function(x){ return x.grupo_id===grupoId; })[0];
    if(c && c.items.length && !esMio(c.items[0])){
      var t0 = TIPOS_COMIDA.filter(function(x){ return x.id===c.tipo; })[0] || tipoComida('otro');
      return hojaAjena(t0.nom + (c.hora ? ' · '+c.hora : ''),
        c.items.map(function(it){
          var e = String(it.estado_toma);
          return [String(it.nombre||''),
                  e==='comio' ? 'Se lo comió' : e==='probo' ? 'Lo probó' : 'Lo rechazó'];
        }), c.items[0].creado_por);
    }
    if(c){
      /* El nombre del plato vive en `nota`. Sin recuperarlo aquí, editar
         una comida para corregir un check la dejaba sin nombre. */
      base = { grupo_id:c.grupo_id, fecha:state.aliDia, hora:c.hora, tipo_comida:c.tipo,
        lugar:c.lugar, con:c.con, plato:String(c.nombre||''), items:c.items.map(function(it){
          return { alimento_id:String(it.alimento_id||''), nombre:String(it.nombre||''),
                   grupo:String(it.grupo||'otros'), estado_toma:String(it.estado_toma||'comio'),
                   emoji:(alimento(it.alimento_id)||{}).emoji || '' };
        })};
    }
  }
  if(!base.tipo_comida){
    var h = new Date().getHours();
    base.tipo_comida = h<11 ? 'desayuno' : h<13 ? 'almuerzo' : h<16 ? 'comida'
                     : h<19 ? 'merienda' : 'cena';
  }
  if(!base.hora){
    var n = new Date();
    base.hora = pad(n.getHours())+':'+pad(n.getMinutes());
  }
  if(!base.lugar) base.lugar = 'casa';
  /* A cargo de: quien tenga la custodia ese día acierta casi siempre. */
  if(!base.con) base.con = custodiaDe(base.fecha).quien || state.user;
  borrador = base;
  pintarHojaComida();
}

function pintarHojaComida(){
  var b = borrador;
  var h = '<h3>'+(b.grupo_id?'Editar comida':'Nueva comida')+'</h3>';

  h += '<div class="f-lb">Qué comida es</div><div class="chips" id="chTipo">' +
    TIPOS_COMIDA.map(function(t){
      return '<button class="chip'+(b.tipo_comida===t.id?' on':'')+'" data-tipo="'+t.id+'">' +
        ico(t,15,t.em)+' '+esc(t.nom)+'</button>';
    }).join('') + '</div>';

  h += '<div class="f-lb">Hora</div>' +
    '<input class="inp" id="inHora" style="width:130px" type="time" ' +
      'value="'+esc(horaHHMM(b.hora))+'">';

  h += '<div class="f-lb">Dónde</div><div class="chips" id="chLugar">' +
    LUGARES_C.map(function(l){
      return '<button class="chip'+(b.lugar===l.id?' on':'')+'" data-lugar="'+l.id+'">' +
        esc(l.nom)+'</button>'; }).join('') + '</div>';

  /* En el cole no come ni con papá ni con mamá: preguntarlo ahí es
     obligar a contestar una pregunta que no tiene respuesta. */
  if(b.lugar !== 'cole'){
    h += '<div class="f-lb">A cargo de</div><div class="chips" id="chCon">' +
      casasDisponibles().map(function(u){
        var k = claveColor(u.username), on = b.con === u.username;
        return '<button class="chip'+(on?' on':'')+'" data-con="'+esc(u.username)+'" ' +
          (on ? 'style="background:var(--'+k+'-s);color:var(--'+k+'-d);' +
                'border-color:var(--'+k+')"' : '') + '>' + esc(u.nombre)+'</button>';
      }).join('') + '</div>';
  }

  /* ---------- LA COMIDA ----------
     El plato es lo que se comió: "Tequeños con guacamole". Lo que cuenta
     para los objetivos son sus CATEGORÍAS, no una lista de ingredientes.
     Nadie va a dar de alta "tequeños" como alimento, ni tiene por qué. */
  h += '<div class="f-lb">El plato</div>' +
    '<input class="inp" id="inPlato" type="text" placeholder="Tequeños con guacamole…" ' +
      'value="'+esc(b.plato||'')+'" autocomplete="off" autocorrect="off">' +
    /* Un input de foto SIN `capture` hace que el móvil pregunte solo:
       "Cámara / Fototeca". Poner dos botones era duplicar un menú que el
       sistema ya da, y encima no cabían. */
    '<div class="plato-acc">' +
      '<button class="pa" id="btnPlato">'+svg('destello',16)+'<span>Deducir</span></button>' +
      '<label class="pa alt" for="inFoto">'+svg('camara',16)+'<span>Foto</span>' +
        '<input type="file" id="inFoto" accept="image/*" hidden></label>' +
    '</div>';

  if(b.platoEstado === 'cargando'){
    h += '<div class="plato-e"><i class="sp"></i>' +
      (b.platoEstado2 || 'Mirando de qué se compone…') + '</div>';
  } else if(b.platoAviso){
    h += '<div class="plato-e ko">'+esc(b.platoAviso)+'</div>';
  } else if(b.platoFuente){
    h += '<div class="plato-e">' + (
      b.platoFuente === 'ia' ? 'Propuesto por la IA. Repasa los checks.'
      : b.platoFuente === 'guardado' ? 'Ya lo teníais guardado.'
      : 'Deducido de lo que ya conocíamos.') + '</div>';
  }

  /* ---------- LO QUE LLEVA ----------
     Primero los alimentos concretos (que además marcan solos sus
     categorías), y solo al final las categorías para repasar. Es el orden
     en que se piensa una comida: qué había, y luego de qué grupos era. */
  var extras = b.items.filter(function(it){ return it.alimento_id || it.crear; });

  if(extras.length){
    h += '<div class="f-lb">Alimentos <span class="op">' +
      extras.length + (extras.length===1?' apuntado':' apuntados') + '</span></div>';
    h += '<div class="lista-sel" id="selItems">' + b.items.map(function(it,ix){
      if(!it.alimento_id && !it.crear) return '';
      var acep = it.alimento_id && esAceptado(it.alimento_id);
      var abierto = it.abierto || !acep;
      var est = abierto
        ? '<div class="est3">' + ESTADOS_T.map(function(e){
            var on = it.estado_toma===e.id;
            return '<button data-est="'+e.id+'" data-ix="'+ix+'" class="'+(on?'on':'')+'" ' +
              'style="'+(on?'background:'+e.col:'')+'">'+e.nom+'</button>';
          }).join('') + '</div>'
        : '<button class="est-p" data-abrir="'+ix+'">' +
            esc(estadoNom(it.estado_toma)) + ' · cambiar</button>';
      return '<div class="si'+(it.crear?' nv':'')+'"><div class="si-top"><span class="em">' +
        esc(it.emoji||'🍽️')+'</span><b>'+esc(it.nombre)+'</b>' +
        (it.crear ? '<span class="tg">nuevo</span>'
                  : (acep ? '<span class="tg ok">'+svg('check',11)+'</span>' : '')) +
        '<button class="qt" data-quitar="'+ix+'">'+svg('cerrar',14)+'</button></div>' +
        est + '</div>';
    }).join('') + '</div>';
    var nuevos = b.items.filter(function(it){ return !it.alimento_id && it.crear; });
    if(nuevos.length){
      h += '<div class="aviso">' + (nuevos.length===1
        ? '<b>'+esc(nuevos[0].nombre)+'</b> no estaba en la biblioteca: se creará al guardar.'
        : '<b>'+nuevos.length+' alimentos</b> nuevos: se crearán al guardar.') + '</div>';
    }
  }

  /* Atajos: bebidas y postres. Salen de la columna `seccion` del Sheet,
     no del grupo — un yogur de postre sigue contando como lácteo. Si la
     columna está vacía, la fila no se pinta y no pasa nada. */
  function atajos(sec, titulo, emojiFb, grupoFb){
    var lista = state.data.alimentos.filter(function(a){
      if(truthy(a.activo) === false) return false;
      var s = String(a.seccion||'').toLowerCase();
      var vale = s === sec || (!s && grupoFb && String(a.grupo) === grupoFb);
      return vale && !b.items.some(function(it){ return it.alimento_id === String(a.id); });
    });
    if(!lista.length) return '';
    return '<div class="f-lb">'+titulo+' <span class="op">opcional</span></div>' +
      '<div class="chips beb">' + lista.slice(0,10).map(function(a){
        return '<button class="chip" data-add="'+esc(a.id)+'">' +
          esc(a.emoji||emojiFb)+' '+esc(a.nombre)+'</button>'; }).join('') + '</div>';
  }
  h += atajos('bebida', 'Bebidas', '🥤', 'bebidas');
  h += atajos('postre', 'Postres', '🍮', '');

  h += '<div class="f-lb">Y además <span class="op">opcional</span></div>' +
    '<div class="busca"><span class="lupa i">'+svg('lupa',17)+'</span>' +
    '<input class="inp" id="inBusca" type="text" placeholder="Añadir fruta, snack, guarnición…" ' +
    'autocomplete="off" autocorrect="off"></div><div id="resBusca"></div>';

  /* ---------- LAS CATEGORÍAS, AL FINAL ----------
     Se marcan solas con lo que ya has puesto; aquí solo se repasa y se
     corrige. Una categoría que viene de un alimento no se puede
     desmarcar desde aquí: se quita el alimento y se va sola. */
  var explicitos = {}, porAlimento = {};
  b.items.forEach(function(it){
    if(it.alimento_id || it.crear) porAlimento[String(it.grupo)] = it.nombre;
    else explicitos[String(it.grupo)] = true;
  });
  var objs = objetivosSemana();
  var min = objs.filter(function(o){ return String(o.tipo) !== 'max'; });
  var max = objs.filter(function(o){ return String(o.tipo) === 'max'; });

  function chipsG(lista, lim){
    return lista.map(function(o){
      var g = String(o.grupo);
      var auto = !!porAlimento[g], on = !!explicitos[g] || auto;
      return '<button class="gchip'+(on?' on':'')+(lim?' lim':'')+(auto?' auto':'')+'" ' +
        'data-g="'+esc(g)+'"'+(auto?' data-auto="'+esc(porAlimento[g])+'"':'')+'>' +
        '<span class="bx">'+(on ? svg('check',12) : '')+'</span>' +
        ico(o,15,'')+' '+esc(o.nombre||g)+'</button>';
    }).join('');
  }
  var marcados = {};
  Object.keys(explicitos).forEach(function(g){ marcados[g] = true; });
  Object.keys(porAlimento).forEach(function(g){ marcados[g] = true; });
  var nG = Object.keys(marcados).filter(function(g){ return !!objGrupo(g); }).length;

  h += '<div class="f-lb">Qué categorías cuenta <span class="op">' +
    (nG ? nG+(nG===1?' categoría':' categorías') : 'marca al menos una') + '</span></div>' +
    '<div class="gchips">' + chipsG(min, false) + '</div>';
  if(max.length){
    h += '<div class="gsep">Sin pasarse</div><div class="gchips">' + chipsG(max, true) + '</div>';
  }

  h += '<div class="aviso" style="background:var(--surface2);color:var(--t2)">' +
    'Cada categoría cuenta <b>una vez por comida</b>. Una ensalada con cinco ' +
    'verduras es una ración de verdura, no cinco.</div>';

  var puede = nG > 0 || extras.length > 0;
  h += '<button class="btn" id="guardarComida"'+(puede?'':' disabled')+'>' +
       (b.grupo_id?'Guardar cambios':'Guardar comida')+'</button>';
  if(b.grupo_id) h += '<button class="btn del" id="borrarComida">Borrar esta comida</button>';

  abrirHoja(h);
  pintarBusqueda();
}

/* ---------- interpretar un plato ----------
   Escribes "Sushi", opcionalmente lo describes o haces una foto, y el
   backend devuelve ALIMENTOS: salmón, arroz, aguacate. Los que ya
   existen se enlazan por id; los nuevos salen marcados y solo se crean
   en la biblioteca cuando guardas, para que no se llene de variantes.

   La foto se usa y se tira: se reduce en el móvil, viaja, se lee y no
   se guarda en ninguna parte. */

function esAceptado(alimentoId){
  var a = alimento(alimentoId);
  return !!a && String(a.estado||'').toLowerCase() === 'aceptado';
}
function estadoNom(id){
  var e = ESTADOS_T.filter(function(x){ return x.id===id; })[0];
  return e ? e.nom : 'Se lo comió';
}

/** Marca los grupos que propone la IA. Son checks: se repasan. */
function _meterGrupos(lista){
  var n = 0;
  (lista||[]).forEach(function(g){
    g = String(g);
    if(borrador.items.some(function(it){ return !it.alimento_id && it.grupo===g; })) return;
    var o = objGrupo(g);
    if(!o) return;                       /* grupo sin objetivo: no se marca */
    borrador.items.push({ alimento_id:'', nombre:(o.nombre||g), grupo:g,
                          estado_toma:'comio', emoji:(o.emoji||'') });
    n++;
  });
  return n;
}

/** Mete los alimentos que devuelve el backend en el borrador. */
function _meterAlimentos(lista){
  var n = 0;
  lista.forEach(function(a){
    var yaEsta = borrador.items.some(function(it){
      return (a.id && it.alimento_id === a.id) ||
             (!a.id && !it.alimento_id &&
              String(it.nombre).toLowerCase() === String(a.nombre).toLowerCase());
    });
    if(yaEsta) return;
    borrador.items.push({
      alimento_id: a.id || '',
      nombre: a.nombre,
      grupo: a.grupo || 'otros',
      emoji: a.emoji || (alimento(a.id)||{}).emoji || '🍽️',
      estado_toma: 'comio',
      crear: !a.id                     /* se creará en la biblioteca al guardar */
    });
    n++;
  });
  return n;
}

function interpretarPlato(foto){
  var nombre = (($('#inPlato')||{}).value || '').trim();
  var desc   = (($('#inDesc')||{}).value || '').trim();
  borrador.plato = nombre;
  borrador.desc  = desc;
  if(!nombre && !desc && !foto){
    toast('Escribe qué comió, o haz una foto', true); return;
  }
  borrador.platoEstado = 'cargando';
  borrador.platoEstado2 = foto ? 'Mirando la foto…' : 'Mirando de qué se compone…';
  borrador.platoAviso = '';
  pintarHojaComida();

  /* Va por POST: una foto no cabe en una URL. */
  llamarPost({ action:'interpretaPlato',
               payload:{ nombre:nombre, descripcion:desc, foto:foto || '' } })
    .then(function(d){
      borrador.platoEstado = '';
      borrador.platoFuente = d.fuente;
      borrador.platoAviso = d.aviso || '';
      var n = _meterGrupos(d.grupos || []) + _meterAlimentos(d.alimentos || []);
      if(!n && !borrador.platoAviso){
        borrador.platoAviso = 'No he sabido qué categorías tiene. Márcalas tú abajo.';
      }
      pintarHojaComida();
    })
    .catch(function(err){
      borrador.platoEstado = '';
      borrador.platoAviso = String(err.message||err);
      pintarHojaComida();
    });
}

/**
 * Reduce la foto ANTES de mandarla. Una foto de móvil son 4 MB; a
 * 768px de lado largo y calidad 0,7 baja a ~80 KB, que es de sobra
 * para reconocer un plato y evita pagar por píxeles que no aportan.
 */
function fotoElegida(input){
  var f = input.files && input.files[0];
  if(!f) return;
  input.value = '';                        /* poder repetir la misma foto */
  var img = new Image();
  img.onload = function(){
    var max = 768;
    var e = Math.min(1, max / Math.max(img.width, img.height));
    var cv = document.createElement('canvas');
    cv.width  = Math.round(img.width  * e);
    cv.height = Math.round(img.height * e);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    var url;
    try { url = cv.toDataURL('image/jpeg', 0.7); }
    catch(err){ toast('No he podido leer la foto', true); return; }
    URL.revokeObjectURL(img.src);
    interpretarPlato(url);                 /* se usa y se tira: no se guarda */
  };
  img.onerror = function(){ toast('No he podido leer la foto', true); };
  img.src = URL.createObjectURL(f);
}

/** Al guardar, se recuerda qué categorías lleva el plato. */
function recordarPlato(){
  var b = borrador;
  if(!b.plato) return Promise.resolve();
  var grupos = b.items.filter(function(it){ return !it.alimento_id; })
                      .map(function(it){ return it.grupo; });
  if(!grupos.length) return Promise.resolve();
  /* Si lo has tocado, manda tu versión y la IA no la vuelve a pisar. */
  var fuente = (b.platoFuente === 'ia' && !b.platoTocado) ? 'ia' : 'manual';
  return llamarPost({ action:'savePlato', payload:{
    nombre:b.plato, grupos:grupos, fuente:fuente, creado_por:state.user } })
    .catch(function(){});      /* que no falle guardar la comida por esto */
}

function buscarAlimentos(q){
  q = String(q||'').trim().toLowerCase();
  /* Sin texto no se listan los que ya tienen su fila de atajos arriba
     (bebidas y postres): repetirlos dos dedos más abajo es ruido.
     Buscándolos por nombre sí salen, que es lo esperable. */
  var lista = q ? state.data.alimentos
                : state.data.alimentos.filter(function(a){
                    return String(a.grupo) !== 'bebidas' && !String(a.seccion||''); });
  if(!q){
    /* Sin texto: los que más veces se han registrado, que es lo que se repite a diario */
    var uso = {};
    state.data.comidas.forEach(function(c){
      if(c.alimento_id) uso[String(c.alimento_id)] = (uso[String(c.alimento_id)]||0)+1;
    });
    return lista.slice().sort(function(a,b){
      return (uso[String(b.id)]||0) - (uso[String(a.id)]||0);
    }).slice(0,8);
  }
  return lista.filter(function(a){
    return String(a.nombre||'').toLowerCase().indexOf(q) >= 0;
  }).slice(0,12);
}
function pintarBusqueda(){
  var q = ($('#inBusca')||{}).value || '';
  var r = buscarAlimentos(q);
  var yaHay = {};
  borrador.items.forEach(function(it){ if(it.alimento_id) yaHay[it.alimento_id]=true; });
  var h = r.filter(function(a){ return !yaHay[String(a.id)]; }).map(function(a){
    var o = objGrupo(String(a.grupo));
    return '<button data-add="'+esc(a.id)+'"><span class="em">'+esc(a.emoji||'🍽️')+'</span>' +
      esc(a.nombre)+'<span class="gr">'+esc((o&&o.nombre)||a.grupo)+'</span></button>';
  }).join('');
  var qq = String(q).trim();
  if(qq && !r.some(function(a){ return String(a.nombre).toLowerCase()===qq.toLowerCase(); })){
    h += '<button data-crear="'+esc(qq)+'"><span class="em">'+svg('mas',15)+'</span>' +
      '<span class="nuevo">Crear «'+esc(qq)+'»</span></button>';
  }
  $('#resBusca').innerHTML = h ? '<div class="res">'+h+'</div>' : '';
}

/* ============================================================
   BIBLIOTECA DE ALIMENTOS
   Todo lo que habéis dado de alta, con filtros. Desde aquí se corrige
   el grupo de algo mal clasificado y se pasa a "aceptado" lo que ya
   come sin rechistar — que es lo que hace que deje de preguntarlo.
   ============================================================ */
var ESTADOS_AL = [
  { id:'aceptado',    nom:'Aceptado',    c:'ali' },
  { id:'aprendizaje', nom:'Probando',    c:'cal' },
  { id:'rechazado',   nom:'No le gusta', c:'gas' }
];
function estadoAlNom(id){
  var e = ESTADOS_AL.filter(function(x){ return x.id === id; })[0];
  return e ? e.nom : 'Probando';
}

/* ============================================================
   ESTADÍSTICAS
   ============================================================ */
function hojaStats(){
  var top = rankingAlimentos('', '', 10);
  var serie = serieIch(8);
  var rep = repertorioPorGrupo();
  var totalAl = Object.keys(rep).reduce(function(n,k){ return n + rep[k]; }, 0);

  var h = '<h3>Estadísticas</h3>';

  /* Un número solo no es una gráfica: es un número. */
  h += '<div class="st-kpis">' +
    '<div><b>'+totalAl+'</b><span>alimentos probados<br>alguna vez</span></div>' +
    '<div><b>'+state.data.comidas.filter(function(c){ return !!c.grupo_id; })
      .reduce(function(a,c){ return a.indexOf(c.grupo_id)<0 ? a.concat([c.grupo_id]) : a; }, [])
      .length+'</b><span>comidas<br>registradas</span></div>' +
    '</div>';

  if(!top.length){
    h += '<div class="hist-vacio">Cuando llevéis unos días apuntando, ' +
      'aquí se verá qué come más.</div>';
    abrirHoja(h); return;
  }

  /* Una serie, un color. Colorear cada barra según su tamaño sería
     pintar dos veces el mismo dato. El número va escrito al lado: un
     tooltip no puede ser la única forma de leerlo. */
  h += '<div class="st-b"><h4>Lo que más come</h4>' +
    barrasH(top.map(function(a){
      return { n:a.nombre, em:a.emoji, v:a.veces };
    }), 'var(--ali)') +
    '<p class="st-p">Veces que aparece en una comida. No cuentan los rechazos.</p></div>';

  /* Evolución del índice: un trazo, sin leyenda — el título ya lo nombra. */
  var puntos = serie.map(function(x){
    return { x:(+x.lunes.split('-')[2]) + '/' + (+x.lunes.split('-')[1]),
             y: x.v ? x.v.total : null };
  });
  var linea = lineaEvolucion(puntos, 'var(--ali)');
  if(linea){
    h += '<div class="st-b"><h4>Índice de hábitos, últimas 8 semanas</h4>' +
      linea + '</div>';
  } else {
    h += '<div class="st-b"><h4>Índice de hábitos</h4>' +
      '<p class="st-p">Hacen falta al menos dos semanas con datos para ver ' +
      'una evolución. Dibujar una línea con un punto sería inventarla.</p></div>';
  }

  /* Repertorio por grupo: dónde hay variedad y dónde no. */
  var filas = objetivosSemana().map(function(o){
    return { n:String(o.nombre||o.grupo), em:String(o.emoji||''), v:rep[String(o.grupo)] || 0 };
  }).filter(function(f){ return f.v > 0; })
    .sort(function(a,b){ return b.v - a.v; });
  if(filas.length){
    h += '<div class="st-b"><h4>Repertorio por grupo</h4>' +
      barrasH(filas, 'var(--sal)') +
      '<p class="st-p">Alimentos distintos que ha probado de cada grupo. ' +
      'Un grupo con pocos es donde más margen hay.</p></div>';
  }

  abrirHoja(h);
}

/* ---------- INSIGHTS ----------
   Observaciones que se leen solas de los datos. Nada de opiniones: si
   no hay nada que decir, no se dice nada. */
function insights(){
  var lun = state.aliLunes || lunesDe(state.data.hoy);
  var out = [];

  var v = variedadDe(lun).length, vAnt = variedadDe(addDays(lun,-7)).length;
  if(v && vAnt){
    var d = v - vAnt;
    if(d > 0) out.push({ e:'📈', t:d+(d===1?' alimento más':' alimentos más')+' que la semana pasada',
                         p:'Vais de '+vAnt+' a '+v+' distintos.' });
    else if(d < 0) out.push({ e:'🔁', t:'Esta semana se repite más',
                         p:v+' alimentos distintos, '+(-d)+' menos que la anterior.' });
  }

  var nv = nuevosDe(lun);
  if(nv.length){
    var nom = nv.map(function(id){ return (alimento(id)||{}).nombre; }).filter(String);
    out.push({ e:'⭐', t:nv.length===1 ? 'Un alimento nuevo' : nv.length+' alimentos nuevos',
               p: nom.slice(0,3).join(', ') + (nom.length>3 ? ' y '+(nom.length-3)+' más' : '') });
  }

  /* El grupo que lleva más días sin aparecer: es lo accionable.
     Un grupo que NUNCA ha aparecido no está "sin aparecer" — es que no
     forma parte de su dieta. Si no se excluye, se lleva siempre el
     primer puesto y tapa al que de verdad se ha caído. */
  var seco = null, TOPE = 21;
  objetivosSemana().forEach(function(o){
    if(String(o.tipo) === 'max') return;
    var g = String(o.grupo), dias = 0, aparecio = false;
    for(var i = 0; i < TOPE; i++){
      if(racionesDia(g, addDays(state.data.hoy, -i)) > 0){ aparecio = true; break; }
      dias++;
    }
    if(!aparecio) return;                       /* nunca en tres semanas: no cuenta */
    if(dias >= 7 && (!seco || dias > seco.dias)) seco = { o:o, dias:dias };
  });
  if(seco){
    out.push({ e:String(seco.o.emoji||'•'),
               t: String(seco.o.nombre||seco.o.grupo) + ': ' + seco.dias + ' días sin aparecer',
               p:'Es el grupo que lleva más tiempo fuera del plato.' });
  }

  /* Lo que más se repite últimamente, dicho sin juicio. */
  var top = rankingAlimentos(addDays(state.data.hoy,-27), state.data.hoy, 1)[0];
  if(top && top.veces >= 8){
    out.push({ e:String(top.emoji||'🍽️'), t:top.nombre+', '+top.veces+' veces este mes',
               p:'Es lo que más se repite. Ni bien ni mal: solo por si no te habías fijado.' });
  }

  return out;
}

function pintarBiblioteca(){
  var q = String(state.bibQ||'').trim().toLowerCase();
  var veces = {};
  state.data.comidas.forEach(function(c){
    if(c.alimento_id) veces[String(c.alimento_id)] = (veces[String(c.alimento_id)]||0) + 1;
  });

  var todos = state.data.alimentos.slice();
  var lista = todos.filter(function(a){
    if(q && String(a.nombre||'').toLowerCase().indexOf(q) < 0) return false;
    if(state.bibG && String(a.grupo) !== state.bibG) return false;
    if(state.bibE && String(a.estado||'aprendizaje') !== state.bibE) return false;
    return true;
  }).sort(function(a,b){
    return (veces[String(b.id)]||0) - (veces[String(a.id)]||0) ||
           String(a.nombre).localeCompare(String(b.nombre));
  });

  /* Los grupos del filtro son los que de verdad tienen alimentos: un
     filtro que devuelve cero siempre es un filtro que sobra. */
  var conAlgo = {};
  todos.forEach(function(a){ conAlgo[String(a.grupo)] = true; });
  var grupos = objetivosSemana().filter(function(o){ return conAlgo[String(o.grupo)]; });

  var h = '<h3>Biblioteca de alimentos</h3>' +
    '<div class="busca"><span class="lupa i">'+svg('lupa',17)+'</span>' +
    '<input class="inp" id="bibQ" type="text" placeholder="Buscar…" ' +
      'value="'+esc(state.bibQ)+'" autocomplete="off"></div>' +
    '<div class="cats-h" style="margin-top:10px">' +
      '<button data-bibg="" class="'+(state.bibG?'':'on')+'" style="' +
        (state.bibG?'':'background:var(--ali-d);color:#fff')+'">Todos</button>' +
      grupos.map(function(o){
        var on = state.bibG === String(o.grupo);
        return '<button data-bibg="'+esc(o.grupo)+'" class="'+(on?'on':'')+'" style="' +
          (on?'background:var(--ali-d);color:#fff':'')+'">'+esc(o.emoji||'')+' ' +
          esc(o.nombre||o.grupo)+'</button>';
      }).join('') + '</div>' +
    '<div class="cats-h">' +
      '<button data-bibe="" class="'+(state.bibE?'':'on')+'" style="' +
        (state.bibE?'':'background:var(--t2);color:#fff')+'">Cualquier estado</button>' +
      ESTADOS_AL.map(function(e){
        var on = state.bibE === e.id;
        return '<button data-bibe="'+e.id+'" class="'+(on?'on':'')+'" style="' +
          (on?'background:var(--'+e.c+'-d);color:#fff':'')+'">'+esc(e.nom)+'</button>';
      }).join('') + '</div>';

  h += '<div class="bib-n">' + lista.length +
    (lista.length===1?' alimento':' alimentos') +
    (lista.length !== todos.length ? ' de '+todos.length : '') + '</div>';

  if(!lista.length){
    h += '<div class="hist-vacio">Nada con esos filtros.</div>';
  } else {
    h += '<div class="bib-l">' + lista.map(function(a){
      var o = objGrupo(String(a.grupo));
      var est = String(a.estado||'aprendizaje');
      var e = ESTADOS_AL.filter(function(x){ return x.id===est; })[0] || ESTADOS_AL[1];
      var n = veces[String(a.id)] || 0;
      return '<button class="bib-i" data-bibedit="'+esc(a.id)+'">' +
        '<span class="em">'+esc(a.emoji||'🍽️')+'</span>' +
        '<div class="tx"><b>'+esc(a.nombre)+'</b>' +
          '<span>'+esc((o&&o.nombre)||a.grupo)+' · '+
          (n ? n + (n===1?' vez':' veces') : 'sin registrar')+'</span></div>' +
        '<span class="es" style="background:var(--'+e.c+'-s);color:var(--'+e.c+'-d)">' +
          esc(e.nom)+'</span></button>';
    }).join('') + '</div>';
  }
  abrirHoja(h);
}

/* ---------- avisos por sección ---------- */
var SECCION_DE = { calendario:'calendario', alimentacion:'alimentacion',
                   gastos:'gastos', salud:'salud', mensajes:'perfil' };

/** Cosas que ha hecho el otro en una sección desde tu última visita. */
function novedadesSeccion(seccion){
  var v = state.data.visitas.filter(function(x){
    return String(x.username)===state.user && String(x.seccion)===seccion;
  })[0];
  var desde = v ? String(v.ts||'') : '';
  var n = state.data.actividad.filter(function(a){
    return String(a.username) !== state.user &&
           (SECCION_DE[String(a.seccion)] || String(a.seccion)) === seccion &&
           String(a.timestamp||'') > desde;
  }).length;
  if(seccion === 'perfil') n += mensajesSinLeer().length;
  return n;
}
/** Al entrar en una sección se marca vista: así el aviso se apaga solo. */

function cuandoTs(ts){
