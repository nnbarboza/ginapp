<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F8FAFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GINapp">
<title>GINapp</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GINapp · UI Kit v0.1
   Tres capas de color que NO se mezclan nunca:
     perfil  → quién        (azul papá · rojo mamá · lila Gina)
     sección → qué          (ámbar · verde · naranja · turquesa)
     estado  → qué ocurre   (ok · aviso · error · info)
   ============================================================ */
:root{
  /* --- perfil --- */
  --papa:#2878D4; --papa-s:#EAF3FF; --papa-d:#1759A6; --papa-amb:#F5F9FF;
  --mama:#E4575B; --mama-s:#FFF0F1; --mama-d:#BD3439; --mama-amb:#FFF7F7;
  --gina:#8B62D9; --gina-s:#F3EEFF; --gina-d:#6743AE; --gina-amb:#FAF7FF;
  /* Tercera casa: los avis. Verde salvia apagado — se distingue del
     verde vivo de Alimentación y no compite con papá ni con mamá. */
  --avis:#6E8B5C; --avis-s:#F0F4EC; --avis-d:#4C6640; --avis-amb:#F8FAF6;

  /* --- sección --- */
  /* Azul, rojo y lila están reservados a las personas, así que a las
     cuatro secciones solo les queda el arco amarillo→verde→cian. Con
     Calendario en ámbar y Gastos en naranja quedaban a 9° de tono: el
     mismo color a ojo. Calendario sube a mostaza y Gastos baja a
     terracota — 25° de separación, ya se distinguen de un vistazo. */
  --cal:#DFB238; --cal-s:#FDF6E0; --cal-d:#8E6B0C; --cal-c:#FFFCF1;
  --ali:#3FAE62; --ali-s:#EEF9F0; --ali-d:#237A3D; --ali-c:#F4FBF5;
  --gas:#D4703A; --gas-s:#FCEFE7; --gas-d:#A04A1B; --gas-c:#FFF8F3;
  --sal:#43A7B5; --sal-s:#ECF8FA; --sal-d:#247985; --sal-c:#F2FAFB;
  --ini:#64748B;

  /* --- estado --- */
  --ok:#35A853; --warn:#E7A93B; --warn-s:#FFF6E5; --warn-d:#9A6510; --warn-b:#F5DFAE;
  --err:#D64545; --err-s:#FDEDED; --info:#4386C5;

  /* --- neutros --- */
  --bg:#F8FAFC; --amb:#F8FAFC;
  --surface:#FFFFFF; --surface2:#F1F5F9; --border:#E2E8F0;
  --t1:#172033; --t2:#667085; --t3:#98A2B3; --dis:#CBD5E1;

  /* --- forma --- */
  --r-l:24px; --r:20px; --r-btn:15px; --r-in:13px;
  --sh:0 2px 12px rgba(15,23,42,.06);
  --sh-l:0 4px 20px rgba(15,23,42,.08);
  --safe-b:env(safe-area-inset-bottom,0px);

  /* --- perfil activo (se reasigna en JS) --- */
  --yo:var(--papa); --yo-s:var(--papa-s); --yo-d:var(--papa-d);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--amb); color:var(--t1);
  max-width:440px; margin:0 auto; min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .5s ease;
  font-size:16px; line-height:1.45;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0;
  text-align:left}
input{font-family:inherit;font-size:16px}
[hidden]{display:none !important}
.wrap{padding:0 16px calc(104px + var(--safe-b))}
svg{display:block;flex-shrink:0}
.i{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
.spin{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--t3);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splashTx{margin:0;font-size:13.5px;color:var(--t2);max-width:280px;text-align:center;
  line-height:1.55}
#splashTx button{color:var(--papa);font-weight:600;text-decoration:underline}
#splashTx code{background:var(--surface2);border-radius:5px;padding:1px 5px;font-size:12px}
#splashTx b{color:var(--t1)}

/* ---------- LOGO ---------- */
.logo{display:flex;align-items:flex-end;gap:3px;line-height:1}
.logo .gin{font-size:30px;font-weight:800;letter-spacing:-1.6px;color:var(--papa);
  position:relative;display:inline-block}
.logo .app{font-size:12.5px;font-weight:700;color:var(--papa);letter-spacing:-.2px;
  padding-bottom:3px;opacity:.9}
.logo .li{position:relative;display:inline-block}
.logo .cor{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:10px;height:10px;
  color:var(--papa)}
/* Con imagen propia el logo deja de ser texto: se le da alto y que la
   imagen se ajuste sola, sea cuadrada o apaisada. */
.logo.img{display:block;height:56px}
.logo.img img{height:100%;width:auto;max-width:220px;object-fit:contain;display:block}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%);
  background:var(--t1);color:#fff;font-size:13.5px;font-weight:500;padding:11px 18px;
  border-radius:999px;z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:90%;box-shadow:var(--sh-l)}
#toast.on{opacity:1}
#toast.ko{background:var(--err)}

/* ---------- CABECERA ---------- */
/* Una sola fila: Gina a la izquierda, quién mira a la derecha.
   Nada más — dos filas de cabecera se comían media pantalla. */
.hd-top{display:flex;align-items:center;gap:10px;padding:14px 0 14px}
.hd-top .hd-tx{margin-right:auto}
.foto{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;cursor:pointer;
  background:var(--gina-s);color:var(--gina-d);display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:700;
  box-shadow:0 0 0 2.5px #fff, 0 2px 8px rgba(15,23,42,.10)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto:active{transform:scale(.94)}
.hd-tx{min-width:0;overflow:hidden}
.hd-tx h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.4px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-tx p{margin:0;font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden}
/* En pantallas estrechas el nombre del perfil sobra: el avatar y la nav
   de abajo ya dicen quién eres. */
@media (max-width:359px){ .perfil .nm{display:none} .perfil{padding:5px 6px} }
.hd-bt{display:flex;align-items:center;gap:8px;flex-shrink:0}
.campana{position:relative;width:40px;height:40px;flex-shrink:0;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--t2);box-shadow:var(--sh)}
.campana b{position:absolute;top:-2px;right:-2px;background:var(--err);color:#fff;
  font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--amb)}
.perfil{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;
  padding:5px 8px 5px 12px;height:44px;box-shadow:var(--sh);flex-shrink:0}
.perfil .nm{font-size:14px;font-weight:600}
.perfil .av{width:32px;height:32px;border-radius:50%;background:var(--yo-s);color:var(--yo-d);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  overflow:hidden}
/* La regla estaba solo dentro de .perfil, así que en el login y en el
   selector de usuario la foto salía a tamaño natural y se desbordaba.
   El avatar es el mismo componente en todas partes: la regla también. */
/* Redondo y centrado por defecto: las siete veces que se usa un avatar
   repetían estas cuatro líneas, y la octava (los datos de Gina) salió
   cuadrada por no repetirlas. El tamaño sí lo pone cada sitio. */
.av{overflow:hidden;flex-shrink:0;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-weight:700}
.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.perfil .cv{color:var(--t3)}

/* ---------- TARJETA HOY ---------- */
.hoy-card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh);
  overflow:hidden;margin-bottom:14px}
.hoy-top{display:flex;gap:14px;padding:16px}
.hoy-casa{width:84px;height:84px;border-radius:22px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.hoy-tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.kick{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.hoy-tx h2{margin:4px 0 0;font-size:17.5px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.hoy-tx .sub{margin:4px 0 0;font-size:13px;color:var(--t2)}
.hoy-tx .sub b{font-weight:600;color:var(--t1)}
.est-b{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;color:var(--cal-d);
  background:var(--cal-s);border-radius:6px;padding:2px 6px;margin-left:6px;letter-spacing:.4px;
  vertical-align:2px}
.hoy-sep{height:1px;background:var(--border);margin:0 16px}
.hoy-evs{padding:6px 16px 14px}
.ev{display:flex;align-items:center;gap:12px;padding:9px 0}
.ev-i{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.ev-t{flex:1;min-width:0}
.ev-t b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-t span{display:block;font-size:12.5px;color:var(--t2);margin-top:1px}
.ev-h{font-size:13.5px;font-weight:700;color:var(--t2);font-variant-numeric:tabular-nums}
.hoy-vacio{padding:14px 16px 18px;font-size:13px;color:var(--t3)}
.hoy-nota{margin:2px 16px 16px;background:var(--cal-s);border-radius:14px;padding:10px 12px;
  font-size:12.5px;color:var(--cal-d);display:flex;gap:9px;align-items:flex-start;line-height:1.45;
  font-weight:500}
.hoy-nota .i{color:var(--cal-d);margin-top:1px}

/* ---------- ACCIONES RÁPIDAS ---------- */
.rap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rap button{background:var(--surface);border-radius:var(--r);padding:13px 6px 11px;
  display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--sh);
  transition:transform .12s}
.rap button:active{transform:scale(.97)}
.rap .i{width:36px;height:36px;border-radius:13px}
.rap b{font-size:12px;font-weight:600;color:var(--t2);letter-spacing:-.1px}

/* ---------- TARJETAS DE SECCIÓN ---------- */
.secs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.sec-c{border-radius:var(--r);padding:15px 14px 14px;box-shadow:var(--sh);display:flex;
  flex-direction:column;min-height:172px}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sec-hd .i{width:42px;height:42px;border-radius:15px}
.sec-hd b{font-size:15.5px;font-weight:700;letter-spacing:-.3px}
.sec-l{font-size:12.5px;color:var(--t2)}
.sec-v{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-top:2px;line-height:1.25}
.sec-s{font-size:12.5px;color:var(--t2);margin-top:2px;line-height:1.35}
.sec-pie{margin-top:auto;border-radius:12px;padding:9px 11px;font-size:12.5px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi{display:flex;align-items:baseline;gap:5px;margin-top:4px}
.kpi b{font-size:30px;font-weight:700;letter-spacing:-1.4px;line-height:1}
.kpi span{font-size:12px;color:var(--t2);font-weight:500}
.barra{height:8px;border-radius:99px;background:#fff;overflow:hidden;margin:9px 0 6px;
  box-shadow:inset 0 0 0 1px rgba(15,23,42,.05)}
.barra i{display:block;height:100%;border-radius:99px}
.chip-d{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  margin-top:5px}
.chip-d .pt{width:8px;height:8px;border-radius:50%}
.vac{font-size:12.5px;color:var(--t2);line-height:1.45;margin-top:2px}
.vac b{display:block;font-size:14px;color:var(--t1);font-weight:600;margin-bottom:3px;
  letter-spacing:-.2px}

/* ---------- SEMANA ---------- */
.sem{background:var(--surface);border-radius:var(--r-l);padding:16px 14px 14px;
  box-shadow:var(--sh);margin-bottom:14px}
.sem-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sem-hd b{font-size:16px;font-weight:700;letter-spacing:-.3px}
.sem-nav{display:flex;gap:6px;align-items:center}
.sem-nav button{width:32px;height:32px;border-radius:50%;background:var(--surface2);
  color:var(--t2);display:flex;align-items:center;justify-content:center}
.sem-nav .hoyb{width:auto;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--yo);background:var(--yo-s)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.d{border-radius:14px;padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;
  gap:5px;background:var(--surface2);min-height:92px;position:relative;overflow:hidden}
.d.papa{background:var(--papa-s)} .d.mama{background:var(--mama-s)}
.d.avis{background:var(--avis-s)}
.d .qn{white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.d.avis .qn{color:var(--avis-d)}
.d.est::after{content:'';position:absolute;inset:0;border-radius:14px;
  border:1.5px dashed rgba(15,23,42,.14);pointer-events:none}
.d .dw{font-size:9.5px;font-weight:700;color:var(--t3);letter-spacing:.4px}
.d .nu{font-size:15px;font-weight:700;letter-spacing:-.5px;line-height:1;height:24px;
  display:flex;align-items:center;justify-content:center;min-width:24px;border-radius:50%}
.d.hoy .nu{background:var(--yo);color:#fff;font-size:13px}
.d .qn{font-size:9px;font-weight:700;letter-spacing:-.1px;margin-top:-1px}
.d.papa .qn{color:var(--papa-d)} .d.mama .qn{color:var(--mama-d)}
.d .pts{display:flex;align-items:center;justify-content:center;gap:3px;height:9px;margin-top:1px}
.d .pts i{width:6px;height:6px;border-radius:50%;display:block}
.d .mas{font-size:8.5px;font-weight:700;color:var(--t3);line-height:1}

/* Bandas: lo que dura varios días, sobre la misma rejilla de 7 columnas. */
.bandas{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:5px}
.bnd-s{display:flex;align-items:center;gap:4px;min-width:0;height:26px;padding:0 7px;
  border-radius:9px;border:1px solid;font-size:11px;font-weight:600;overflow:hidden;
  cursor:pointer}
.bnd-s .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bnd-s .pt-a{font-weight:700;opacity:.75;flex-shrink:0}
.bnd-s svg{flex-shrink:0}
.bnd-mas{grid-column:1 / 8;font-size:11px;color:var(--t3);padding:2px 2px 0}

/* Cambiar de quién es un día */
.dia-hd .qn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:6px 8px 6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0}
.dia-hd .qn .lp{opacity:.55;display:inline-flex}
.dia-hd .qn:active{transform:scale(.97)}
.dia-hd .qn .mk{width:5px;height:5px;border-radius:50%;background:currentColor;
  display:inline-block;margin-left:-2px}
.dia-mot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);
  margin-top:4px}
.cust-g{display:flex;gap:10px;margin-bottom:4px}
.cust-o{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:15px 8px;
  border-radius:var(--r);border:1.5px solid var(--border);background:var(--surface);
  position:relative;cursor:pointer}
.cust-o.on{border-color:var(--c);background:var(--cs)}
.cust-o b{font-size:13.5px;font-weight:600}
.cust-o.on b{color:var(--cd)}
.cust-o .tk{position:absolute;top:7px;right:7px;color:var(--c)}
.cust-g{gap:8px}
.cust-o{padding:13px 5px}
.cust-o b{font-size:12.5px;text-align:center;line-height:1.2}
.cust-sw{display:flex;gap:3px;background:var(--surface2);border-radius:var(--r-in);
  padding:3px;margin-bottom:4px}
.cust-sw button{flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:600;
  color:var(--t2);cursor:pointer}
.cust-sw button.on{background:var(--surface);color:var(--t1);box-shadow:var(--sh)}
.cust-n{font-size:12.5px;color:var(--cal-d);font-weight:600;padding:8px 3px 0}

/* El plato por su nombre */
.plato-f{display:flex;gap:8px;align-items:stretch}
.plato-f .inp{flex:1;min-width:0}
.plato-b{width:48px;flex-shrink:0;border-radius:var(--r-in);background:var(--ali-s);
  color:var(--ali-d);display:flex;align-items:center;justify-content:center;cursor:pointer}
.plato-b:active{transform:scale(.96)}
.plato-e{font-size:12px;color:var(--t2);padding:7px 3px 0;line-height:1.35}
.plato-e.ko{color:var(--cal-d)}
.plato-e .sp{width:12px;height:12px;border-radius:50%;border:2px solid var(--ali-s);
  border-top-color:var(--ali);display:inline-block;vertical-align:-2px;margin-right:7px;
  animation:gira .8s linear infinite}
.ta{resize:none;font-family:inherit;line-height:1.4;padding-top:11px}
.f-lb .op{font-weight:500;color:var(--t3);text-transform:none;letter-spacing:0;
  font-size:11px;margin-left:5px}
.plato-acc{display:flex;gap:8px;margin-top:10px}
.pa{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;
  border-radius:var(--r-btn);background:var(--ali-s);color:var(--ali-d);
  font-size:13.5px;font-weight:600;cursor:pointer}
.pa.alt{flex:0 0 96px;background:var(--surface2);color:var(--t2)}
.pa:active{transform:scale(.97)}
/* El mismo bloque de adjuntar sirve en Gastos, pero allí el acento es
   terracota: si no, un botón verde de Alimentación aparece en medio. */
.plato-acc.gas .pa{background:var(--gas-s);color:var(--gas-d)}
.plato-acc.gas .pa.alt{background:var(--surface2);color:var(--t2)}
.plato-e.gas .sp{border-color:var(--gas-s);border-top-color:var(--gas)}
.cmp{display:flex;align-items:center;gap:9px;margin-top:10px;padding:0 12px;height:44px;
  border-radius:var(--r-btn);background:var(--gas-s);color:var(--gas-d);font-size:13.5px}
.cmp .i{display:flex;flex-shrink:0}
.cmp a{flex:1;min-width:0;font-weight:600;color:var(--gas-d);text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .qt{flex-shrink:0;color:var(--gas-d);opacity:.65;padding:4px;display:flex}
.cmp .qt:active{opacity:1}
.cmp.gina{background:var(--gina-s);color:var(--gina-d)}
.cmp.gina a, .cmp.gina .qt{color:var(--gina-d)}
.pa.gina{flex:none;width:100%;margin-top:8px;background:var(--gina-s);color:var(--gina-d)}

/* ---------- la página de Gina ---------- */
.gn-hd{display:flex;align-items:center;gap:13px}
.gn-hd .av{font-size:24px}
.gn-sub{margin:3px 0 0;font-size:12.5px;color:var(--t2)}
.gn-l{display:flex;flex-direction:column;gap:8px;margin:16px 0 4px}
.gn-f{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface2);border-radius:var(--r-in);padding:11px 12px;cursor:pointer}
.gn-f:active{transform:scale(.99)}
.gn-f .em{font-size:19px;flex-shrink:0;line-height:1}
.gn-f .tx{flex:1;min-width:0}
.gn-f .tx b{display:block;font-size:14px;font-weight:700;letter-spacing:-.2px}
.gn-f .tx p{margin:2px 0 0;font-size:12.5px;color:var(--t2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gn-f .mk{display:flex;align-items:center;gap:3px;flex-shrink:0;font-size:10.5px;
  font-weight:700;color:var(--gina-d);background:var(--gina-s);border-radius:7px;padding:3px 6px}
.gn-f .mk.casa{border-radius:999px;padding:3px 8px 3px 6px}
.gn-f .ed{color:var(--t3);flex-shrink:0;display:flex}
/* El número se toca para copiarlo, así que tiene que parecer tocable. */
.gn-cp{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--gina-s);color:var(--gina-d);border-radius:var(--r-in);
  padding:13px 14px;margin-top:2px;font-size:15px;cursor:pointer;text-align:left}
.gn-cp:active{transform:scale(.99)}
.gn-cp b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gn-cp .mono{font-variant-numeric:tabular-nums;letter-spacing:.5px}
.gn-cp .vr{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;font-size:12.5px;
  font-weight:700;background:var(--surface);border-radius:999px;padding:6px 11px}
.gn-cp.ver b{opacity:.55}
.gn-foto{display:block;margin-top:2px;border-radius:var(--r-in);overflow:hidden;
  background:var(--surface2)}
.gn-foto img{width:100%;display:block;max-height:230px;object-fit:cover}
.gn-foto .ico-em{display:block;padding:14px;font-size:13.5px;font-weight:600;
  color:var(--gina-d);text-align:center}
.si .tg{font-size:9.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  background:var(--cal-s);color:var(--cal-d);border-radius:6px;padding:3px 6px;
  margin-left:7px;flex-shrink:0}
.si .tg.ok{background:var(--ali-s);color:var(--ali-d);padding:3px 5px;line-height:0}
.si.nv{border:1px solid var(--cal-s)}
.est-p{align-self:flex-start;margin-top:2px;font-size:12px;font-weight:600;color:var(--t3);
  padding:4px 0;cursor:pointer}
.chips.beb .chip{font-size:13px}

/* ---------- GRÁFICAS ---------- */
.bh{display:flex;flex-direction:column;gap:2px}
.bh-r{display:flex;align-items:center;gap:10px;min-height:26px}
.bh-r .nm{width:98px;flex-shrink:0;font-size:12.5px;color:var(--t1);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bh-r .nm i{font-style:normal;margin-right:5px}
.bh-r .tr{flex:1;min-width:0;height:9px;background:var(--surface2);border-radius:5px;
  overflow:hidden}
.bh-r .tr i{display:block;height:100%;border-radius:5px}
.bh-r .vl{width:30px;flex-shrink:0;text-align:right;font-size:12px;font-weight:700;
  color:var(--t2);font-variant-numeric:tabular-nums}
.bh{max-width:100%;overflow:hidden}
.ln-c{margin-top:4px}
.ln-svg{width:100%;height:116px;display:block;overflow:visible}
.ln-x{display:flex;justify-content:space-between;margin-top:2px;padding-left:26px}
.ln-nota{font-size:11px;color:var(--t3);margin-top:6px}
.ln-x span{font-size:9.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.ln-ult{margin-top:8px;font-size:12.5px;color:var(--t2)}
.ln-ult b{color:var(--ali-d);font-weight:700}

/* ---------- CRECIMIENTO ---------- */
.crec{background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);
  margin-bottom:14px}
.crec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.crec-hd b{font-size:16px;font-weight:700;letter-spacing:-.3px}
.crec-hd button{display:inline-flex;align-items:center;gap:5px;background:var(--sal-s);
  color:var(--sal-d);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600}
.crec-hd button:active{transform:scale(.96)}
.crec-k{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.crec-k > div{background:var(--surface2);border-radius:var(--r-in);padding:11px 12px;min-width:0}
.crec-k .lb{font-size:11px;color:var(--t2)}
.crec-k .vl{font-size:19px;font-weight:700;letter-spacing:-.6px;margin-top:3px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crec-k .sb{font-size:10.5px;color:var(--t3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crec-g{margin-top:16px}
.crec-g .tt{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--t3);margin-bottom:2px}
.crec .ln-svg{height:126px}
.crec .ln-ult b{color:var(--sal-d)}
.crec-vac{font-size:12.5px;color:var(--t2);line-height:1.45;margin-top:2px}

/* Enlaces del fondo de Alimentación */
.ali-pies{display:flex;flex-direction:column;gap:2px;background:var(--surface);
  border-radius:var(--r-l);box-shadow:var(--sh);padding:4px 14px;margin-bottom:14px}
.ali-pies button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 2px;
  text-align:left;color:var(--ali-d);border-top:1px solid var(--border);cursor:pointer}
.ali-pies button:first-child{border-top:0}
.ali-pies div{flex:1;min-width:0}
.ali-pies b{display:block;font-size:14px;font-weight:600;color:var(--t1)}
.ali-pies span{font-size:12px;color:var(--t3)}

/* Estadísticas */
.st-kpis{display:flex;gap:10px;margin-bottom:16px}
.st-kpis div{flex:1;background:var(--ali-c);border-radius:var(--r);padding:14px 12px}
.st-kpis b{display:block;font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--ali-d);
  line-height:1}
.st-kpis span{display:block;font-size:11.5px;color:var(--t2);margin-top:5px;line-height:1.3}
.st-b{margin-bottom:22px}
.st-b h4{margin:0 0 11px;font-size:14px;font-weight:700;letter-spacing:-.2px}
.st-p{margin:10px 0 0;font-size:11.5px;color:var(--t3);line-height:1.4}

/* Biblioteca */
.bib-n{font-size:11.5px;color:var(--t3);margin:12px 0 6px}
.bib-l{display:flex;flex-direction:column;gap:2px}
.bib-i{display:flex;align-items:center;gap:11px;width:100%;padding:11px 2px;text-align:left;
  border-top:1px solid var(--border);cursor:pointer}
.bib-i:first-child{border-top:0}
.bib-i .em{font-size:19px;width:24px;text-align:center;flex-shrink:0}
.bib-i .tx{flex:1;min-width:0}
.bib-i b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.bib-i span{font-size:11.5px;color:var(--t3)}
.bib-i .es{flex-shrink:0;font-size:10.5px;font-weight:700;border-radius:7px;padding:4px 8px}

/* Insights */
.ins{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh);
  padding:15px 16px;margin-bottom:14px}
.ins-hd{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;color:var(--t3);margin-bottom:11px}
.ins-i{display:flex;gap:11px;align-items:flex-start;padding:8px 0}
.ins-i .em{font-size:19px;line-height:1.2;width:24px;text-align:center;flex-shrink:0}
.ins-i div{flex:1;min-width:0}
.ins-i b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.ins-i p{margin:2px 0 0;font-size:12px;color:var(--t2);line-height:1.35}

/* ---------- LAS COMIDAS DEL DÍA ---------- */
.cm-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cm-hd h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px}
.cm-add{display:inline-flex;align-items:center;gap:5px;background:var(--ali-s);
  color:var(--ali-d);border-radius:999px;padding:7px 13px;font-size:12.5px;
  font-weight:600;cursor:pointer}
.dtira{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.dt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;
  border-radius:12px;background:var(--surface2);cursor:pointer}
.dt.on{background:var(--ali-s)}
.dt.fut{opacity:.4}
.dt .dw{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.3px}
.dt .nu{font-size:14px;font-weight:700;line-height:1}
.dt.on .nu,.dt.on .dw{color:var(--ali-d)}
.dt .pt{width:5px;height:5px;border-radius:50%;background:transparent}
.dt .pt.hay{background:var(--ali)}
.cm-l{display:flex;flex-direction:column;gap:2px}
.cm{display:flex;align-items:center;gap:11px;width:100%;padding:11px 4px;text-align:left;
  border-top:1px solid var(--border);cursor:pointer}
.cm:first-child{border-top:0}
.cm .em{font-size:20px;line-height:1;width:26px;text-align:center;flex-shrink:0}
.cm .tx{flex:1;min-width:0}
.cm .tx b{display:block;font-size:14px;font-weight:600;letter-spacing:-.15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .tx p{margin:3px 0 0;font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px;
  align-items:center;line-height:1.3}
.cm .gp{font-style:normal;background:var(--ali-s);color:var(--ali-d);border-radius:5px;
  padding:2px 6px;font-weight:600}
.cm .ex{color:var(--t3)}
.cm .hr{font-size:11.5px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums;
  flex-shrink:0}
.cm .ed,.cm .ad{color:var(--t3);flex-shrink:0;display:flex}
.cm.sinp .tx b{color:var(--t2);font-weight:500}
.cm.sinp .tx p{color:var(--t3)}
.cm.sinp .em{opacity:.4}
.cm.sinp .ad{width:24px;height:24px;border-radius:50%;background:var(--ali-s);
  color:var(--ali-d);align-items:center;justify-content:center}

/* ---------- LAS CATEGORÍAS DE UN PLATO ---------- */
.gchips{display:flex;flex-wrap:wrap;gap:7px}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:999px;padding:8px 13px 8px 8px;
  font-size:13px;font-weight:600;color:var(--t2);cursor:pointer}
.gchip .bx{width:17px;height:17px;border-radius:6px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface)}
.gchip.on{border-color:var(--ali);background:var(--ali-s);color:var(--ali-d)}
.gchip.on .bx{background:var(--ali);border-color:var(--ali);color:#fff}
.gchip.lim.on{border-color:var(--gas);background:var(--gas-s);color:var(--gas-d)}
.gchip.lim.on .bx{background:var(--gas);border-color:var(--gas)}
/* Marcada sola por un alimento: se ve marcada, pero el borde punteado
   avisa de que no se apaga desde aquí. */
/* Iconos: la imagen ocupa el mismo hueco que el emoji al que sustituye,
   así ponerla o quitarla no mueve nada de sitio. */
.ico-img{object-fit:contain;vertical-align:-.14em;display:inline-block}
.ico-em{display:inline-block;font-style:normal}
.gchip.auto{border-style:dashed}
.gchip.auto .bx{opacity:.72}
.gsep{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--gas-d);margin:12px 0 8px}
.plato-acc .pa.alt{flex:0 0 108px}

/* Notas de un evento */
/* El check del recordatorio: un círculo vacío que se puede tocar. */
.rc-ok{width:26px;height:26px;border-radius:50%;border:2px solid var(--cal);
  background:var(--surface);flex-shrink:0;cursor:pointer;margin-top:2px;
  display:flex;align-items:center;justify-content:center}
.rc-ok:active{transform:scale(.92)}
.rec .ir{color:var(--t3);display:flex;align-items:center;cursor:pointer}

.notas{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.nt{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;
  border-top:1px solid var(--border)}
.nt:first-child{border-top:0}
.nt .pt{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.nt div{flex:1;min-width:0}
.nt p{margin:0;font-size:13.5px;line-height:1.4}
.nt span{font-size:11.5px;color:var(--t3)}
.nt .qt{color:var(--t3);flex-shrink:0;padding:2px}
.nota-f{display:flex;gap:8px;align-items:stretch}
.nota-f .inp{flex:1;min-width:0}

/* Qué conviene para la siguiente comida */
.cons{background:var(--ali-c);border:1px solid var(--ali-s);border-radius:var(--r-l);
  padding:15px 16px;margin-bottom:14px}
.cons-hd{display:flex;align-items:center;gap:8px;color:var(--ali-d);margin-bottom:10px}
.cons-hd b{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.cons-l{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:7px}
.cons-l li{display:flex;align-items:center;gap:7px;background:var(--surface);
  border-radius:999px;padding:7px 13px 7px 9px;font-size:13.5px;font-weight:600;
  box-shadow:var(--sh)}
.cons-l .em{font-size:15px;line-height:1}
.cons-p{margin:0 0 5px;font-size:13px;color:var(--t2);line-height:1.4}
.cons-p:last-child{margin-bottom:0}
.cons-vacio{margin:0;font-size:13px;color:var(--t2);line-height:1.4}
.leg{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:14px;padding:0 2px;font-size:11.5px;
  color:var(--t2)}
.leg i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}

/* ---------- RECORDATORIO ---------- */
.rec{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh);padding:15px;
  display:flex;gap:13px;align-items:center;margin-bottom:14px}
.rec .i{width:48px;height:48px;border-radius:16px;background:var(--cal-s);color:var(--cal-d)}
.rec div{flex:1;min-width:0}
.rec .tt{font-size:13px;font-weight:700;color:var(--cal-d);letter-spacing:-.1px}
.rec b{display:block;font-size:14.5px;font-weight:600;margin-top:2px;letter-spacing:-.2px}
.rec p{margin:2px 0 0;font-size:12.5px;color:var(--t2);line-height:1.4}

/* ---------- NOVEDADES ---------- */
.nov{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh);
  margin-bottom:14px;overflow:hidden}
.nov-hd{padding:15px 16px 4px;font-size:16px;font-weight:700;letter-spacing:-.3px}
.nov-i{display:flex;gap:11px;padding:9px 16px;align-items:flex-start}
.nov-i .pt{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.nov-i div{flex:1;min-width:0}
.nov-i b{font-size:13.5px;font-weight:600;display:block;line-height:1.35;letter-spacing:-.1px}
.nov-i span{font-size:12px;color:var(--t3)}
.nov-i:last-child{padding-bottom:16px}

/* ---------- ATENCIÓN ----------
   Lo único de la home que NO se apaga por haber pasado por delante:
   se apaga cuando la cosa deja de estar pendiente. Capa de ESTADO
   (aviso), nunca de sección ni de perfil. */
.aten{background:var(--warn-s);border:1px solid var(--warn-b);border-radius:var(--r-l);
  padding:14px 15px;margin-bottom:14px}
.aten-hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;color:var(--warn-d);margin-bottom:9px}
.aten-i{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  padding:9px 0;text-align:left;cursor:pointer;border-top:1px solid var(--warn-b)}
.aten-i:first-of-type{border-top:0;padding-top:2px}
.aten-i:last-of-type{padding-bottom:0}
.aten-i .ic{width:32px;height:32px;border-radius:11px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;background:var(--surface);color:var(--warn-d)}
.aten-i div{flex:1;min-width:0}
.aten-i b{display:block;font-size:14px;font-weight:600;color:var(--t1);
  letter-spacing:-.15px;line-height:1.3}
.aten-i span{display:block;font-size:12px;color:var(--t2);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aten-i .fl-ch{color:var(--warn-d);flex-shrink:0}

/* ---------- OTRAS SECCIONES ---------- */
.tt-s{padding:20px 0 12px}
.tt-s h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.8px}
.tt-s p{margin:4px 0 0;font-size:14px;color:var(--t2)}
.pend{background:var(--surface);border-radius:var(--r-l);padding:44px 26px;text-align:center;
  box-shadow:var(--sh)}
.pend .i{width:60px;height:60px;border-radius:20px;margin:0 auto 14px}
.pend h3{margin:0 0 7px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.pend p{margin:0;font-size:13.5px;color:var(--t2);line-height:1.55}

/* ---------- HOJA INFERIOR ---------- */
.velo{position:fixed;inset:0;background:rgba(15,23,42,.32);z-index:800;opacity:0;
  pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;z-index:801;transform:translateY(101%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);padding:10px 18px calc(22px + var(--safe-b));
  max-height:84vh;overflow:auto}
.hoja.on{transform:translateY(0)}
.hoja .asa{width:40px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 16px}
.hoja h3{margin:0 0 14px;font-size:18px;font-weight:700;letter-spacing:-.4px}
.opt{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--r-btn);
  background:var(--surface2);margin-bottom:9px;width:100%}
.opt.on{background:var(--yo-s);box-shadow:inset 0 0 0 1.5px var(--yo)}
.opt .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:700;overflow:hidden}
.opt .av img{width:100%;height:100%;object-fit:cover}
.opt b{font-size:15px;font-weight:600;flex:1}

/* ---------- ALIMENTACIÓN ---------- */
.ali-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.ali-nav button.fl{width:38px;height:38px;border-radius:50%;background:var(--surface);
  color:var(--t2);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.ali-nav .rango{background:var(--surface);border-radius:999px;padding:9px 18px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:9px;color:var(--ali-d)}
.ali-nav .rango b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.ali-nav .rango span{display:block;font-size:11.5px;color:var(--t2);font-weight:500}

.ich-c{background:var(--ali-c);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);
  margin-bottom:14px}
.ich-top{display:flex;gap:16px;align-items:center}
.gauge{position:relative;width:104px;height:104px;flex-shrink:0}
.gauge .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0}
.gauge .lb{font-size:10.5px;font-weight:800;color:var(--ali-d);letter-spacing:.6px}
.gauge .vl{font-size:32px;font-weight:700;letter-spacing:-1.6px;color:var(--ali-d);line-height:1}
.gauge .mx{font-size:11px;color:var(--t2);font-weight:500}
.ich-tx{flex:1;min-width:0}
.ich-tx h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.2px;line-height:1.3;
  color:var(--t1)}
.ich-delta{margin-top:7px;font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:5px}
.ich-delta b{font-weight:700}
.ich-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ali-s);
  color:var(--ali-d);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;
  margin-top:9px}
.ich-comp{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:14px;
  border-top:1px solid rgba(15,23,42,.07);padding-top:13px}
.ich-comp div{text-align:center;padding:0 3px}
.ich-comp .em{font-size:17px;line-height:1}
.ich-comp .nm{font-size:10.5px;color:var(--t2);font-weight:600;margin-top:5px;line-height:1.25}
.ich-comp .pc{font-size:17px;font-weight:700;letter-spacing:-.5px;margin-top:3px}

.tb th.hoy b, .tb th.hoy{color:var(--ali-d)}

.tb td{padding:5px 0;text-align:center;border-top:1px solid var(--border)}

.comidas{background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);

.cm{display:flex;gap:12px;padding:11px 0;align-items:flex-start;position:relative}

.msg{background:var(--ali-c);border-radius:var(--r-l);padding:15px;box-shadow:var(--sh);

.lg-users{display:flex;gap:14px;justify-content:center;width:100%}

/* ---------- AVISOS EN LA NAV ---------- */

/* ---------- PERFIL ---------- */
.pf-hd{display:flex;gap:16px;align-items:flex-start;padding:6px 0 18px}
.pf-av{position:relative;flex-shrink:0}
.pf-av .av{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;

.pf-av .ed{position:absolute;right:0;bottom:4px;width:30px;height:30px;border-radius:50%;

  box-shadow:var(--sh)}
.pf-tx{flex:1;min-width:0;padding-top:6px}
.pf-tx h2{margin:0;font-size:27px;font-weight:700;letter-spacing:-.8px}

.pf-cog{width:44px;height:44px;border-radius:14px;background:var(--surface);display:flex;
  align-items:center;justify-content:center;color:var(--t2);box-shadow:var(--sh);flex-shrink:0}

.pf-kpis{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh);
  display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:12px;overflow:hidden}
.pf-k{padding:15px 11px;text-align:left;border-left:1px solid var(--border)}
.pf-k:first-child{border-left:none}
.pf-k .i{width:34px;height:34px;border-radius:12px;margin-bottom:9px}
.pf-k .lb{font-size:11.5px;color:var(--t2);line-height:1.3;min-height:30px}
.pf-k .vl{font-size:20px;font-weight:700;letter-spacing:-.7px;margin-top:4px;line-height:1.1}
.pf-k .sb{font-size:11.5px;color:var(--t3);margin-top:3px}
.pf-k .ok{display:inline-flex;align-items:center;gap:5px;background:var(--ali-s);
  color:var(--ali-d);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;
  margin-top:5px}
.pf-k .ko{background:var(--cal-s);color:var(--cal-d)}
.pf-mov{width:100%;background:var(--surface);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center;
  font-size:14px;font-weight:600;margin-bottom:16px}

.pf-sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.pf-sec-h b{font-size:16px;font-weight:700;letter-spacing:-.3px}
/* Una fila por sección, a ancho completo. En 2×2 cada tarjeta medía 195px
   y dentro había que meter dos cifras con sus dos etiquetas: los títulos
   se partían en tres líneas y los valores salían cortados. A ancho
   completo cada columna tiene el doble de sitio y no hace falta recortar
   nada. */
.pf-res{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.pf-r{border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:block;
  width:100%;text-align:left}

.pf-r .top .i{width:30px;height:30px;border-radius:10px}
.pf-r .top b{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.pf-r .duo{display:flex;gap:14px}
.pf-r .duo > div{flex:1;min-width:0}
.pf-r .lb{font-size:11.5px;color:var(--t2);line-height:1.3}
.pf-r .vl{font-size:21px;font-weight:700;letter-spacing:-.6px;margin-top:3px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-r .sb{font-size:11.5px;color:var(--t2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-r .pie{padding-top:12px}
.pf-r .pie span{display:flex;justify-content:space-between;align-items:center;
  border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:600}

/* ---------- MENSAJES ---------- */
.msgs{background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);

.msg-i{display:flex;gap:11px;padding:11px 0;align-items:flex-start;width:100%;text-align:left;

.msg-aviso{background:var(--surface2);border-radius:12px;padding:11px 13px;font-size:12px;

.act-l{background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);

/* ---------- CALENDARIO ---------- */
.cal-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-top .fl{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--t2);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);flex-shrink:0}

  align-items:center}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--t2);text-align:center}
.seg button.on{background:var(--surface);color:var(--cal-d);box-shadow:var(--sh)}

.rej{background:var(--surface);border-radius:var(--r-l);padding:14px 10px 12px;
  box-shadow:var(--sh);margin-bottom:12px}
.rej-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.rej-dow span{font-size:9.5px;font-weight:700;color:var(--t3);text-align:center;letter-spacing:.3px}
.rej-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
/* ALTURA FIJA. Cada celda mide lo mismo tenga lo que tenga dentro: los
   huecos de puntos y de bandas están siempre reservados. Con altura
   flexible, un mes con eventos se veía escalonado. */
.cd{border-radius:10px;padding:5px 1px 4px;display:flex;flex-direction:column;align-items:center;
  gap:2px;height:68px;background:transparent;overflow:hidden}
.cd.papa{background:var(--papa-s)} .cd.mama{background:var(--mama-s)}
.cd.avis{background:var(--avis-s)}
.cd.fuera{opacity:.34}
.cd .csa{line-height:1}
/* Hoy y el día elegido se marcan SIN encerrar el número: un óvalo sobre
   un fondo que ya tiene color queda sucio. Hoy va en negrita con un
   punto debajo; el elegido, con un aro fino alrededor de la celda. */
.cd .nu{font-size:13.5px;font-weight:600;line-height:1;height:20px;
  display:flex;align-items:center;justify-content:center;position:relative}
.cd.hoy .nu{font-weight:800}
.cd.hoy .nu::after{content:'';position:absolute;bottom:-3px;left:50%;margin-left:-2px;
  width:4px;height:4px;border-radius:50%;background:currentColor}
.cd.papa.hoy .nu{color:var(--papa-d)}
.cd.mama.hoy .nu{color:var(--mama-d)}
.cd.avis.hoy .nu{color:var(--avis-d)}
/* El aro va por dentro y sin borde: un `border` cambiaría la caja y
   empujaría el contenido medio píxel hacia abajo — eso era el salto. */
.cd.sel{box-shadow:inset 0 0 0 2px var(--t1)}
.cd.sel .nu{font-weight:800}
.cd .pts{display:flex;gap:2px;justify-content:center;align-items:center;height:6px;flex-shrink:0}
.cd .pts i{width:4.5px;height:4.5px;border-radius:50%;display:block}
.cd .bnds{display:flex;flex-direction:column;gap:1.5px;width:calc(100% + 2px);height:11.5px;
  flex-shrink:0;margin-top:auto}
.cd .bnds i{display:block;height:2.5px;border-radius:2px;background:transparent}
/* Cuando hay más tramos que huecos, el último se parte en trocitos:
   dice "aquí hay más" sin mentir sobre cuántos. */
.cd .bnds i.mas{background:repeating-linear-gradient(90deg,
  var(--t3) 0 4px, transparent 4px 7px)}
.rej-leg{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--border);font-size:11.5px;color:var(--t2)}
.rej-leg span{display:inline-flex;align-items:center;gap:6px}

.cats-h{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding:2px 0 4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats-h::-webkit-scrollbar{display:none}
.cats-h button{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--surface);
  border-radius:999px;padding:8px 13px;box-shadow:var(--sh);font-size:12.5px;font-weight:600;
  color:var(--t2)}
.cats-h button.on{color:#fff}
.cats-h button .pt{width:8px;height:8px;border-radius:50%}
.cats-h button svg{flex-shrink:0}
.hist .cats-h{margin:0 0 6px;padding:0 0 6px}

  flex-shrink:0}
.de{display:flex;gap:12px;align-items:flex-start;padding:11px 0;position:relative}

.de:last-of-type .ln{display:none}

  font-variant-numeric:tabular-nums;padding-top:9px}

  box-shadow:0 0 0 3px var(--surface)}
.de .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.de .tx{flex:1;min-width:0}
.de .tx b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.de .tx p{margin:1px 0 0;font-size:12.5px;color:var(--t2)}
.dia-vacio{font-size:13px;color:var(--t3);padding:8px 0 2px}
.cambio{margin-top:10px;background:var(--surface2);border-radius:12px;padding:10px 12px;
  font-size:12.5px;color:var(--t2);display:flex;gap:8px;align-items:center;font-weight:500}
.cambio b{font-weight:700;color:var(--t1)}

.dest{margin-bottom:12px}
.dest h3{margin:0 0 10px;font-size:16px;font-weight:700;letter-spacing:-.3px}
.dest-g{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dest-g::-webkit-scrollbar{display:none}
.dest-c{flex-shrink:0;width:186px;background:var(--surface);border-radius:var(--r);padding:13px;
  box-shadow:var(--sh);text-align:left}
.dest-c .em{font-size:24px;line-height:1}
.dest-c b{display:block;font-size:14px;font-weight:700;letter-spacing:-.2px;margin-top:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-c p{margin:2px 0 0;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.dest-c .fh{font-size:12px;color:var(--t3);margin-top:3px}

   tarda un par de segundos y sin señal parece que no ha pasado nada. */
#cargando{position:fixed;top:0;left:0;right:0;height:3px;z-index:900;

  0%{transform:translateX(-100%)} 60%{transform:translateX(250%)} 100%{transform:translateX(250%)}}
.pie-v{margin-top:9px}

   ni a ningún perfil, así que va en gris, no en el color de nadie. */
.pie-rec{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-btn);padding:9px 16px;

@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- fechas: siempre strings YYYY-MM-DD ---------- */
function pad(n){ return ('0'+n).slice(-2); }
function fk(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
function hoyStr(){ var d=new Date(); return fk(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function fechaKey(v){
  if(!v) return '';
  var s=String(v).trim(), m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1]+'-'+m[2]+'-'+m[3] : s;
}
function dow(f){ var p=f.split('-'); return new Date(+p[0], +p[1]-1, +p[2]).getDay(); }
function addDays(f,n){
  var p=f.split('-'), d=new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return fk(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function diffDias(a,b){
  var pa=a.split('-'), pb=b.split('-');
  return Math.round((Date.UTC(+pb[0],+pb[1]-1,+pb[2]) - Date.UTC(+pa[0],+pa[1]-1,+pa[2]))/86400000);
}
function lunesDe(f){ var d=dow(f); return addDays(f, d===0 ? -6 : 1-d); }
function fechaCorta(f){ var p=f.split('-'); return (+p[2])+' '+MESES_C[+p[1]-1]; }
/**
 * Un número escrito por una persona en España. La app imprime "1.240,55",
 * así que alguien acaba escribiéndolo igual: sin esto, parseFloat se
 * quedaba con 1,24 € y no avisaba de nada.
 *  · si hay coma, los puntos son miles     → 1.240,55 = 1240.55
 *  · si no hay coma pero los puntos separan grupos de tres, son miles
 *                                          → 1.240    = 1240
 *  · en cualquier otro caso el punto es decimal → 24.50 = 24.5
 */
function num(v){
  var s = String(v==null ? 0 : v).trim().replace(/[\s €]/g,'');
  if(s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function truthy(v){
  if(v===true||v===1) return true;
  var s=String(v).trim().toLowerCase();
  return s==='true'||s==='1'||s==='si'||s==='sí'||s==='x';
}
function eur(n){
  return n.toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2})+' €';
}

  'comidas','objetivos_semana','platos','citas','medicacion','dosis','episodios','vacunas',
  'crecimiento','documentos','mensajes','actividad','visitas',
  'tipos_comida','iconos','gina'];
function normalizar(d){
  d = d || {};
  TABLAS.forEach(function(k){ if(!Array.isArray(d[k])) d[k]=[]; });
  d.comidas.forEach(migraComida);
  if(!d.config) d.config = {};
  if(!d.hoy) d.hoy = hoyStr();
  return d;
}

/** Lo que hay que rehacer cada vez que llegan datos nuevos. */
function trasCargar(){
  tiposComidaDelSheet();
  guardarLogos();
  pintarLogos();
  _idxCustodia = null;
}

/* ---------- los dos logos ----------
   La pantalla de carga se pinta ANTES de pedir nada, así que el nombre del
   fichero no puede venir del Sheet en ese momento: se recuerda del último
   arranque. La primera vez de todas se ve el logo dibujado, que es
   exactamente para lo que está. */
function guardarLogos(){
  try {
    ['logo_splash','logo_login'].forEach(function(k){
      var f = ((state.data.iconos||[]).filter(function(r){
        return String(r.clave).trim() === k; })[0] || {}).fichero || '';
      if(f) localStorage.setItem('ginapp_'+k, String(f));
      else localStorage.removeItem('ginapp_'+k);
    });
  } catch(e){ /* modo privado: se queda el logo dibujado */ }
}
function pintarLogos(){
  [['logoSplash','logo_splash'],['logoLogin','logo_login']].forEach(function(par){
    var el = document.getElementById(par[0]);
    if(!el) return;
    var f = '';
    try { f = localStorage.getItem('ginapp_'+par[1]) || ''; } catch(e){}
    if(!f){ el.classList.remove('img'); return; }
    /* data-fb vacío no vale aquí: si el fichero falla queremos el dibujo
       de vuelta, no un hueco. Por eso se guarda el original. */
    if(!el.dataset.orig) el.dataset.orig = el.innerHTML;
    el.classList.add('img');
    el.innerHTML = '<img src="'+esc(rutaIcono(f))+'" alt="GINapp" ' +
                   'onerror="restaurarLogo(this)">';
  });
}
function restaurarLogo(img){
  var el = img.parentNode;
  if(el && el.dataset.orig){ el.classList.remove('img'); el.innerHTML = el.dataset.orig; }
}

/* ---------- usuarios ---------- */
function usuario(u){
  var f = state.data.usuarios.filter(function(x){ return String(x.username)===String(u); })[0];
  return f || { username:u, nombre:u||'—', color:'#94A3B8' };
}
function nombreDe(u){ return usuario(u).nombre || u; }
function claveColor(u){
  return u==='mama' ? 'mama' : u==='gina' ? 'gina' : u==='avis' ? 'avis' : 'papa';
}
/** Quién puede ENTRAR en la app. Ni la hija ni los avis: no apuntan nada. */
function esPerfil(u){
  var r = String(u.rol||'');
  if(r === 'hija' || r === 'abuelos') return false;
  /* Y activo: asi se puede retirar un perfil sin borrarlo. Vacio cuenta
     como activo, igual que en el resto del Sheet. */
  return u.activo === '' || u.activo === undefined || truthy(u.activo);
}
/** Las casas donde puede dormir. Los avis no son un perfil, solo una casa. */
var CASAS = ['papa','mama','avis'];
function esCasa(u){ return CASAS.indexOf(String(u)) >= 0; }
function colorDe(u){ return 'var(--'+claveColor(u)+')'; }
function otro(u){ return u==='papa' ? 'mama' : 'papa'; }
/* ============================================================
   ICONOS

   Cualquier fila del Sheet con columna `icono`, y las claves sueltas de la
   pestaña Iconos, pueden traer el nombre de un fichero de img/ o una URL
   entera. Vacío = se queda el emoji de siempre. Si el fichero no existe,
   el respaldo de arriba vuelve a poner el emoji. En ningún caso una imagen
   que falta deja un hueco.
   ============================================================ */

/**
 * Nombre de fichero escrito en el Sheet → ruta que sirve.
 *
 * Tolera las tres formas en que se escribe sin querer: con la carpeta
 * delante ("img/gina.webp"), con barra inicial ("/img/gina.webp") y una
 * URL entera. Escribir la carpeta dos veces daba "img/img/gina.webp" y
 * una foto que no aparecía sin decir por qué.
 */
function rutaIcono(src){
  var s = String(src||'').trim();
  if(!s) return '';
  if(/^(https?:)?\/\//.test(s) || s.indexOf('data:') === 0) return s;
  s = s.replace(/^\.?\//, '').replace(/^img\//i, '');
  return 'img/' + s;
}

/** Icono de una fila (usa su `icono`, si no su `emoji`). */
function ico(fila, px, emojiFb){
  var em = String((fila && fila.emoji) || emojiFb || '');
  var url = rutaIcono(fila && fila.icono);
  if(!url) return em ? '<span class="ico-em">'+esc(em)+'</span>' : '';
  return '<img class="ico-img" src="'+esc(url)+'" width="'+px+'" height="'+px+'" ' +
         'alt="" data-fb="'+esc(em)+'">';
}

/** Icono suelto de la pestaña Iconos, por clave. '' si no está puesto. */
function iconoDe(clave, px, emojiFb){
  var f = (state.data.iconos||[]).filter(function(r){
    return String(r.clave).trim() === clave; })[0];
  return ico({ icono: f && f.fichero, emoji: emojiFb }, px, emojiFb);
}
/** ¿Hay imagen puesta para esta clave? Para decidir si tapar un dibujo. */
function hayIcono(clave){
  return !!(state.data.iconos||[]).filter(function(r){
    return String(r.clave).trim() === clave && String(r.fichero||'').trim(); })[0];
}

function avatarHTML(u, px){
  var x = usuario(u);
  var ini = String(x.nombre||'?').trim().charAt(0).toUpperCase();
  var k = claveColor(u);
  var est = 'width:'+px+'px;height:'+px+'px;background:var(--'+k+'-s);color:var(--'+k+'-d)';
  return x.foto
    ? '<span class="av" style="'+est+'"><img src="'+esc(rutaIcono(x.foto))+'" alt="" ' +
      'data-fb="'+ini+'"></span>'
    : '<span class="av" style="'+est+'">'+ini+'</span>';
}

/* ============================================================
   CUSTODIA — fila explícita > patrón (marcado como estimado)
   ============================================================ */
var _idxCustodia = null;
function indexarCustodia(){
  _idxCustodia = {};
  state.data.custodia.forEach(function(r){
    var f = fechaKey(r.fecha);
    if(f) _idxCustodia[f] = r;
  });
}
function patronVigente(f){
  var mejor=null, score=-1;
  state.data.patron.forEach(function(p){
    var desde=fechaKey(p.desde), hasta=fechaKey(p.hasta);
    if(desde && f<desde) return;
    if(hasta && f>hasta) return;
    var s = ((desde||hasta)?1000:0) + (num(p.prioridad)||1);
    if(s>score){ score=s; mejor=p; }
  });
  return mejor;
}
function viernesDe(f){
  var d=dow(f);
  return addDays(f, -(d===5?0:d===6?1:d===0?2:d+2));
}
function custodiaDe(f){
  f = fechaKey(f);
  if(!_idxCustodia) indexarCustodia();
  var fila = _idxCustodia[f];
  if(fila) return { quien:String(fila.username||''), estimado:false, motivo:fila.motivo||'',
                    origen:String(fila.origen||'') };
  var pat = patronVigente(f);
  if(!pat) return { quien:'', estimado:true, motivo:'' };
  var v = String(pat[DIAS_COL[dow(f)]]||'').trim().toLowerCase();
  if(v !== 'alterno') return { quien:v, estimado:true, motivo:'' };
  var anc = fechaKey(pat.ancla_fecha);
  if(!anc || !pat.ancla_usuario) return { quien:'', estimado:true, motivo:'' };
  var sem = Math.round(diffDias(viernesDe(anc), viernesDe(f))/7);
  var base = String(pat.ancla_usuario).toLowerCase();
  return { quien: (((sem%2)+2)%2)===0 ? base : otro(base), estimado:true, motivo:'' };
}
function horaCambio(f){
  var pat = patronVigente(f);
  if(!pat) return '';
  var finde = dow(f)===5 || dow(f)===6 || dow(f)===0;
  return String((finde ? pat.hora_cambio_finde : pat.hora_cambio) || pat.hora_cambio || '');
}
function tramoDe(f){
  var q = custodiaDe(f).quien, ini=f, fin=f, i;
  for(i=0;i<40;i++){ var p=addDays(ini,-1); if(custodiaDe(p).quien!==q) break; ini=p; }
  for(i=0;i<40;i++){ var s=addDays(fin, 1); if(custodiaDe(s).quien!==q) break; fin=s; }
  return { quien:q, desde:ini, hasta:fin };
}

/* ============================================================
   EVENTOS — las repeticiones se generan, no se guardan
   ============================================================ */
function tipoEvento(id){
  var t = state.data.tipos_evento.filter(function(x){ return String(x.id)===String(id); })[0];
  return t || { id:'otro', nombre:'Otros', color:'#94A3B8' };
}
function excepcionEvento(eventoId, fecha){
  return state.data.eventos_excepciones.filter(function(e){
    return String(e.evento_id)===String(eventoId) && fechaKey(e.fecha)===fecha;
  })[0];
}
function ocurrencia(ev, f){
  var base = fechaKey(ev.fecha);
  if(!base || f < base) return null;
  var repite = String(ev.repite||'no').toLowerCase();
  var hasta = fechaKey(ev.repite_hasta);
  if(repite !== 'no' && hasta && f > hasta) return null;

  var cae = false;
  if(repite === 'no'){
    var fin = fechaKey(ev.fecha_fin) || base;
    cae = (f >= base && f <= fin);
  } else if(repite === 'semanal'){
    var dias = String(ev.repite_dias||'').split(',').filter(String);
    cae = dias.length ? dias.indexOf(DIAS_COL[dow(f)]) >= 0 : (diffDias(base,f) % 7 === 0);
  } else if(repite === 'mensual'){
    cae = f.slice(8) === base.slice(8);
  }
  if(!cae) return null;

  var exc = excepcionEvento(ev.id, f);
  if(exc && String(exc.accion)==='cancelado') return null;
  var hora = (exc && exc.nueva_hora) ? exc.nueva_hora : ev.hora;
  return { ev:ev, fecha:f, hora:String(hora||''), movido: !!(exc && exc.accion==='movido') };
}
function eventosDe(f){
  var out = [];
  state.data.eventos.forEach(function(ev){
    var o = ocurrencia(ev, f);
    if(o) out.push(o);
  });
  state.data.eventos_excepciones.forEach(function(e){
    if(String(e.accion)!=='movido' || fechaKey(e.nueva_fecha)!==f) return;
    var ev = state.data.eventos.filter(function(x){ return String(x.id)===String(e.evento_id); })[0];
    if(ev) out.push({ ev:ev, fecha:f, hora:String(e.nueva_hora||ev.hora||''), movido:true });
  });
  return out.sort(function(a,b){ return (a.hora||'99:99').localeCompare(b.hora||'99:99'); });
}
/**
 * Los próximos n eventos, UNO POR EVENTO.
 *
 * Antes esto recorría día a día y empujaba cada ocurrencia, así que un
 * viaje de cinco días salía cinco veces seguidas en la tarjeta de hoy y
 * se comía el hueco de todo lo demás. Ahora cada evento aparece una vez,
 * en su primer día visible, y lleva el tramo que ocupa.
 */
function proximosEventos(n, desdeFecha){
  var f = desdeFecha || state.data.hoy, out = [], vistos = {};
  for(var i=0; i<60 && out.length<n; i++){
    eventosDe(f).forEach(function(o){
      /* Las repeticiones sí vuelven: cada semana es una cita distinta.
         Lo que no se repite es el mismo tramo largo un día tras otro. */
      var k = esLargo(o.ev) ? 'L'+o.ev.id : o.ev.id + '@' + o.fecha;
      if(vistos[k] || out.length >= n) return;
      vistos[k] = true;
      out.push(o);
    });
    f = addDays(f,1);
  }
  return out;
}

/**
 * Normaliza a HH:MM, que es lo único que acepta <input type="time">.
 * El Sheet puede devolver "9:30", "9.30" o "930" de cuando el campo era
 * texto libre; si no se puede leer, se devuelve vacío antes que romper
 * el input y perder el resto del formulario.
 */
function horaHHMM(v){
  var t = String(v == null ? '' : v).trim();
  if(!t) return '';
  var m = t.match(/^(\d{1,2})\s*[:.,hH]?\s*(\d{2})?$/);
  if(!m) return '';
  var hh = Math.min(23, +m[1]), mm = Math.min(59, +(m[2] || 0));
  return (hh<10?'0':'') + hh + ':' + (mm<10?'0':'') + mm;
}

/** "26–30 ago", "Hoy · hasta el 30" — lo que dura, dicho como un tramo. */
function cuandoEvento(o){
  var ini = fechaKey(o.fecha), fin = fechaKey(o.ev.fecha_fin);
  if(!esLargo(o.ev)) return cuando(ini);
  var hoy = state.data.hoy;
  var empieza = ini <= hoy ? null : cuando(ini);
  return (empieza ? empieza + ' – ' : 'Hasta el ') +
         (empieza ? fechaCorta(fin) : fechaCorta(fin)) +
         (ini <= hoy && fin >= hoy ? ' · en curso' : '');
}
function cuando(f){
  return f===state.data.hoy ? 'Hoy'
       : f===addDays(state.data.hoy,1) ? 'Mañana'
       : f===addDays(state.data.hoy,-1) ? 'Ayer'
       : fechaCorta(f);
}

/* ============================================================
   ALIMENTACIÓN
   ============================================================ */
function resumenSemana(){
  var lun = lunesDe(state.data.hoy), dom = addDays(lun,6);
  var cs = state.data.comidas.filter(function(c){
    var f=fechaKey(c.fecha); return f>=lun && f<=dom;
  });
  var dias={}, alimentos={};
  cs.forEach(function(c){
    dias[fechaKey(c.fecha)] = true;
    if(c.alimento_id && String(c.estado_toma)!=='rechazo') alimentos[String(c.alimento_id)] = true;
  });
  var minDias = num(state.data.config.dias_min_ich) || 3;
  var nd = Object.keys(dias).length;
  return { diasConRegistro:nd, variedad:Object.keys(alimentos).length,
           registrosHoy: cs.filter(function(c){ return fechaKey(c.fecha)===state.data.hoy; }).length,
           suficiente: nd >= minDias, minDias: minDias };
}

/* ============================================================
   SALUD
   ============================================================ */
function proximaCita(){
  return state.data.citas
    .filter(function(c){ return fechaKey(c.fecha) >= state.data.hoy; })
    .sort(function(a,b){ return fechaKey(a.fecha).localeCompare(fechaKey(b.fecha)); })[0] || null;
}
function medicacionActiva(){
  return state.data.medicacion.filter(function(m){
    if(!truthy(m.activo)) return false;
    var fin = fechaKey(m.fin);
    return !fin || fin >= state.data.hoy;
  });
}
function ultimaDosis(medId){
  return state.data.dosis
    .filter(function(d){ return String(d.medicacion_id)===String(medId); })
    .sort(function(a,b){
      return (fechaKey(b.fecha)+' '+(b.hora||'')).localeCompare(fechaKey(a.fecha)+' '+(a.hora||''));
    })[0] || null;
}

/* ============================================================
   RED
   ============================================================ */
function backend(){
  /* La constante manda. localStorage solo existe como rescate mientras la
     constante esté sin rellenar: si la app dependiera del navegador, se
     rompería al instalarla como PWA o al abrirla en otro móvil. */
  if(BACKEND_URL && BACKEND_URL.indexOf('PEGA-AQUI') < 0) return BACKEND_URL;
  return localStorage.getItem(LS_URL) || '';
}
function token(){ return localStorage.getItem(LS_TOKEN) || ''; }

/** Un error del backend con su código, para poder distinguir el 'auth'. */
function errorBackend(j){
  var e = new Error((j && j.error) || 'Respuesta inesperada del backend');
  e.code = j && j.code;
  return e;
}
/** Sesión caducada o token inválido: se limpia y se vuelve a la puerta. */
function sesionCaida(err){
  if(err && err.code === 'auth'){
    localStorage.removeItem(LS_TOKEN);
    pintarLogin();
    return true;
  }
  return false;
}

function llamar(action, params){
  var url = new URL(backend());
  url.searchParams.set('action', action);
  Object.keys(params||{}).forEach(function(k){ url.searchParams.set(k, params[k]); });
  if(token()) url.searchParams.set('token', token());
  return fetch(url.toString())
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) throw errorBackend(j);
      return j.data;
    });
}
/**
 * POST con text/plain: no dispara preflight CORS desde GitHub Pages y
 * permite mandar payloads largos que no caben en una URL.
 */
function llamarPost(body){
  body = body || {};
  body.token = token();
  return fetch(backend(), {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) throw errorBackend(j);
      return j.data;
    })
    .catch(function(err){ sesionCaida(err); throw err; });
}

/** Recarga los datos del Sheet y repinta. Nada se guarda en local. */
var _cargas = 0;
function cargando(on){
  _cargas = Math.max(0, _cargas + (on ? 1 : -1));
  var el = $('#cargando');
  if(el) el.hidden = _cargas === 0;
}

function recargar(){
  cargando(true);
  return llamar('getBootstrap', {}).then(function(d){
    state.data = normalizar(d); trasCargar();
    state._primeraVez = null;
    pintarTodo();
    if(state.seccion === 'alimentacion') pintarAlimentacion();
    if(state.seccion === 'salud') pintarSalud();
    if(state.seccion === 'gastos') pintarGastos();
    if(state.seccion === 'calendario') pintarCalendario();
    if(state.seccion === 'perfil') pintarPerfil();
    pintarPieHora();
    cargando(false);
  }, function(err){ cargando(false); throw err; });
}

/**
 * Traer los datos a mano. Existe porque la app no se entera sola de lo
 * que apunta el otro: sin push, si la tienes abierta desde hace rato lo
 * que ves es de cuando la abriste.
 */
/**
 * Actualizar del todo, como en Gosari: tira la caché del service worker,
 * lo desregistra y recarga la página desde la red.
 *
 * Existe por dos motivos distintos que se resuelven igual:
 *  · lo que ves puede ser de hace rato (sin push, la app no se entera
 *    sola de lo que apunta el otro);
 *  · tras subir una versión nueva, el móvil puede seguir sirviendo la
 *    vieja de caché, y desde el móvil no hay forma de forzarlo.
 *
 * Si no hay service worker (navegador de escritorio, jsdom, iOS sin
 * instalar) se queda en traer los datos: recargar la página entera sin
 * necesidad sería peor experiencia.
 */
function recargarAMano(){
  var b = $('#btnRecargar');
  if(!b || b.classList.contains('cargando')) return;   /* no encadenar toques */
  b.classList.add('cargando');
  $('#recTxt').textContent = 'Actualizando…';

  return limpiarCache()
    .then(function(duro){
      if(duro){
        /* La caché ya no está: al recargar, todo viene de la red. */
        $('#recTxt').textContent = 'Recargando…';
        recargarPagina();
        return null;                       /* la página se va: no seguimos */
      }
      return recargar().then(function(){ toast('Al día'); });
    })
    .catch(function(err){
      if(!sesionCaida(err)) toast(err.message || 'No se ha podido actualizar', true);
    })
    .then(function(){
      if(!b.isConnected) return;
      b.classList.remove('cargando');
      $('#recTxt').textContent = 'Actualizar';
      pintarPieHora();
    });
}

/* Función aparte para poder comprobar en los tests que se llama:
   location.reload no se puede interceptar en jsdom. */
function recargarPagina(){ location.reload(); }

/** Borra cachés y desregistra el SW. Devuelve true si había algo que tirar. */
function limpiarCache(){
  var tareas = [], duro = false;
  try {
    if(window.caches && caches.keys){
      duro = true;
      tareas.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }));
    }
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      duro = true;
      tareas.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    }
  } catch(e){ duro = false; }
  /* Un fallo limpiando no debe dejarte sin actualizar: se sigue igual. */
  return Promise.all(tareas).then(function(){ return duro; },
                                  function(){ return false; });
}

/** Cuándo se trajeron por última vez, para saber si lo que miras es viejo. */
function pintarPieHora(){
  state._traido = new Date();
  var hh = state._traido.toTimeString().slice(0,5);
  if($('#recHora')) $('#recHora').textContent = 'Datos de las ' + hh;
}

function toast(msg, ko){
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'on' + (ko ? ' ko' : '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className=''; }, 3200);
}

var SECCIONES = [
  { id:'inicio',       nom:'Inicio',       ico:'inicio',       c:'ini' },
  { id:'calendario',   nom:'Calendario',   ico:'calendario',   c:'cal' },
  { id:'alimentacion', nom:'Comida',       ico:'alimentacion', c:'ali' },
  { id:'gastos',       nom:'Gastos',       ico:'gastos',       c:'gas' },
  { id:'salud',        nom:'Salud',        ico:'salud',        c:'sal' },
  { id:'perfil',       nom:'',             ico:'perfil',       c:'yo'  }
];

function aplicarPerfil(){
  var k = claveColor(state.user);
  var r = document.documentElement.style;
  r.setProperty('--yo',   'var(--'+k+')');
  r.setProperty('--yo-s', 'var(--'+k+'-s)');
  r.setProperty('--yo-d', 'var(--'+k+'-d)');
  /* Color ambiental: lo marca QUIÉN tiene hoy a Gina, no quién mira. */
  var q = custodiaDe(state.data.hoy).quien;
  var amb = q ? 'var(--'+claveColor(q)+'-amb)' : 'var(--bg)';
  r.setProperty('--amb', amb);
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', q==='mama' ? '#FFF7F7' : q==='papa' ? '#F5F9FF' : '#F8FAFC');
}
