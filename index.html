/* ============================================================
   ARRANQUE
   ============================================================ */
function arrancar(){
  $('#ver').textContent = APP_VERSION;
  $('#btnRecargar').querySelector('.ico').innerHTML = svg('recargar', 15);
  /* El enlace de rescate solo aparece si la constante sigue sin rellenar */
  if(!BACKEND_URL || BACKEND_URL.indexOf('PEGA-AQUI') >= 0){
    $('#pieDbg').innerHTML = ' · <button id="btnReset">cambiar backend</button>';
  }
  if(!backend()){
    $('#splashTx').innerHTML =
      'Falta poner la URL del backend en <b>index.html</b>.<br>' +
      'Busca <code>BACKEND_URL</code> al principio del <code>&lt;script&gt;</code> ' +
      'y pega ahí tu URL <code>/exec</code>.<br>' +
      '<button id="pedirUrl">Ponerla solo en este móvil</button>';
    $('#pedirUrl').addEventListener('click', pedirUrl);
    return;
  }
  /* Sin token NO se piden datos: primero la pantalla de entrada, que es
     lo único que el backend sirve sin identificarse. Antes se pedía el
     bootstrap entero antes de saber quién eras — y como esa lectura era
     libre, cualquiera con la URL podía hacer lo mismo. */
  if(!token()){
    llamar('getLogin', {})
      .then(function(d){
        state.data = normalizar({ usuarios:d.usuarios, modo:d.modo });
        pintarLogin();
      })
      .catch(function(err){
        $('#splashTx').innerHTML = 'No se pudo conectar.<br>' +
          '<span style="color:#D64545">' + esc(err.message||err) + '</span>';
      });
    return;
  }

  llamar('getBootstrap', {})
    .then(function(d){
      state.data = normalizar(d); trasCargar();
      var guardado = localStorage.getItem(LS_USER);
      var validos = state.data.usuarios.map(function(u){ return String(u.username); });
      state.user = (guardado && validos.indexOf(guardado)>=0) ? guardado : (validos[0] || 'papa');

      localStorage.setItem(LS_USER, state.user);
      pintarTodo();
      pintarPieHora();
      $('#splash').classList.add('out');
      setTimeout(function(){ $('#splash').hidden = true; }, 400);
      /* Se marca como visto DESPUÉS de pintar: si no, se borrarían las
         novedades de esta misma visita antes de que las veas. */
      marcarSeccionVista('inicio');
    })
    .catch(function(err){
      $('#splashTx').innerHTML = 'No se pudo cargar.<br>' +
        '<span style="color:#D64545">' + esc(err.message||err) + '</span><br>' +
        '<button id="pedirUrl">Cambiar la URL</button>';
      $('#pedirUrl').addEventListener('click', pedirUrl);
    });
}
function pedirUrl(){
  var v = prompt('URL de la aplicación web de Apps Script (acaba en /exec):', backend());
  if(v===null) return;
  v = v.trim();
  if(v.indexOf('/exec') < 0){ alert('La URL debe acabar en /exec, no en /dev.'); return; }
  localStorage.setItem(LS_URL, v);
  location.reload();
}

/* ---------- eventos globales ---------- */
document.addEventListener('click', function(e){
  /* ---------- login ---------- */
  var lgu = e.target.closest('[data-lguser]');
  if(lgu){
    lg.username = lgu.dataset.lguser;
    lg.pin = ''; lg.error = '';
    if(lg.username && (state.data.modo !== 'pin')) entrar();
    else pintarLogin();
    return;
  }
  var tec = e.target.closest('[data-tecla]');
  if(tec){
    var t = tec.dataset.tecla;
    if(t === 'del') lg.pin = lg.pin.slice(0,-1);
    else if(lg.pin.length < 4) lg.pin += t;
    lg.error = '';
    pintarLogin();
    if(lg.pin.length === 4) setTimeout(entrar, 120);
    return;
  }
  if(e.target.closest('#pfSalir')){ salir(); return; }

  var at = e.target.closest('[data-aten]');
  if(at){ abrirAtencion(Number(at.dataset.aten)); return; }

  var nav = e.target.closest('#nav button');
  if(nav){ ir(nav.dataset.s); return; }
  var card = e.target.closest('[data-ir]');
  if(card){ ir(card.dataset.ir); return; }
  var opt = e.target.closest('[data-user]');
  if(opt){
    /* Cambiar de perfil es volver a identificarse: si no, el PIN no serviría de nada. */
    cerrarHoja();
    localStorage.removeItem(LS_TOKEN);
    lg = { username: opt.dataset.user, pin:'', error:'' };
    if(state.data.modo === 'pin') pintarLogin();   /* pide el PIN del otro perfil */
    else entrar();                                 /* sin PIN, el cambio es directo */
    return;
  }
  if(e.target.closest('#btnPerfil')){ hojaPerfil(); return; }
  if(e.target.closest('#velo')){ cerrarHoja(); return; }
  if(e.target.closest('#btnNov')){
    var n = novedades();
    toast(n.length ? n.length + ' novedades desde tu última visita' : 'Nada nuevo por aquí');
    return;
  }
  /* ---------- alimentación ---------- */
  if(e.target.closest('#aliPrev')){ state.aliLunes = addDays(state.aliLunes,-7);
    state.aliDia = null; pintarAlimentacion(); return; }
  if(e.target.closest('#aliNext')){ state.aliLunes = addDays(state.aliLunes, 7);
    state.aliDia = null; pintarAlimentacion(); return; }
  if(e.target.closest('#addComida')){ abrirComida(''); return; }
  var cm = e.target.closest('[data-comida]');
  if(cm){ abrirComida(cm.dataset.comida); return; }

  /* ---------- hoja de comida ---------- */
  var chT = e.target.closest('[data-tipo]');
  if(chT){ borrador.tipo_comida = chT.dataset.tipo; pintarHojaComida(); return; }
  var chL = e.target.closest('[data-lugar]');
  if(chL){
    borrador.lugar = (borrador.lugar===chL.dataset.lugar) ? '' : chL.dataset.lugar;
    if(borrador.lugar === 'cole') borrador.con = '';
    else if(!borrador.con) borrador.con = custodiaDe(borrador.fecha).quien || state.user;
    pintarHojaComida(); return;
  }
  var gch = e.target.closest('.gchip[data-g]');
  if(gch && borrador){
    var g = gch.dataset.g;
    /* Una categoría que viene de un alimento no se desmarca aquí: sería
       mentirle a los objetivos. Se quita el alimento y se va sola. */
    if(gch.dataset.auto){
      toast('Lo aporta ' + gch.dataset.auto + '. Quítalo de la lista si no toca.');
      return;
    }
    var ix = borrador.items.findIndex(function(it){
      return !it.alimento_id && it.grupo === g; });
    if(ix >= 0) borrador.items.splice(ix,1);
    else {
      var o = objGrupo(g);
      borrador.items.push({ alimento_id:'', nombre:(o&&o.nombre)||g, grupo:g,
                            estado_toma:'comio', emoji:(o&&o.emoji)||'' });
    }
    borrador.platoTocado = true;
    pintarHojaComida(); return;
  }
  /* ---------- datos de Gina ---------- */
  if(e.target.closest('#fotoGina')){ hojaGina(); return; }
  if(e.target.closest('#gnNueva')){ formGina(''); return; }
  if(e.target.closest('#gnVolver')){ hojaGina(); return; }
  if(e.target.closest('#gnVerPass')){ verSecreto(); return; }
  var gnp = e.target.closest('[data-gnpoder]');
  if(gnp){ cambiarPoder(gnp.dataset.gnpoder); return; }
  var gnv = e.target.closest('[data-ginaver]');
  if(gnv){ hojaGinaFicha(gnv.dataset.ginaver); return; }
  var gne = e.target.closest('[data-ginaedit]');
  if(gne){ formGina(gne.dataset.ginaedit); return; }
  var gnt = e.target.closest('[data-gntipo]');
  if(gnt){ leerFormGina(); borradorGina.tipo = gnt.dataset.gntipo;
           pintarFormGina(); return; }
  var gnq = e.target.closest('[data-gnquita]');
  if(gnq){ leerFormGina(); borradorGina[gnq.dataset.gnquita] = '';
           pintarFormGina(); return; }
  if(e.target.closest('#gnCambiaPass')){
    leerFormGina(); borradorGina.secreto = ''; pintarFormGina(); return; }
  if(e.target.closest('#gnGuardar')){ guardarGina(); return; }
  if(e.target.closest('#gnBorrar')){ borrarGina(); return; }
  var cp = e.target.closest('[data-copiar]');
  if(cp){ copiar(cp.dataset.copiar); return; }

  var chC = e.target.closest('[data-con]');
  if(chC){ borrador.con = chC.dataset.con; pintarHojaComida(); return; }
  if(e.target.closest('#aliBib')){ hojaBiblioteca(); return; }
  if(e.target.closest('#aliStats')){ hojaStats(); return; }
  var bg = e.target.closest('[data-bibg]');
  if(bg){ state.bibG = bg.dataset.bibg; pintarBiblioteca(); return; }
  var be = e.target.closest('[data-bibe]');
  if(be){ state.bibE = be.dataset.bibe; pintarBiblioteca(); return; }
  var bed = e.target.closest('[data-bibedit]');
  if(bed){ hojaEditarAlimento(bed.dataset.bibedit); return; }
  var edg = e.target.closest('[data-edg]');
  if(edg){ state._edAl.grupo = edg.dataset.edg; pintarEditarAlimento(); return; }
  var ede = e.target.closest('[data-ede]');
  if(ede){ state._edAl.estado = ede.dataset.ede; pintarEditarAlimento(); return; }
  var eds = e.target.closest('[data-edsec]');
  if(eds){ state._edAl.seccion = eds.dataset.edsec; pintarEditarAlimento(); return; }
  if(e.target.closest('#edGuardar')){ guardarAlimentoEdit(false); return; }
  if(e.target.closest('#edRetirar')){ guardarAlimentoEdit(true); return; }

  var nc = e.target.closest('[data-nuevacomida]');
  if(nc){ abrirComida('', nc.dataset.nuevacomida); return; }
  var ad = e.target.closest('[data-alidia]');
  if(ad){ state.aliDia = ad.dataset.alidia; pintarAlimentacion(); return; }
  var rch = e.target.closest('[data-rechecho]');
  if(rch){ marcarRecordatorio(rch.dataset.rechecho, true); return; }
  if(e.target.closest('#btnNota')){ guardarNota(); return; }
  var nb = e.target.closest('[data-notaborra]');
  if(nb){ borrarNota(nb.dataset.notaborra); return; }
  if(e.target.closest('#btnPlato')){ interpretarPlato(); return; }
  var ab = e.target.closest('[data-abrir]');
  if(ab){ borrador.items[+ab.dataset.abrir].abierto = true; pintarHojaComida(); return; }
  var add = e.target.closest('[data-add]');
  if(add){
    var a = alimento(add.dataset.add);
    if(a){
      borrador.items.push({ alimento_id:String(a.id), nombre:String(a.nombre),
        grupo:String(a.grupo||'otros'), estado_toma:'comio', emoji:String(a.emoji||'') });
      pintarHojaComida();
    }
    return;
  }
  var quitar = e.target.closest('[data-quitar]');
  if(quitar) borrador.platoTocado = true;   /* tu corrección manda sobre la IA */
  if(quitar){ borrador.items.splice(+quitar.dataset.quitar,1); pintarHojaComida(); return; }
  var est = e.target.closest('[data-est]');
  if(est){ borrador.items[+est.dataset.ix].estado_toma = est.dataset.est;
    pintarHojaComida(); return; }
  var crear = e.target.closest('[data-crear]');
  if(crear){ hojaCrearAlimento(crear.dataset.crear); return; }
  if(e.target.closest('#modoGrupos')){ modoGrupos(); return; }
  if(e.target.closest('#guardarComida')){ guardarComida(); return; }
  if(e.target.closest('#borrarComida')){ borrarComida(); return; }

  /* ---------- marcar solo grupos ---------- */
  var mg = e.target.closest('[data-mg]');
  if(mg){
    var g = mg.dataset.mg;
    var ix = -1;
    borrador.items.forEach(function(it,i){ if(!it.alimento_id && it.grupo===g) ix=i; });
    if(ix>=0) borrador.items.splice(ix,1);
    else {
      var o = objGrupo(g) || {};
      borrador.items.push({ alimento_id:'', nombre:String(o.nombre||g), grupo:g,
        estado_toma:'comio', emoji:String(o.emoji||'') });
    }
    mg.classList.toggle('on');
    return;
  }
  if(e.target.closest('#mgOk')){ pintarHojaComida(); return; }

  /* ---------- crear alimento ---------- */
  var nug = e.target.closest('[data-g]');
  if(nug){
    state._nuGrupo = nug.dataset.g;
    $$('#nuGrupo .chip').forEach(function(c){ c.classList.toggle('on', c===nug); });
    $('#nuGuardar').disabled = false;
    return;
  }
  if(e.target.closest('#nuVolver')){ pintarHojaComida(); return; }
  if(e.target.closest('#nuGuardar')){ crearAlimento(); return; }

  /* ---------- perfil y mensajes ---------- */
  if(e.target.closest('#pfAjustes')){ hojaAjustes(); return; }
  if(e.target.closest('#ajPerfil')){ hojaPerfil(); return; }
  if(e.target.closest('#pfMovs')){ toast('Los movimientos llegan en la siguiente entrega'); return; }
  if(e.target.closest('#pfMasAct')){ state.pfTodaAct = !state.pfTodaAct; pintarPerfil(); return; }
  if(e.target.closest('#msgTodos')){ state.msgTodos = !state.msgTodos; pintarPerfil(); return; }
  if(e.target.closest('#msgNuevo')){ hojaMensaje(); return; }
  if(e.target.closest('#msgEnviar')){ enviarMensaje(); return; }
  if(e.target.closest('#msgCerrar')){ cerrarHoja(); return; }
  var mz = e.target.closest('[data-msg]');
  if(mz){ abrirMensaje(mz.dataset.msg); return; }

  /* ---------- calendario ---------- */
  if(e.target.closest('#calPrev')){
    state.calMes = mesAnterior(state.calMes,-1); state.calDia = null; pintarCalendario(); return; }
  if(e.target.closest('#calNext')){
    state.calMes = mesAnterior(state.calMes, 1); state.calDia = null; pintarCalendario(); return; }
  if(e.target.closest('#calHoy')){
    state.calMes = mesDe(state.data.hoy); state.calDia = state.data.hoy;
    pintarCalendario(); return; }
  var cv = e.target.closest('[data-vista]');
  if(cv){ state.calVista = cv.dataset.vista; pintarCalendario(); return; }
  var cdia = e.target.closest('[data-caldia]');
  if(cdia){
    state.calDia = cdia.dataset.caldia;
    if(mesDe(state.calDia) !== state.calMes) state.calMes = mesDe(state.calDia);
    pintarCalendario(); return;
  }
  var cst = e.target.closest('[data-cust]');
  if(cst){ formCustodia(cst.dataset.cust); return; }
  var cq = e.target.closest('[data-custq]');
  if(cq){ leerFormCust(); borradorCust.username = cq.dataset.custq;
          pintarFormCustodia(); return; }
  var cr = e.target.closest('[data-custr]');
  if(cr){ leerFormCust(); borradorCust.rango = cr.dataset.custr === '1';
          pintarFormCustodia(); return; }
  if(e.target.closest('#cuGuardar')){ guardarCustodia(); return; }
  if(e.target.closest('#cuVolver')){ quitarCustodia(); return; }

  var ccat = e.target.closest('[data-calcat]');
  if(ccat){ state.calCat = ccat.dataset.calcat; pintarCalendario(); return; }
  if(e.target.closest('#fabCal')){ formEvento(''); return; }
  var cev = e.target.closest('[data-calev]');
  if(cev){
    var evid = cev.dataset.calev;
    if(evid.indexOf('cita:') === 0){ formCita(evid.slice(5)); }
    else formEvento(evid);
    return;
  }
  var ec = e.target.closest('[data-ecampo]');
  if(ec){
    leerFormEvento();
    var en = ec.dataset.ecampo;
    borradorEvento[en] = (borradorEvento[en]===ec.dataset.val && en!=='repite')
      ? '' : ec.dataset.val;
    pintarFormEvento(); return;
  }
  var ed = e.target.closest('[data-edia]');
  if(ed){
    leerFormEvento();
    var ds = String(borradorEvento.repite_dias||'').split(',').filter(String);
    var ix = ds.indexOf(ed.dataset.edia);
    if(ix >= 0) ds.splice(ix,1); else ds.push(ed.dataset.edia);
    var orden = ['lun','mar','mie','jue','vie','sab','dom'];
    borradorEvento.repite_dias = orden.filter(function(x){ return ds.indexOf(x)>=0; }).join(',');
    pintarFormEvento(); return;
  }
  if(e.target.closest('#evGuardar')){ guardarEvento(); return; }
  if(e.target.closest('#evBorrar')){ borrarEvento(); return; }

  /* ---------- gastos ---------- */
  if(e.target.closest('#gasPrev')){
    state.gasMes = mesAnterior(state.gasMes,-1); state.gasTodos = false; pintarGastos(); return; }
  if(e.target.closest('#gasNext')){
    state.gasMes = mesAnterior(state.gasMes, 1); state.gasTodos = false; pintarGastos(); return; }
  if(e.target.closest('#gasTodos')){ state.gasTodos = !state.gasTodos; pintarGastos(); return; }
  if(e.target.closest('#gasNuevo')){ formGasto(''); return; }
  if(e.target.closest('#gasAporte') || e.target.closest('#gasAporteCC')){ formAporte(); return; }
  if(e.target.closest('#gasMovs')){ toast('Los movimientos llegan en la siguiente entrega'); return; }
  var gz = e.target.closest('[data-gasto]');
  if(gz){ formGasto(gz.dataset.gasto); return; }
  var gc = e.target.closest('[data-gcampo]');
  if(gc){
    leerFormGasto();
    var cn = gc.dataset.gcampo, vl = gc.dataset.val;
    borradorGasto[cn] = (cn==='compartido') ? (vl==='1')
      : (borradorGasto[cn]===vl && cn==='categoria') ? '' : vl;
    pintarFormGasto(); return;
  }
  var ac = e.target.closest('[data-acampo]');
  if(ac){ leerFormAporte();
    var an = ac.dataset.acampo;
    /* La cuota mensual solo es una propuesta razonable para un aporte;
       como saldo de partida sería un número inventado. */
    if(an === 'tipo' && ac.dataset.val !== borradorAporte.tipo){
      borradorAporte.importe = ac.dataset.val === 'ajuste'
        ? '' : String(cfgNum('cuota_mensual',0)||'');
    }
    borradorAporte[an] = ac.dataset.val; pintarFormAporte(); return; }
  if(e.target.closest('#gQuitaCmp')){
    leerFormGasto(); borradorGasto.comprobante = ''; pintarFormGasto(); return; }
  if(e.target.closest('#gasGuardar')){ guardarGasto(); return; }
  if(e.target.closest('#gasBorrar')){ borrarGasto(); return; }
  if(e.target.closest('#apGuardar')){ guardarAporte(); return; }

  /* ---------- salud ---------- */
  if(e.target.closest('#fabSalud')){ menuSalud(); return; }
  var dz = e.target.closest('[data-dosis]');
  if(dz){ marcarDosis(dz.dataset.dosis); return; }
  var sc = e.target.closest('[data-salcat]');
  if(sc){
    state.salCat = (state.salCat===sc.dataset.salcat) ? '' : sc.dataset.salcat;
    state.salTodo = false; pintarSalud(); return;
  }
  if(e.target.closest('#salTodo')){ state.salTodo = !state.salTodo; pintarSalud(); return; }
  var sn = e.target.closest('[data-salnuevo]');
  if(sn){
    var k = sn.dataset.salnuevo;
    if(k==='cita') formCita('');
    else if(k==='episodio') formEpisodio('');
    else if(k==='medida') formMedida('');
    else formMedicacion('');
    return;
  }
  if(e.target.closest('#crecNueva')){ formMedida(''); return; }
  if(e.target.closest('#crecTodas')){ hojaMedidas(); return; }
  var mz = e.target.closest('[data-medida]');
  if(mz){ formMedida(mz.dataset.medida); return; }
  if(e.target.closest('#mdGuardar')){ guardarMedida(); return; }
  if(e.target.closest('#mdBorrar')){ borrarMedida(); return; }
  var sf = e.target.closest('[data-salcampo]');
  if(sf){
    leerFormSalud();
    var campoN = sf.dataset.salcampo;
    borradorSalud[campoN] = (borradorSalud[campoN]===sf.dataset.val) ? '' : sf.dataset.val;
    pintarFormSalud(); return;
  }
  var reg = e.target.closest('[data-reg]');
  if(reg){
    var pr = reg.dataset.reg.split(':'), tipo = pr[0], rid = pr.slice(1).join(':');
    if(tipo==='cita') formCita(rid);
    else if(tipo==='episodio') formEpisodio(rid);
    else toast('Esta ficha llega en la siguiente entrega');
    return;
  }
  var ct = e.target.closest('[data-cita]');
  if(ct){ formCita(ct.dataset.cita); return; }
  if(e.target.closest('#salGuardar')){ guardarSalud(); return; }
  if(e.target.closest('#salBorrar')){ borrarSalud(); return; }
  if(e.target.closest('#salDocs')){ toast('Los documentos llegan en la siguiente entrega'); return; }

  if(e.target.closest('#semPrev')){ state.lunes = addDays(state.lunes,-7); pintarSemana(); return; }
  if(e.target.closest('#semNext')){ state.lunes = addDays(state.lunes, 7); pintarSemana(); return; }
  if(e.target.closest('#semHoy')){ state.lunes = lunesDe(state.data.hoy); pintarSemana(); return; }
  if(e.target.closest('#btnReset')){ pedirUrl(); return; }
  if(e.target.closest('#btnRecargar')){ recargarAMano(); return; }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'inFoto'){ fotoElegida(e.target); return; }
  if(e.target.id === 'gFoto' || e.target.id === 'gFich'){
    comprobanteElegido(e.target); return; }
  if(e.target.id === 'gnFa'){ fotoGinaElegida(e.target, 'foto_a'); return; }
  if(e.target.id === 'gnFb'){ fotoGinaElegida(e.target, 'foto_b'); return; }
});

document.addEventListener('input', function(e){
  if(e.target.id === 'inBusca'){ pintarBusqueda(); return; }
  if(e.target.id === 'bibQ'){ state.bibQ = e.target.value;
    var pos = e.target.selectionStart; pintarBiblioteca();
    var n = $('#bibQ'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } return; }
  if(e.target.id === 'inHora' && borrador){ borrador.hora = e.target.value; return; }
  if(e.target.id === 'inPlato' && borrador){ borrador.plato = e.target.value; return; }
  if(e.target.id === 'inDesc'  && borrador){ borrador.desc  = e.target.value; return; }
  if((e.target.id === 'cuIni' || e.target.id === 'cuFin') && borradorCust){
    leerFormCust(); pintarFormCustodia(); return; }
  if(e.target.id === 'nuNom'){
    var b = $('#nuGuardar');
    if(b) b.disabled = !(String(e.target.value).trim() && state._nuGrupo);
    return;
  }
});

/* Respaldo de imágenes: nunca onerror inline, el escapado anidado no funciona.
   Se sustituye la IMAGEN, no el contenido del padre: un icono roto dentro de
   un botón se llevaba por delante el texto del botón. */
document.addEventListener('error', function(ev){
  var el = ev.target;
  if(el.tagName !== 'IMG' || el.dataset.fb === undefined) return;
  if(el.classList.contains('ico-img')){
    var sp = document.createElement('span');
    sp.className = 'ico-em';
    sp.textContent = el.dataset.fb;
    if(el.parentNode) el.parentNode.replaceChild(sp, el);
    return;
  }
  el.parentNode.textContent = el.dataset.fb;
}, true);

pintarLogos();
arrancar();

if(navigator.serviceWorker){
  window.addEventListener('load', function(){
    try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){}
  });
}
</script>
