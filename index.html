    : f===addDays(state.data.hoy,-1) ? 'Ayer' : fechaCorta(f);
  return etiqueta + (hh ? ' · ' + hh : '');
}

/* ---------- números del mes para el perfil ---------- */
function diasConmigoEnMes(username, ym){
  var y = +ym.split('-')[0], m = +ym.split('-')[1];
  var dias = new Date(y, m, 0).getDate(), n = 0;
  for(var d = 1; d <= dias; d++){
    if(custodiaDe(fk(y,m,d)).quien === username) n++;
  }
  return { n: n, total: dias };
}
function eventosDelMes(ym){
  var y = +ym.split('-')[0], m = +ym.split('-')[1];
  var dias = new Date(y, m, 0).getDate(), pasados = 0, proximos = 0;
  for(var d = 1; d <= dias; d++){
    var f = fk(y,m,d), n = agendaDe(f).length;
    if(f < state.data.hoy) pasados += n;
    else proximos += n;
  }
  return { pasados: pasados, proximos: proximos };
}
function eventosEstaSemana(){
  var lun = lunesDe(state.data.hoy), n = 0;
  for(var i = 0; i < 7; i++){
    var f = addDays(lun,i);
    if(f >= state.data.hoy) n += agendaDe(f).length;
  }
  return n;
}
/** ICH medio de las semanas del mes que tengan datos suficientes. */
function ichMedioMes(ym){
  var y = +ym.split('-')[0], m = +ym.split('-')[1];
  var f = lunesDe(fk(y,m,1)), suma = 0, n = 0;
  for(var i = 0; i < 6; i++){
    if(mesDe(addDays(f,3)) === ym){
      var v = ich(f);
      if(v){ suma += v.total; n++; }
    }
    f = addDays(f, 7);
  }
  return n ? { valor: Math.round(suma/n), semanas: n } : null;
}
function nuevosDelMes(ym){
  var pv = primeraVezDe(), n = 0;
  Object.keys(pv).forEach(function(id){ if(mesDe(pv[id]) === ym) n++; });
  return n;
}
function registrosSaludMes(ym){
  return historialSalud('').filter(function(r){ return mesDe(r.fecha) === ym; }).length;
}

/**
 * Lo que ha hecho ESTE usuario en un mes. Todo se cuenta al vuelo desde lo
 * registrado; no hay ningún contador guardado en el Sheet que pueda
 * quedarse desfasado.
 *
 * Un apunte sobre "adelantado": es dinero que salió de su bolsillo y que
 * la cuenta común aún le debe, así que se miran los gastos con su origen,
 * compartidos y sin reembolso. Los que puso de su bolsillo para él solo no
 * cuentan: no se los debe nadie.
 */
function miMes(ym){
  var yo = state.user;
  var esMes = function(f){ return mesDe(fechaKey(f)) === ym; };
  var mio = function(r){ return String(r.creado_por||'') === yo; };

  var gs = state.data.gastos.filter(function(g){ return esMes(g.fecha) && mio(g); });
  var adelantado = 0, sinDevolver = 0;
  state.data.gastos.forEach(function(g){
    if(!esMes(g.fecha)) return;
    if(String(g.origen||'comun') !== yo) return;
    if(!truthy(g.compartido)) return;
    if(g.reembolso_id) return;
    adelantado += num(g.importe);
    sinDevolver++;
  });

  /* El próximo evento que cae en un día suyo: es el que le afecta. */
  var prox = null;
  proximosEventos(12).some(function(p){
    if(custodiaDe(fechaKey(p.fecha)).quien !== yo) return false;
    prox = p; return true;
  });

  var comidas = {};
  state.data.comidas.forEach(function(c){
    if(esMes(c.fecha) && mio(c)) comidas[String(c.grupo_id || c.id)] = 1;
  });

  return {
    eventos: state.data.eventos.filter(function(e){ return esMes(e.fecha) && mio(e); }).length,
    proxTit: prox ? (prox.ev.titulo || 'Un evento') : '—',
    proxSub: prox ? cuandoEvento(prox) : 'nada en tus días',
    comidas: Object.keys(comidas).length,
    alimentos: state.data.alimentos.filter(mio).length,
    gastos: gs.length,
    gastadoTotal: gs.reduce(function(a,g){ return a + num(g.importe); }, 0),
    adelantado: adelantado,
    sinDevolver: sinDevolver,
    salud: historialSalud('').filter(function(r){
      return mesDe(r.fecha) === ym && String(r.creado_por||'') === yo; }).length,
    dosis: state.data.dosis.filter(function(x){
      return esMes(x.fecha) && String(x.dado_por||'') === yo; }).length
  };
}

/* ============================================================
   CALENDARIO
   Mezcla eventos y citas médicas: §35 dice que las citas aparecen
   también aquí, y apuntarlas dos veces sería tener dos fuentes de
   verdad para el mismo día.
   ============================================================ */

/** Una cita de Salud vista como evento del calendario. */
function citaComoEvento(c){
  var tipo = String(c.tipo||'') === 'dentista' ? 'dentista' : 'medico';
  return { ev: { id:'cita:'+c.id, titulo:String(c.motivo || c.tipo || 'Cita médica'),
                 tipo:tipo, lugar:String(c.centro||''), responsable:String(c.acompana||''),
                 notas:String(c.notas||''), accion:'', _cita:true },
           fecha: fechaKey(c.fecha), hora:String(c.hora||''), movido:false };
}
/** Todo lo que ocurre un día: eventos propios + citas médicas. */
function agendaDe(f){
  var out = eventosDe(f);
  state.data.citas.forEach(function(c){
    if(fechaKey(c.fecha) === f) out.push(citaComoEvento(c));
  });
  if(state.calCat) out = out.filter(function(o){ return String(o.ev.tipo)===state.calCat; });
  return out.sort(function(a,b){ return (a.hora||'99:99').localeCompare(b.hora||'99:99'); });
}
/** ¿El evento dura más de un día? Entonces se pinta como banda, no como punto. */
function esLargo(ev){
  var fin = fechaKey(ev.fecha_fin);
  return !!fin && fin > fechaKey(ev.fecha);
}

function pintarCalendario(){
  var ym = state.calMes || mesDe(state.data.hoy);
  state.calMes = ym;
  var y = +ym.split('-')[0], m = +ym.split('-')[1];

  $('#calPrev').innerHTML = svg('chevronI',17);
  $('#calNext').innerHTML = svg('chevron',17);
  $('#calRango').innerHTML = svg('calendario',17) +
    '<span>'+MESES[m-1].charAt(0).toUpperCase()+MESES[m-1].slice(1)+' '+y+'</span>';
  $$('#calSeg button').forEach(function(b){
    b.classList.toggle('on', b.dataset.vista === (state.calVista||'mes'));
  });

  var out = '';
  /* Lo primero, el día que estás mirando. La rejilla es para navegar;
     el detalle es lo que vienes a leer. */
  if(state.calVista !== 'agenda') out += detalleDia();
  out += (state.calVista === 'agenda') ? vistaAgenda() : vistaMes(y, m);

  /* ---- filtro por categoría ---- */
  var tipos = state.data.tipos_evento;
  out += '<div class="cats-h"><button data-calcat="" class="'+(state.calCat?'':'on') +
    '" style="'+(state.calCat?'':'background:var(--cal-d)')+'">' +
    (state.calCat ? '' : '<span class="pt" style="background:#fff"></span>') + 'Todos</button>' +
    tipos.map(function(t){
      var on = state.calCat===String(t.id);
      return '<button data-calcat="'+esc(t.id)+'" class="'+(on?'on':'')+'" style="'+
        (on?'background:'+t.color:'')+'"><span class="pt" style="background:'+
        (on?'#fff':t.color)+'"></span>'+esc(t.nombre)+'</button>';
    }).join('') + '</div>';

  out += destacados();

  $('#calCuerpo').innerHTML = out;
  var n = agendaDe(state.data.hoy).length;
  $('#calSub').textContent = n ? (n===1 ? '1 cosa hoy' : n+' cosas hoy')
    : 'Custodia y eventos.';
  $('#fabCal').innerHTML = svg('mas',19) + 'Evento';
}

function vistaMes(y, m){
  var primero = fk(y, m, 1);
  var offset = (dow(primero) + 6) % 7;             /* la semana empieza en lunes */
  var dias = new Date(y, m, 0).getDate();
  var hoy = state.data.hoy, sel = state.calDia;

  /* La leyenda nombra solo las casas que de verdad salen este mes: si no
     hay ningún día con los avis, no hay por qué mencionarlos. */
  var casasDelMes = [];
  var celdas = '';
  for(var i = -offset; i < dias + (7 - ((offset + dias) % 7)) % 7; i++){
    var f = addDays(primero, i);
    var fuera = mesDe(f) !== fk(y,m,1).slice(0,7);
    var c = custodiaDe(f);
    var evs = agendaDe(f);
    var largos = evs.filter(function(o){ return esLargo(o.ev); });
    var puntos = evs.filter(function(o){ return !esLargo(o.ev); });
    if(!fuera && c.quien && casasDelMes.indexOf(c.quien) < 0) casasDelMes.push(c.quien);
    var cls = ['cd', c.quien?claveColor(c.quien):'', fuera?'fuera':'',
               f===hoy?'hoy':'', f===sel?'sel':''].filter(String).join(' ');
    celdas += '<button class="'+cls+'" data-caldia="'+f+'">' +
      '<span class="csa" style="color:'+(c.quien?'var(--'+claveColor(c.quien)+')':'var(--t3)')+'">' +
        svg('casa',14)+'</span>' +
      '<span class="nu">'+(+f.split('-')[2])+'</span>' +
      /* Los dos huecos de abajo se pintan SIEMPRE, con o sin contenido.
         Si solo aparecieran cuando hay algo, cada celda mediría distinto
         y la rejilla se desalinearía en cuanto se empieza a usar. */
      '<span class="pts">' + puntos.slice(0,3).map(function(o){
        return '<i style="background:'+tipoEvento(o.ev.tipo).color+'"></i>'; }).join('') + '</span>' +
      /* Tres huecos en vez de dos, y si hay más de tres el último se
         pinta a rayas para decir que queda algo por ver. */
      '<span class="bnds">' + [0,1,2].map(function(n){
        if(n === 2 && largos.length > 3) return '<i class="mas"></i>';
        var o = largos[n];
        return '<i'+(o ? ' style="background:'+tipoEvento(o.ev.tipo).color+'"' : '')+'></i>';
      }).join('') + '</span>' +
      '</button>';
  }

  return '<div class="rej"><div class="rej-dow">' +
    DOW_CORTO.map(function(d){ return '<span>'+d+'</span>'; }).join('') + '</div>' +
    '<div class="rej-g">'+celdas+'</div>' +
    '<div class="rej-leg">' + casasDelMes.map(function(u){
      var k = claveColor(u);
      return '<span><span style="color:var(--'+k+')">'+svg('casa',15)+'</span>Con ' +
        esc(nombreDe(u).toLowerCase())+'</span>';
    }).join('') + '</div></div>';
}

function detalleDia(){
  var f = state.calDia || state.data.hoy;
  state.calDia = f;
  var c = custodiaDe(f), evs = agendaDe(f);
  var k = c.quien ? claveColor(c.quien) : '';

  var h = '<div class="dia-d"><div class="dia-hd">' +
    '<b>'+DOW_LARGO[dow(f)].charAt(0).toUpperCase()+DOW_LARGO[dow(f)].slice(1)+', ' +
      (+f.split('-')[2])+' de '+MESES[+f.split('-')[1]-1]+'</b>' +
    /* Cambiar de quién es un día no es algo de cada día: va como icono
       pegado al indicador, no como botón grande ocupando sitio. */
    (c.quien ? '<button class="qn" data-cust="'+f+'" style="color:var(--'+k+'-d);' +
      'background:var(--'+k+'-s)">Duerme con '+ esc(nombreDe(c.quien).toLowerCase()) +
      (c.origen === 'cambio' ? '<i class="mk"></i>' : '') +
      '<span class="lp">'+svg('lapiz',13)+'</span></button>' : '') + '</div>';

  if(c.origen === 'cambio' && c.motivo){
    h += '<div class="dia-mot">'+svg('casa',12)+' '+esc(c.motivo)+'</div>';
  }

  if(!evs.length){
    h += '<div class="dia-vacio">' +
      (state.calCat ? 'Nada de esta categoría este día.' : 'Nada apuntado este día.') + '</div>';
  } else {
    h += evs.map(function(o){
      var t = tipoEvento(o.ev.tipo);
      var sub = [o.ev.lugar, o.ev.responsable ? 'lleva '+nombreDe(o.ev.responsable).toLowerCase() : '']
        .filter(String).join(' · ');
      return '<div class="de" data-calev="'+esc(o.ev.id)+'"><div class="ln"></div>' +
        '<span class="hr">'+esc(o.hora||'')+'</span>' +
        '<span class="pt" style="background:'+t.color+'"></span>' +
        '<span class="ic" style="background:'+t.color+'1F;color:'+t.color+'">' +
          svg(icoEvento(t.id),18)+'</span>' +
        '<span class="tx"><b>'+esc(o.ev.titulo)+'</b>' +
          (sub?'<p>'+esc(sub)+'</p>':'')+'</span>' +
        svg('chevron',15,' style="color:var(--t3);margin-top:11px"')+'</div>';
    }).join('');
  }

  /* Si mañana cambia de casa, decirlo: es la pregunta práctica del día */
  var sig = custodiaDe(addDays(f,1));
  if(c.quien && sig.quien && sig.quien !== c.quien){
    var hh = horaCambio(f);
    h += '<div class="cambio">'+svg('reloj',16)+'<span>Cambio de casa' +
      (hh ? ' a las <b>'+esc(hh)+'</b>' : '') + ': pasa con <b>' +
      esc(nombreDe(sig.quien).toLowerCase())+'</b></span></div>';
  }
  return h + '</div>';
}

function vistaAgenda(){
  var h = '<div class="ag">', hay = false;
  for(var i = 0; i < 45; i++){
    var f = addDays(state.data.hoy, i);
    var evs = agendaDe(f);
    if(!evs.length) continue;
    hay = true;
    var c = custodiaDe(f), k = c.quien ? claveColor(c.quien) : '';
    h += '<div class="ag-d"><div class="ag-f"><b>' +
      (f===state.data.hoy ? 'Hoy' : f===addDays(state.data.hoy,1) ? 'Mañana'
        : DOW_LARGO[dow(f)]+' '+(+f.split('-')[2])+' '+MESES_C[+f.split('-')[1]-1]) + '</b>' +
      (c.quien ? '<span class="qn" style="color:var(--'+k+'-d)">con ' +
        esc(nombreDe(c.quien).toLowerCase())+'</span>' : '') + '</div>' +
      evs.map(function(o){
        var t = tipoEvento(o.ev.tipo);
        return '<button class="ag-e" data-calev="'+esc(o.ev.id)+'">' +
          '<span class="pt" style="background:'+t.color+'"></span>' +
          '<span class="hr">'+esc(o.hora||'—')+'</span>' +
          '<span class="nm">'+esc(o.ev.titulo)+'</span>' +
          svg('chevron',14,' style="color:var(--t3)"')+'</button>';
      }).join('') + '</div>';
  }
  if(!hay) h += '<div class="dia-vacio">No hay nada apuntado en los próximos 45 días.</div>';
  return h + '</div>';
}

/** Lo que merece una tarjeta: lo largo y lo señalado, no la logopedia del martes. */
var CAT_DESTACADA = { vacaciones:1, viajes:1, cumples:1, excursiones:1, sin_clases:1 };
function destacados(){
  var vistos = {}, out = [];
  for(var i = 0; i < 240 && out.length < 6; i++){
    var f = addDays(state.data.hoy, i);
    eventosDe(f).forEach(function(o){
      if(vistos[o.ev.id]) return;
      if(!CAT_DESTACADA[String(o.ev.tipo)] && !esLargo(o.ev)) return;
      vistos[o.ev.id] = true;
      out.push(o);
    });
  }
  if(!out.length) return '';
  return '<div class="dest"><h3>Próximos eventos destacados</h3><div class="dest-g">' +
    out.map(function(o){
      var t = tipoEvento(o.ev.tipo);
      var fin = fechaKey(o.ev.fecha_fin);
      var rango = fin && fin > o.fecha
        ? fechaCorta(o.fecha)+' – '+fechaCorta(fin) : fechaCorta(o.fecha);
      var r = String(o.ev.responsable||'');
      var chip = r
        ? { t:'Con '+nombreDe(r).toLowerCase(), bg:'var(--'+claveColor(r)+'-s)',
            fg:'var(--'+claveColor(r)+'-d)' }
        : { t:'Sin asignar', bg:'var(--surface2)', fg:'var(--t2)' };
      return '<button class="dest-c" data-calev="'+esc(o.ev.id)+'">' +
        '<span class="em">'+ico(t,17,'📌')+'</span>' +
        '<b>'+esc(o.ev.titulo)+'</b>' +
        '<p>'+esc(o.ev.lugar || t.nombre)+'</p>' +
        '<div class="fh">'+rango+'</div>' +
        '<span class="ch" style="background:'+chip.bg+';color:'+chip.fg+'">'+esc(chip.t)+'</span>' +
        '</button>';
    }).join('') + '</div></div>';
}

/* ---------- formulario de evento ---------- */
var borradorEvento = null;
var DIAS_SEM = [{id:'lun',n:'L'},{id:'mar',n:'M'},{id:'mie',n:'X'},{id:'jue',n:'J'},
                {id:'vie',n:'V'},{id:'sab',n:'S'},{id:'dom',n:'D'}];

function formEvento(id){
  var ev = id ? state.data.eventos.filter(function(x){ return String(x.id)===String(id); })[0] : null;
  if(ev && !esMio(ev)){
    var t = tipoEvento(ev.tipo);
    return hojaAjena(ev.titulo, [
      ['Categoría', t.nombre],
      ['Fecha', fechaCorta(fechaKey(ev.fecha)) +
        (fechaKey(ev.fecha_fin) ? ' – '+fechaCorta(fechaKey(ev.fecha_fin)) : '')],
      ev.hora ? ['Hora', String(ev.hora)] : null,
      ev.lugar ? ['Lugar', String(ev.lugar)] : null,
      ev.responsable ? ['Se encarga', nombreDe(ev.responsable)] : null,
      ev.accion ? ['Recordatorio', String(ev.accion)] : null
    ], ev.creado_por);
  }
  borradorEvento = ev
    ? { id:ev.id, titulo:String(ev.titulo||''), tipo:String(ev.tipo||'otros'),
        fecha:fechaKey(ev.fecha), fecha_fin:fechaKey(ev.fecha_fin), hora:String(ev.hora||''),
        lugar:String(ev.lugar||''), responsable:String(ev.responsable||''),
        accion:String(ev.accion||''), repite:String(ev.repite||'no'),
        repite_dias:String(ev.repite_dias||''), repite_hasta:fechaKey(ev.repite_hasta) }
    : { id:'', titulo:'', tipo:'', fecha:state.calDia || state.data.hoy, fecha_fin:'',
        hora:'', lugar:'', responsable:'', accion:'', repite:'no', repite_dias:'',
        repite_hasta:'' };
  pintarFormEvento();
}

function pintarFormEvento(){
  var b = borradorEvento;
  var esViaje = b.tipo === 'viajes';
  var h = '<h3>'+(b.id?'Editar evento':'Nuevo evento')+'</h3>' +
    '<div class="f-lb">Qué es</div>' +
    '<input class="inp" id="eTit" type="text" value="'+esc(b.titulo)+'" placeholder="Natación">' +
    '<div class="f-lb">Categoría</div><div class="chips">' +
      state.data.tipos_evento.map(function(t){
        var on = b.tipo===String(t.id);
        return '<button class="chip'+(on?' on':'')+'" style="'+(on?'background:'+t.color:'')+'" ' +
          'data-ecampo="tipo" data-val="'+esc(t.id)+'">'+ico(t,15,'')+' ' +
          esc(t.nombre)+'</button>';
      }).join('') + '</div>' +
    '<div class="f-lb">Empieza</div><div class="fila2">' +
      '<input class="inp" id="eFecha" type="date" value="'+esc(b.fecha)+'">' +
      '<input class="inp" id="eHora" type="time" style="width:118px" ' +
        'value="'+esc(horaHHMM(b.hora))+'"></div>' +
    /* Un viaje sale y llega; una clase empieza y acaba. Es la misma
       pareja de campos, así que se dice con las palabras de cada cosa. */
    '<div class="f-lb">' + (esViaje ? 'Vuelve' : 'Acaba') +
      ' <span class="op">opcional</span></div><div class="fila2">' +
      '<input class="inp" id="eFin" type="date" value="'+esc(b.fecha_fin)+'">' +
      '<input class="inp" id="eHoraFin" type="time" style="width:118px" ' +
        'value="'+esc(horaHHMM(b.hora_fin))+'"></div>' +
    '<div class="f-lb">Dónde</div>' +
    '<input class="inp" id="eLugar" type="text" value="'+esc(b.lugar)+'" ' +
      'placeholder="Piscina Municipal">' +
    '<div class="f-lb">Quién se encarga</div><div class="chips">' +
      state.data.usuarios.filter(esPerfil).map(function(u){
        var on = b.responsable===String(u.username);
        return '<button class="chip'+(on?' on':'')+'" style="'+
          (on?'background:'+colorDe(u.username):'')+'" data-ecampo="responsable" ' +
          'data-val="'+esc(u.username)+'">'+esc(u.nombre)+'</button>';
      }).join('') +
      '<button class="chip'+(b.responsable?'':' on')+'" style="'+
        (b.responsable?'':'background:var(--t2)')+'" data-ecampo="responsable" data-val="">' +
        'Sin asignar</button></div>' +
    '<div class="f-lb">¿Se repite?</div><div class="chips">' +
      [{id:'no',n:'No'},{id:'semanal',n:'Cada semana'},{id:'mensual',n:'Cada mes'}]
      .map(function(r){
        var on = b.repite===r.id;
        return '<button class="chip'+(on?' on':'')+'" style="'+
          (on?'background:var(--cal-d)':'')+'" data-ecampo="repite" data-val="'+r.id+'">' +
          r.n+'</button>';
      }).join('') + '</div>';

  if(b.repite === 'semanal'){
    var sel = String(b.repite_dias||'').split(',').filter(String);
    h += '<div class="f-lb">Qué días</div><div class="chips">' + DIAS_SEM.map(function(d){
      var on = sel.indexOf(d.id) >= 0;
      return '<button class="chip'+(on?' on':'')+'" style="width:42px;text-align:center;' +
        (on?'background:var(--cal-d)':'')+'" data-edia="'+d.id+'">'+d.n+'</button>';
    }).join('') + '</div>';
  }
  if(b.repite !== 'no'){
    h += '<div class="f-lb">Hasta cuándo</div>' +
      '<input class="inp" id="eHasta" type="date" value="'+esc(b.repite_hasta)+'">' +
      '<div class="aviso">Las repeticiones no se guardan como filas: se generan al pintar. ' +
      'Así cambiar la hora de la natación la cambia en todas, no en una.</div>';
  }
  h += '<div class="f-lb">Recordatorio <span class="op">opcional</span></div>' +
    '<input class="inp" id="eAccion" type="text" value="'+esc(b.accion)+'" ' +
      'placeholder="Hacer la mochila">' +
    '<div class="aviso" style="background:var(--surface2);color:var(--t2)">' +
    'Es un recado que hay que hacer: sale en el inicio y se puede marcar como ' +
    'hecho. Para contar algo del evento sin que sea un recado, usa las notas.</div>';

  /* Las notas las escribe cualquiera de los dos, aunque el evento no sea
     suyo: una nota no cambia el evento, solo añade contexto. Por eso van
     aparte y no dentro del formulario que solo puede tocar su dueño. */
  if(b.id){
    var ns = comentariosDe('evento', b.id);
    h += '<div class="f-lb">Notas</div>';
    if(ns.length){
      h += '<div class="notas">' + ns.map(function(n){
        var mio = String(n.autor) === state.user;
        return '<div class="nt"><span class="pt" style="background:'+colorDe(n.autor)+'"></span>' +
          '<div><p>'+esc(n.texto)+'</p><span>'+esc(nombreDe(n.autor))+' · ' +
          esc(cuandoTs(n.timestamp))+'</span></div>' +
          (mio ? '<button class="qt" data-notaborra="'+esc(n.id)+'">' +
                 svg('cerrar',13)+'</button>' : '') + '</div>';
      }).join('') + '</div>';
    }
    h += '<div class="nota-f">' +
      '<input class="inp" id="eNota" type="text" placeholder="Añadir una nota…">' +
      '<button class="pa" id="btnNota" style="flex:0 0 auto;padding:0 16px">' +
        svg('mas',15)+'</button></div>' +
      '<div class="plato-e">Las notas las puede escribir cualquiera de los dos, ' +
      'aunque el evento no sea suyo.</div>';
  }

  h += '<button class="btn" style="background:var(--cal-d)" id="evGuardar">' +
       (b.id?'Guardar cambios':'Guardar evento')+'</button>';
  if(b.id) h += '<button class="btn del" id="evBorrar">Borrar este evento</button>';
  abrirHoja(h);
}

function leerFormEvento(){
  var b = borradorEvento;
  function v(id){ var e = $('#'+id); return e ? String(e.value||'').trim() : null; }
  if(v('eTit')!==null)    b.titulo = v('eTit');
  if(v('eFecha'))         b.fecha = v('eFecha');
  if(v('eHora')!==null)   b.hora = v('eHora');
  if(v('eHoraFin')!==null) b.hora_fin = v('eHoraFin');
  if(v('eFin')!==null)    b.fecha_fin = v('eFin');
  if(v('eLugar')!==null)  b.lugar = v('eLugar');
  if(v('eAccion')!==null) b.accion = v('eAccion');
  if(v('eHasta')!==null)  b.repite_hasta = v('eHasta');
}

/* ---------- cambiar de quién es un día, o un tramo entero ----------
   Un verano son 75 días. Picarlos uno a uno no es una interfaz, es un
   castigo — así que el mismo formulario sirve para un día suelto y para
   un tramo, con un interruptor. */
var borradorCust = null;

function formCustodia(f){
  var c = custodiaDe(f);
  borradorCust = { fecha:f, fecha_fin:'', rango:false,
                   username: c.quien || state.user, motivo: c.motivo || '',
                   eraCambio: c.origen === 'cambio' };
  pintarFormCustodia();
}

function casasDisponibles(){
  var us = state.data.usuarios;
  return CASAS.map(function(k){
    var u = us.filter(function(x){ return String(x.username) === k; })[0];
    return u || { username:k, nombre: k==='avis' ? 'Els avis' : k };
  });
}

function pintarFormCustodia(){
  var b = borradorCust;
  /* "Con quién está" no dice nada: un día se reparte entre los dos. Lo que
     un día del calendario marca es DÓNDE DUERME esa noche, y es lo único
     que no admite dos respuestas. */
  var titulo = b.rango
    ? '¿Dónde duerme estas noches?'
    : '¿Dónde duerme el ' + (+b.fecha.split('-')[2]) + ' de ' +
      MESES[+b.fecha.split('-')[1]-1] + '?';

  var h = '<h3>'+titulo+'</h3>';

  h += '<div class="cust-sw">' +
    '<button data-custr="0" class="'+(b.rango?'':'on')+'">Un día</button>' +
    '<button data-custr="1" class="'+(b.rango?'on':'')+'">Un tramo</button></div>';

  if(b.rango){
    h += '<div class="f-lb">Del … al</div><div class="fila2">' +
      '<input class="inp" id="cuIni" type="date" value="'+esc(b.fecha)+'">' +
      '<input class="inp" id="cuFin" type="date" value="'+esc(b.fecha_fin||b.fecha)+'"></div>';
    var n = diasDelRango();
    if(n) h += '<div class="cust-n">'+n+(n===1?' día':' días')+'</div>';
  }

  h += '<div class="f-lb">'+(b.rango?'Duerme con':'Esa noche duerme con')+'</div>' +
    '<div class="cust-g">' + casasDisponibles().map(function(u){
      var k = claveColor(u.username), on = b.username === u.username;
      return '<button class="cust-o'+(on?' on':'')+'" data-custq="'+esc(u.username)+'" ' +
        'style="--c:var(--'+k+');--cs:var(--'+k+'-s);--cd:var(--'+k+'-d)">' +
        avatarHTML(u.username, 38) + '<b>'+esc(u.nombre)+'</b>' +
        (on ? '<span class="tk">'+svg('check',13)+'</span>' : '') + '</button>';
    }).join('') + '</div>';

  h += '<div class="aviso" style="background:var(--surface2);color:var(--t2)">' +
    'Cada día del calendario marca <b>con quién duerme esa noche</b>. ' +
    'El cambio en sí ocurre a la hora que tengáis puesta en el patrón, ' +
    'no a medianoche.</div>';

  h += '<div class="f-lb">Por qué (opcional)</div>' +
    '<input class="inp" id="cuMotivo" value="'+esc(b.motivo)+'" ' +
      'placeholder="Vacaciones, boda, cambio de turno…">' +
    '<div class="aviso">El convenio no se toca: esto apunta un cambio y queda ' +
      'marcado como tal. Lo verá también ' +
      esc(nombreDe(otro(state.user)).toLowerCase()) + '.</div>' +
    '<button class="btn" style="background:var(--cal)" id="cuGuardar">' +
      (b.rango ? 'Guardar el tramo' : 'Guardar el cambio') + '</button>';

  if(b.eraCambio && !b.rango){
    h += '<button class="btn sec" id="cuVolver">Volver a lo que dice el convenio</button>';
  }

}

function diasDelRango(){
  var b = borradorCust;
  var fin = b.fecha_fin || b.fecha;
  if(fin < b.fecha) return 0;
  return diffDias(b.fecha, fin) + 1;
}

function leerFormCust(){
  var b = borradorCust;
  if($('#cuIni')) b.fecha = $('#cuIni').value || b.fecha;
  if($('#cuFin')) b.fecha_fin = $('#cuFin').value || '';
  if($('#cuMotivo')) b.motivo = ($('#cuMotivo').value || '').trim();
}

function guardarCustodia(){
  leerFormCust();
  var b = borradorCust;
  if(b.rango){
    if(!b.fecha_fin) b.fecha_fin = b.fecha;
    if(b.fecha_fin < b.fecha){
      toast('El último día no puede ser anterior al primero', true); return;
    }
    if(diasDelRango() > 400){ toast('Son más de 400 días. Pártelo en dos.', true); return; }
  }
  var btn = $('#cuGuardar');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }

  var accion = b.rango ? 'saveCustodiaRango' : 'saveCustodia';
  var payload = { fecha:b.fecha, username:b.username, origen:'cambio',
                  motivo:b.motivo, creado_por:state.user };
  if(b.rango) payload.fecha_fin = b.fecha_fin;

  llamarPost({ action:accion, payload:payload })
    .then(function(d){
      cerrarHoja();
      toast(b.rango ? (d.dias + (d.dias===1?' día cambiado':' días cambiados')) : 'Día cambiado');
      return recargar();
    })
    .catch(function(err){
      toast(String(err.message||err), true);
      if(btn){ btn.disabled = false;
               btn.textContent = b.rango ? 'Guardar el tramo' : 'Guardar el cambio'; }
    });
}

function quitarCustodia(){
  llamarPost({ action:'deleteCustodia', fecha:borradorCust.fecha, creado_por:state.user })
    .then(function(){ cerrarHoja(); toast('Vuelve al convenio'); return recargar(); })
    .catch(function(err){ toast(String(err.message||err), true); });
}

function guardarEvento(){
  leerFormEvento();
  var b = borradorEvento;

/* ============================================================
   GASTOS
   Modelo real: hay una cuenta común de verdad. Lo normal es pagar
   desde ella; a veces adelanta uno y luego se le reembolsa; y a veces
   uno compra algo suyo que no se reparte.
   El saldo NUNCA se guarda: sale de sumar movimientos y gastos.
   ============================================================ */

var ORIGENES = [
  {id:'comun', nom:'Cuenta común'},
  {id:'papa',  nom:'Lo pagó papá'},
  {id:'mama',  nom:'Lo pagó mamá'}
];

function categoriaGasto(id){
  var c = state.data.categorias_gasto.filter(function(x){ return String(x.id)===String(id); })[0];
  return c || { id:'otro', nombre:'Otros', emoji:'🧾', color:'#94A3B8' };
}
function mesDe(f){ return String(f||'').slice(0,7); }
function gastosDeMes(ym){
  return state.data.gastos.filter(function(g){ return mesDe(fechaKey(g.fecha))===ym; })
    .sort(function(a,b){ return fechaKey(b.fecha).localeCompare(fechaKey(a.fecha)); });
}

/**
 * Saldo de la cuenta común: entra lo aportado y lo ajustado, sale lo
 * reembolsado, lo retirado y todo gasto pagado directamente desde ella.
 */
function saldoComun(){
  var s = 0;
  state.data.cuenta.forEach(function(m){
    var i = num(m.importe), t = String(m.tipo||'aporte');
    if(t==='aporte' || t==='ajuste') s += i; else s -= i;
  });
  state.data.gastos.forEach(function(g){
    if(String(g.origen||'comun')==='comun') s -= num(g.importe);
  });
  return Math.round(s*100)/100;
}
/** Gastos adelantados por una persona que aún no se le han devuelto. */
function pendientesReembolso(){
  var out = { papa:0, mama:0, n:0 };
  state.data.gastos.forEach(function(g){
    var o = String(g.origen||'comun');
    if(o==='comun') return;
    if(!truthy(g.compartido)) return;      /* lo suyo: ni se reparte ni se devuelve */
    if(g.reembolso_id) return;             /* ya devuelto */
    out[o] = (out[o]||0) + num(g.importe);
    out.n++;
  });
  out.papa = Math.round(out.papa*100)/100;
  out.mama = Math.round(out.mama*100)/100;
  return out;
}
function aportadoEnMes(username, ym){
  var s = 0;
  state.data.cuenta.forEach(function(m){
    if(String(m.tipo)!=='aporte' || String(m.username)!==username) return;
    if(mesDe(fechaKey(m.fecha))!==ym) return;
    s += num(m.importe);
  });
  return Math.round(s*100)/100;
}
function ultimoMovimiento(){
  return state.data.cuenta.slice().sort(function(a,b){
    return String(b.timestamp||b.fecha).localeCompare(String(a.timestamp||a.fecha));
  })[0] || null;
}
/** Mueve un mes hacia delante o hacia atrás sin salirse del calendario. */
function mesAnterior(ym, n){
  var p = String(ym||mesDe(state.data.hoy)).split('-');
  var d = new Date(+p[0], +p[1]-1+n, 1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}
function textoMovimiento(m){
  var t = String(m.tipo||'aporte'), q = m.username ? nombreDe(m.username).toLowerCase() : '';
  var n = t==='aporte' ? 'aporte de '+q : t==='reembolso' ? 'reembolso a '+q
        : t==='retirada' ? 'retirada'
        : (String(m.nota||'').trim() ? String(m.nota).trim().toLowerCase() : 'ajuste');
  return n + ' · ' + eur(num(m.importe)) + ' · ' + fechaCorta(fechaKey(m.fecha));
}
/**
 * Estado de la cuenta con criterio explícito y sin adjetivos que suenen a
 * reproche: describe hechos. «Sana» y «enferma» invitan a buscar culpable.
 */
function estadoCuenta(ym){
  if(saldoComun() < 0) return { t:'En descubierto', c:'cal', ico:'reloj' };
  var cuota = cfgNum('cuota_mensual', 0);
  var falta = state.data.usuarios.filter(function(u){
    return esPerfil(u) && aportadoEnMes(String(u.username), ym) < cuota;
  });
  if(cuota > 0 && falta.length) return { t:'Falta un aporte', c:'cal', ico:'reloj' };
  return { t:'Al día', c:'ali', ico:'escudo' };
}

/** Donut hecho a mano: cero librerías, cero peso, y testable con jsdom. */
function donut(partes, px){
  var total = partes.reduce(function(a,p){ return a + p.v; }, 0);
  var r = 42, c = 2*Math.PI*r, off = 0;
  if(total <= 0){
    return '<svg class="donut" width="'+px+'" height="'+px+'" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--surface2)" ' +
      'stroke-width="13"/></svg>';
  }
  var segs = partes.map(function(p){
    var largo = c * p.v / total;
    var sg = '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+p.col+'" ' +
      'stroke-width="13" stroke-dasharray="'+Math.max(0,largo-1.2)+' '+c+'" ' +
      'stroke-dashoffset="'+(-off)+'" transform="rotate(-90 50 50)"/>';
    off += largo;
    return sg;
  }).join('');
  return '<svg class="donut" width="'+px+'" height="'+px+'" viewBox="0 0 100 100">'+segs+'</svg>';
}

function pintarGastos(){
  var ym = state.gasMes || mesDe(state.data.hoy);
  state.gasMes = ym;
  var esActual = ym === mesDe(state.data.hoy);
  var mesNom = MESES[+ym.split('-')[1]-1];

  $('#gasPrev').innerHTML = svg('chevronI',17);
  $('#gasNext').innerHTML = svg('chevron',17);
  $('#gasNext').style.visibility = esActual ? 'hidden' : 'visible';
  $('#gasRango').innerHTML = svg('calendario',17)+'<span>'+mesNom+' '+ym.split('-')[0]+'</span>';

  var out = '';
  var saldo = saldoComun(), est = estadoCuenta(ym), um = ultimoMovimiento();
  var pend = pendientesReembolso();

  out += '<div class="cc"><h3>Cuenta común</h3><div class="cc-top">' +
    donut([{ v:Math.max(0,saldo), col:'var(--gas)' },
           { v:Math.max(0,pend.papa+pend.mama), col:'var(--cal)' }], 96) +
    /* El chip de estado va debajo del importe, no al lado: con cuatro
       cifras y el símbolo del euro se quedaba sin ancho y el "€" caía
       a una segunda línea. */
    '<div class="cc-tx"><div class="lb">Saldo disponible</div>' +
      '<div class="vl" style="color:'+(saldo<0?'var(--err)':'var(--gas-d)')+'">'+eur(saldo)+'</div>' +
      '<span class="est-chip" style="background:var(--'+est.c+'-s);' +
        'color:var(--'+est.c+'-d)">'+svg(est.ico,13)+esc(est.t)+'</span>' +
      (um ? '<div class="sb">Último: '+esc(textoMovimiento(um))+'</div>' : '') +
    '</div></div>';
  if(pend.n){
    var frases = [];
    if(pend.papa>0) frases.push('<b>'+eur(pend.papa)+'</b> a papá');
    if(pend.mama>0) frases.push('<b>'+eur(pend.mama)+'</b> a mamá');
    out += '<div class="cc-pend">Pendiente de devolver desde la cuenta común: ' +
      frases.join(' y ')+' · '+pend.n+(pend.n===1?' gasto adelantado':' gastos adelantados')+'</div>';
  }
  /* Este par va siempre: si no hay cuota mensual configurada la tarjeta de
     aportes no se pinta, y sin esto no habría forma de meter ni el saldo
     de partida ni un ingreso suelto. */
  out += '<div class="cc-acc">' +
    '<button class="cc-pie" id="gasAporteCC">'+svg('mas',14)+' Ingresar</button>' +
    '<button class="cc-pie" id="gasMovs">Movimientos '+svg('chevron',14)+'</button>' +
    '</div></div>';

  var cuota = cfgNum('cuota_mensual', 0);
  var adultos = state.data.usuarios.filter(esPerfil);
  if(cuota > 0 && adultos.length){
    out += '<div class="ap"><div class="ap-hd"><b>Aportes de '+mesNom+'</b>' +
      '<button id="gasAporte">Añadir aporte '+svg('mas',13)+'</button></div><div class="ap-g">' +
      adultos.map(function(u){
        var un = String(u.username), k = claveColor(un);
        var puesto = aportadoEnMes(un, ym), falta = Math.round((cuota-puesto)*100)/100;
        var ok = falta <= 0;
        return '<div class="ap-c" style="background:var(--'+k+'-s)">' +
          '<div class="who">'+avatarHTML(un,30)+'<b style="color:var(--'+k+'-d)">' +
            esc(u.nombre)+'</b></div>' +
          '<div class="row"><div><div class="lb">Acordado</div>' +
            '<div class="vl">'+eur(cuota)+'</div></div>' +
            '<div><div class="lb">Aportado</div><div class="vl" style="color:' +
            (ok?'var(--ali-d)':'var(--cal-d)')+'">'+eur(puesto)+'</div></div></div>' +
          '<div class="ap-est" style="background:var(--'+(ok?'ali':'cal')+'-s);color:var(--' +
            (ok?'ali':'cal')+'-d)">'+svg(ok?'escudo':'reloj',14) +
            (ok ? 'Al día' : 'Faltan '+eur(falta))+'</div></div>';
      }).join('') + '</div>' +
      '<div class="ap-nota"><span class="i">'+svg('escudo',16)+'</span>' +
      '<div><b>Aportes acordados: '+eur(cuota)+' cada uno</b>' +
      '<span>Es la cifra que pactasteis vosotros, no un cálculo de la app.</span></div></div></div>';
  }

  var gs = gastosDeMes(ym);
  var total = gs.reduce(function(a,g){ return a + num(g.importe); }, 0);
  var porCat = {};
  gs.forEach(function(g){
    var k = String(g.categoria||'otro');
    porCat[k] = (porCat[k]||0) + num(g.importe);
  });
  var cats = Object.keys(porCat).map(function(k){
    var c = categoriaGasto(k);
    return { id:k, nom:c.nombre, col:c.color, v:porCat[k] };
  }).sort(function(a,b){ return b.v - a.v; });

  out += '<div class="gm"><div class="gm-hd"><b>Gastos de '+mesNom+'</b>' +
    (gs.length>5 ? '<button id="gasTodos">'+(state.gasTodos?'Ver menos':'Ver todos') +
      ' '+svg('chevron',13)+'</button>' : '') + '</div>';
  if(!gs.length){
    out += '<div style="font-size:13px;color:var(--t3);padding:4px 0 8px">' +
      'Ningún gasto apuntado este mes.</div>';
  } else {
    out += '<div class="gm-top"><div class="gm-tot"><div class="lb">Total gastado</div>' +
      '<div class="vl" style="color:var(--gas-d)">'+eur(total)+'</div>' +
      '<div class="n">'+gs.length+(gs.length===1?' gasto':' gastos')+'</div></div>' +
      donut(cats, 104) + '</div>' +
      '<div class="leg-g">' + cats.slice(0,6).map(function(c){
        return '<div class="li"><i style="background:'+c.col+'"></i>' +
          '<span class="nm">'+esc(c.nom)+'</span><span class="im">'+eur(c.v)+'</span>' +
          '<span class="pc">'+Math.round(c.v/total*100)+'%</span></div>';
      }).join('') + '</div>';
    out += '<div class="gl"><h4>Últimos gastos</h4>' +
      gs.slice(0, state.gasTodos ? 60 : 5).map(function(g){
        var c = categoriaGasto(g.categoria), o = String(g.origen||'comun');
        var quien = o==='comun' ? 'Desde la cuenta común' : 'Lo pagó '+nombreDe(o).toLowerCase();
        var col = o==='comun' ? 'var(--gas-d)' : colorDe(o);
        var pendiente = o!=='comun' && truthy(g.compartido) && !g.reembolso_id;
        return '<button class="gi" data-gasto="'+esc(g.id)+'">' +
          '<span class="ic" style="background:'+c.color+'1F">'+ico(c,19,'🧾')+'</span>' +
          '<span class="tx"><b>'+esc(g.descripcion || c.nombre) +
            (truthy(g.compartido)?'':'<span class="solo-mio">solo suyo</span>')+'</b>' +
            '<span class="qn" style="color:'+col+'">'+esc(quien)+'</span>' +
            '<p>'+fechaCorta(fechaKey(g.fecha))+'</p></span>' +
          '<span class="im">'+eur(num(g.importe)) +
            (pendiente?'<small>por devolver</small>':'')+'</span>' +
          svg('chevron',15,' style="color:var(--t3)"')+'</button>';
      }).join('') + '</div>';
  }
  out += '<button class="add-g" id="gasNuevo">'+svg('mas',17)+' Añadir gasto</button></div>';

  $('#gasCuerpo').innerHTML = out;
  $('#gasSub').textContent = gs.length ? eur(total)+' en '+mesNom
    : 'La cuenta común y en qué se va el dinero.';
}

/**
 * Sube el comprobante. Las fotos se reducen antes de mandarlas: un
 * ticket de móvil son 4 MB y a 1200px se lee igual ocupando el 3%.
 * Los ficheros que no son imagen van tal cual, con tope de 8 MB.
 */
function comprobanteElegido(input){
  var f = input.files && input.files[0];
  if(!f) return;
  input.value = '';
  /* Adjuntar repinta la hoja: sin esto se perderían el concepto, el
     importe y los comentarios que ya estuvieran escritos. */
  leerFormGasto();
  var esImagen = /^image\//.test(f.type);

  function mandar(dataUrl, mime, nombre){
    borradorGasto.subiendo = true;
    pintarFormGasto();
    llamarPost({ action:'subirArchivo', payload:{
      archivo:dataUrl, mime:mime, titulo:nombre,
      fecha:borradorGasto.fecha, creado_por:state.user } })
      .then(function(d){
        borradorGasto.subiendo = false;
        borradorGasto.comprobante = d.url;
        pintarFormGasto();
        toast('Comprobante adjuntado');
      })
      .catch(function(err){
        borradorGasto.subiendo = false;
        pintarFormGasto();
        toast(String(err.message||err), true);
      });
  }

  if(esImagen){
    var img = new Image();
    img.onload = function(){
      var max = 1200;
      var e = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * e);
      cv.height = Math.round(img.height * e);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var url;
      try { url = cv.toDataURL('image/jpeg', 0.8); }
      catch(err){ toast('No he podido leer la foto', true); return; }
      URL.revokeObjectURL(img.src);
      mandar(url, 'image/jpeg', f.name || 'Comprobante');
    };
    img.onerror = function(){ toast('No he podido leer la foto', true); };
    img.src = URL.createObjectURL(f);
    return;
  }

  if(f.size > 8 * 1024 * 1024){
    toast('El fichero pesa más de 8 MB. Hazle una foto en vez de eso.', true); return;
  }
  var fr = new FileReader();
  fr.onload = function(){ mandar(String(fr.result), f.type || 'application/octet-stream',
                                 f.name || 'Comprobante'); };
  fr.onerror = function(){ toast('No he podido leer el fichero', true); };
  fr.readAsDataURL(f);
}

/* ============================================================
   SALUD
   Historial y seguimiento. Sin navegador semanal: la salud no va
   por semanas — la próxima cita puede ser mañana y la anterior
   revisión de hace ocho meses.
   ============================================================ */

var TIPOS_CITA = [
  {id:'pediatra', nom:'Pediatra',    ico:'pediatra'},
  {id:'dentista', nom:'Dentista',    ico:'diente'},
  {id:'revision', nom:'Revisión',    ico:'escudo'},
  {id:'urgencias',nom:'Urgencias',   ico:'termometro'},
  {id:'otro',     nom:'Otra',        ico:'pediatra'}
];
var TIPOS_EPISODIO = [
  {id:'fiebre',     nom:'Fiebre',     ico:'termometro'},
  {id:'sintoma',    nom:'Síntoma',    ico:'termometro'},
  {id:'lesion',     nom:'Lesión',     ico:'tirita'},
  {id:'enfermedad', nom:'Enfermedad', ico:'pastilla'}
];
var CATS_SALUD = [
  {id:'',           nom:'Todo',        ico:'salud'},
  {id:'pediatra',   nom:'Pediatra',    ico:'pediatra'},
  {id:'dentista',   nom:'Dentista',    ico:'diente'},
  {id:'medicacion', nom:'Medicación',  ico:'pastilla'},
  {id:'enfermedad', nom:'Enfermedades',ico:'termometro'},
  {id:'lesion',     nom:'Lesiones',    ico:'tirita'}
];

function icoCita(t){
  var x = TIPOS_CITA.filter(function(c){ return c.id===String(t); })[0];
  return x ? x.ico : 'pediatra';
}
function icoEpisodio(t){
  var x = TIPOS_EPISODIO.filter(function(c){ return c.id===String(t); })[0];
  return x ? x.ico : 'termometro';
}

/**
 * Próxima toma de una medicación: última dosis + cada_horas.
 * Sin pauta horaria o sin dosis previa devuelve null; no se inventa una hora.
 */
function proximaDosis(m){
  var h = num(m.cada_horas);
  if(h <= 0) return null;
  var u = ultimaDosis(m.id);
  if(!u) return null;
  var f = fechaKey(u.fecha), hh = String(u.hora||'00:00');
  var p = hh.split(':');
  var d = new Date(+f.split('-')[0], +f.split('-')[1]-1, +f.split('-')[2],
                   +p[0]||0, +p[1]||0);
  d.setHours(d.getHours() + h);
  return { fecha: fk(d.getFullYear(), d.getMonth()+1, d.getDate()),
           hora: pad(d.getHours())+':'+pad(d.getMinutes()), ts: d.getTime() };
}
function dosisDeHoy(medId){
  return state.data.dosis.filter(function(d){
    return String(d.medicacion_id)===String(medId) && fechaKey(d.fecha)===state.data.hoy;
  }).length;
}

/** Todo lo registrable en un único orden cronológico (§31). */
function historialSalud(filtro){
  var out = [];
  state.data.episodios.forEach(function(e){
    out.push({ k:'episodio', id:e.id, fecha:fechaKey(e.fecha), hora:String(e.hora||''),
      tipo:String(e.tipo||'sintoma'), ico:icoEpisodio(e.tipo),
      titulo:String(e.descripcion || e.tipo || 'Episodio'),
      lineas:[ (num(e.temperatura)>0 ? String(e.temperatura).replace('.',',')+' °C' : '') +
               (e.hora ? (num(e.temperatura)>0?' · ':'')+e.hora : ''),
               String(e.notas||'') ].filter(String),
      autor:String(e.creado_por||''), ts:String(e.timestamp||'') });
  });
  state.data.citas.forEach(function(c){
    var f = fechaKey(c.fecha);
    if(f > state.data.hoy) return;                 /* las futuras van arriba, no en el historial */
    out.push({ k:'cita', id:c.id, fecha:f, hora:String(c.hora||''),
      tipo:String(c.tipo||'pediatra'), ico:icoCita(c.tipo),
      titulo:String(c.motivo || c.tipo || 'Cita'),
      lineas:[ String(c.resultado||''), String(c.centro||c.profesional||'') ].filter(String),
      autor:String(c.creado_por||''), ts:String(c.timestamp||'') });
  });
  state.data.vacunas.forEach(function(v){
    out.push({ k:'vacuna', id:v.id, fecha:fechaKey(v.fecha), hora:'', tipo:'vacuna', ico:'vacuna',
      titulo:'Vacuna · '+String(v.nombre||''),
      lineas:[ String(v.centro||''), v.proxima ? 'Siguiente: '+fechaCorta(fechaKey(v.proxima)) : '' ]
        .filter(String),
      autor:String(v.creado_por||''), ts:String(v.timestamp||'') });
  });
  state.data.crecimiento.forEach(function(m){
    out.push({ k:'medida', id:m.id, fecha:fechaKey(m.fecha), hora:'', tipo:'medida', ico:'regla',
      titulo:'Peso y talla',
      lineas:[ [ num(m.peso_kg)>0 ? String(m.peso_kg).replace('.',',')+' kg' : '',
                 num(m.talla_cm)>0 ? String(m.talla_cm).replace('.',',')+' cm' : ''
               ].filter(String).join(' · '), String(m.nota||'') ].filter(String),
      autor:String(m.creado_por||''), ts:String(m.timestamp||'') });
  });

  if(filtro){
    out = out.filter(function(r){
      if(filtro==='medicacion') return r.k==='vacuna' || r.tipo==='enfermedad';
      if(filtro==='enfermedad') return r.tipo==='fiebre' || r.tipo==='enfermedad' || r.tipo==='sintoma';
      if(filtro==='lesion')     return r.tipo==='lesion';
      return r.tipo === filtro;
    });
  }
  return out.sort(function(a,b){
    return (b.fecha+' '+(b.hora||'00:00')).localeCompare(a.fecha+' '+(a.hora||'00:00'));
  });
}

function colorSalud(k){
  return k==='lesion' ? '#8B62D9' : k==='vacuna' ? '#4C9A5C'
       : k==='medida' ? '#C9A44C' : 'var(--sal)';
}

function pintarSalud(){
  var out = '';
  var meds = medicacionActiva();
  var ahora = new Date().getTime();

  /* ---- Medicación activa: lo primero, porque es lo único urgente ---- */
  meds.forEach(function(m){
    var u = ultimaDosis(m.id), p = proximaDosis(m);
    var toca = p && p.ts <= ahora;
    var linea;
    if(!u){
      linea = 'Sin dosis registradas todavía.';
    } else {
      linea = 'Última: ' + esc(u.hora||'') +
        (fechaKey(u.fecha)!==state.data.hoy ? ' del '+fechaCorta(fechaKey(u.fecha)) : '') +
        (u.dado_por ? ', ' + esc(nombreDe(u.dado_por).toLowerCase()) : '');
      if(p) linea += ' · Próxima a las ' + esc(p.hora) +
        (p.fecha!==state.data.hoy ? ' de mañana' : '');
    }
    out += '<div class="dosis-c'+(toca?' toca':'')+'">' +
      '<div class="dosis-hd"><span class="i">'+svg('pastilla',24)+'</span>' +
      '<div class="dosis-tx"><div class="kick">' +
        (toca ? 'Toca ahora' : 'Medicación activa') + '</div>' +
      '<b>'+esc(m.nombre)+(m.dosis?' · '+esc(m.dosis):'')+'</b>' +
      '<p>'+linea+'</p></div></div>' +
      '<button class="dosis-btn" data-dosis="'+esc(m.id)+'">' +
        svg('mas',18)+' Marcar dosis dada</button>' +
      '<div class="dosis-mas">'+dosisDeHoy(m.id)+' dosis hoy' +
        (m.fin ? ' · hasta el '+fechaCorta(fechaKey(m.fin)) : '')+'</div></div>';
  });

  /* ---- Próxima cita ---- */
  var cita = proximaCita();
  if(cita){
    var f = fechaKey(cita.fecha), d = diffDias(state.data.hoy, f);
    var badge = d===0 ? 'Hoy' : d===1 ? 'Mañana' : 'En '+d+' días';
    var t = TIPOS_CITA.filter(function(x){ return x.id===String(cita.tipo); })[0];
    out += '<div class="cita-c"><div class="cita-hd">' +
      '<span class="i">'+svg(icoCita(cita.tipo),34)+'</span>' +
      '<div class="cita-tx"><div class="kick">Próxima cita</div>' +
      '<h3>'+esc(cita.motivo || (t&&t.nom) || 'Cita')+'</h3>' +
      '<div class="fh">'+DOW_LARGO[dow(f)].charAt(0).toUpperCase()+DOW_LARGO[dow(f)].slice(1) +
        ', '+(+f.split('-')[2])+' '+MESES[+f.split('-')[1]-1] +
        (cita.hora?' · '+esc(cita.hora):'')+'</div>' +
      '<div class="cita-meta">' +
        (cita.centro?'<span>'+svg('lugar',14)+esc(cita.centro)+'</span>':'') +
        (cita.acompana?'<span>'+svg('inicio',14)+'La lleva ' +
          esc(nombreDe(cita.acompana).toLowerCase())+'</span>':'') +
      '</div></div>' +
      '<span class="badge'+(d<=2?' pron':'')+'">'+badge+'</span></div>' +
      '<button class="cita-pie" data-cita="'+esc(cita.id)+'">Ver esta cita ' +
        svg('chevron',14)+'</button></div>';
  }

  out += tarjetaCrecimiento();

  /* ---- Tres tarjetas ---- */
  var futuras = state.data.citas.filter(function(c){
    return fechaKey(c.fecha) >= state.data.hoy; }).length;
  /* Si hay medicación activa ya ocupa la tarjeta grande de arriba: repetirla
     aquí sería decir lo mismo dos veces en la misma pantalla. */
  var pendiente = meds.length
    ? { t:'Citas', v:futuras, l:futuras===1?'próxima':'próximas', c:'sal' }
    : { t:'Todo al día', v:'', l:'No hay pendientes de salud', c:'ali' };
  out += '<div class="mini">' +
    '<button style="background:var(--'+pendiente.c+'-c)">' +
      '<div class="top"><span class="i" style="color:var(--'+pendiente.c+'-d)">' +
        svg('escudo',22)+'</span><b style="color:var(--'+pendiente.c+'-d)">' +
        esc(pendiente.t)+'</b></div>' +
      (pendiente.v!=='' ? '<div class="vl" style="color:var(--'+pendiente.c+'-d)">' +
        pendiente.v+'</div>' : '') +
      '<div class="lb">'+esc(pendiente.l)+'</div></button>' +
    '<button style="background:var(--gina-s)" data-salcat="medicacion">' +
      '<div class="top"><span class="i" style="color:var(--gina-d)">'+svg('pastilla',22)+'</span>' +
      '<b style="color:var(--gina-d)">Vacunas</b></div>' +
      '<div class="vl" style="color:var(--gina-d)">'+state.data.vacunas.length+'</div>' +
      '<div class="lb">registradas</div></button>' +
    '<button style="background:var(--cal-c)" id="salDocs">' +
      '<div class="top"><span class="i" style="color:var(--cal-d)">'+svg('carpeta',22)+'</span>' +
      '<b style="color:var(--cal-d)">Documentos</b></div>' +
      '<div class="vl" style="color:var(--cal-d)">'+state.data.documentos.length+'</div>' +
      '<div class="lb">archivos</div></button></div>';

  /* ---- Historial, con sus filtros dentro ----
     Las categorías eran una tarjeta aparte titulada "Categorías rápidas"
     que en realidad solo filtraba esta lista. Separadas, además, cada
     botón medía distinto según lo larga que fuera la palabra. Ahora son
     una fila de filtros dentro de lo que filtran. */
  var filtro = state.salCat || '';
  var hist = historialSalud(filtro);
  out += '<div class="hist"><div class="hist-hd"><b>Últimos registros</b>' +
    (hist.length>4 ? '<button id="salTodo">Ver historial completo '+svg('chevron',13)+'</button>' : '') +
    '</div>' +
    '<div class="cats-h"><button data-salcat="" class="'+(filtro?'':'on') +
      '" style="'+(filtro?'':'background:var(--sal-d);color:#fff')+'">Todos</button>' +
    CATS_SALUD.map(function(c){
      var on = filtro === c.id;
      return '<button data-salcat="'+c.id+'" class="'+(on?'on':'')+'" style="' +
        (on?'background:var(--sal-d);color:#fff':'')+'">' +
        svg(c.ico,14)+esc(c.nom)+'</button>';
    }).join('') + '</div>';
  if(!hist.length){
    out += '<div class="hist-vacio">' +
      (filtro ? 'Nada registrado en esta categoría.' : 'Todavía no hay nada registrado.') +
      '</div>';
  } else {
    out += hist.slice(0, state.salTodo ? 40 : 4).map(function(r){
      var col = colorSalud(r.tipo);
      return '<div class="hr-i" data-reg="'+r.k+':'+esc(r.id)+'"><div class="ln"></div>' +
        '<span class="ic" style="background:'+col+'1F;color:'+col+'">'+svg(r.ico,21)+'</span>' +
        '<div class="tx"><div class="t1"><b>'+esc(r.titulo)+'</b>' +
          '<span class="chip-f" style="background:'+col+'1A;color:'+col+'">' +
          fechaCorta(r.fecha)+'</span></div>' +
          r.lineas.slice(0,2).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join('') +
        '</div>' +
        '<div class="aut"><b style="color:'+colorDe(r.autor)+'">' +
          esc(nombreDe(r.autor))+'</b><span>'+esc(r.ts?r.ts.slice(11,16):'')+'</span></div></div>';
    }).join('');
  }
  out += '</div>';

  /* ---- Documentos ---- */
  out += '<div class="doc-b"><span class="i">'+svg('carpeta',24)+'</span>' +
    '<div><b>Toda la información de salud, siempre organizada</b>' +
    '<p>Informes, recetas, informes escolares…</p></div>' +
    svg('chevron',16,' style="color:var(--sal-d)"')+'</div>';

  $('#salCuerpo').innerHTML = out;
  $('#fabSalud').innerHTML = svg('mas',19) + 'Añadir';
  var prox = proximaCita();
  $('#salSub').textContent = meds.length
    ? (meds.length===1 ? '1 tratamiento activo' : meds.length+' tratamientos activos')
    : prox ? 'Próxima cita: '+fechaCorta(fechaKey(prox.fecha))
    : 'Qué ha pasado y qué viene después.';
}

    })

/**
 * Peso, talla y edad, con su evolución.
 *
 * Dos gráficas separadas a propósito. Peso y talla van en unidades
 * distintas y meterlas en un mismo dibujo obligaría a dos escalas: eso
 * dibuja un cruce entre las líneas que no significa nada y se lee como
 * si lo significara.
 */
function tarjetaCrecimiento(){
  var corto = state.data.config.nombre_corto || 'Gina';
  var ms = medidas();
  var uP = ultimaMedida('peso_kg'), uT = ultimaMedida('talla_cm');
  var edad = edadTexto(state.data.hoy);

  var h = '<div class="crec"><div class="crec-hd"><b>Crecimiento</b>' +
    '<button id="crecNueva">'+svg('mas',13)+' Medir</button></div>';

  h += '<div class="crec-k">' +
    '<div><div class="lb">Edad</div>' +
      '<div class="vl" style="color:var(--gina-d)">' +
        (edad ? esc(edad.split(' y ')[0]) : '—') + '</div>' +
      '<div class="sb">' + (edad
        ? (edad.indexOf(' y ') > 0 ? 'y '+esc(edad.split(' y ')[1]) : 'cumplidos')
        : 'falta su fecha de nacimiento') + '</div></div>' +
    '<div><div class="lb">Peso</div>' +
      '<div class="vl" style="color:var(--sal-d)">' +
        (uP ? num(uP.peso_kg).toLocaleString('es-ES')+' kg' : '—') + '</div>' +
      '<div class="sb">'+(uP ? esc(fechaCorta(fechaKey(uP.fecha))) : 'sin medir')+'</div></div>' +
    '<div><div class="lb">Talla</div>' +
      '<div class="vl" style="color:var(--sal-d)">' +
        (uT ? num(uT.talla_cm).toLocaleString('es-ES')+' cm' : '—') + '</div>' +
      '<div class="sb">'+(uT ? esc(fechaCorta(fechaKey(uT.fecha))) : 'sin medir')+'</div></div>' +
    '</div>';

  /* Si las medidas cruzan más de un año, la etiqueta lleva el año: dos
     "12 sep" seguidos, uno de 2024 y otro de 2025, no se distinguen. */
  var fs = ms.map(function(m){ return fechaKey(m.fecha); });
  var variosAnios = fs.length > 1 && fs[0].slice(0,4) !== fs[fs.length-1].slice(0,4);
  function serie(campo){
    return ms.filter(function(m){ return num(m[campo]) > 0; })
      .map(function(m){
        var f = fechaKey(m.fecha), p = f.split('-');
        var et = MESES[+p[1]-1].slice(0,3).toLowerCase();
        return { x: variosAnios ? et + ' ' + p[0].slice(2) : (+p[2]) + ' ' + et,
                 y: num(m[campo]) };
      });
  }
  var sP = serie('peso_kg'), sT = serie('talla_cm');

  if(sP.length >= 2){
    h += '<div class="crec-g"><div class="tt">Peso · kg</div>' +
         lineaMedida(sP, 'var(--sal)', 'kg') + '</div>';
  }
  if(sT.length >= 2){
    h += '<div class="crec-g"><div class="tt">Talla · cm</div>' +
         lineaMedida(sT, 'var(--sal)', 'cm') + '</div>';
  }
  if(!ms.length){
    h += '<div class="crec-vac">Apunta el peso y la talla cada vez que la peséis: ' +
      'en la revisión del pediatra, o en casa. Con dos medidas ya se ve la evolución.</div>';
  } else if(sP.length < 2 && sT.length < 2){
    h += '<div class="crec-vac">Con una sola medida no hay evolución que dibujar. ' +
      'A la siguiente aparece la gráfica.</div>';
  }

  if(ms.length){
    h += '<button class="cc-pie sal" id="crecTodas" style="margin-top:14px">' +
      'Ver todas las medidas '+svg('chevron',14)+'</button>';
  }
  return h + '</div>';
}

function ir(seccion){
  state.seccion = seccion;
  /* Una sola cabecera desde v0.8.2: antes eran dos filas (.hd-top y .hd). */
  $('.hd-top').hidden = (seccion === 'perfil');
  SECCIONES.forEach(function(s){ $('#s-'+s.id).hidden = (s.id !== seccion); });
  if(seccion === 'alimentacion') pintarAlimentacion();
  if(seccion === 'salud') pintarSalud();
  if(seccion === 'gastos') pintarGastos();
  if(seccion === 'calendario') pintarCalendario();
  if(seccion === 'perfil') pintarPerfil();
  $('#fabCal').hidden = (seccion !== 'calendario');
  if(seccion !== 'inicio') marcarSeccionVista(seccion);
  pintarNav();
  $('#fabSalud').hidden = (seccion !== 'salud');
  window.scrollTo(0,0);
}
/* ============================================================
   LA PÁGINA DE GINA

   Lo que siempre hace falta tener a mano y nunca se encuentra: el número
   del DNI, la tarjeta sanitaria, la contraseña del cole. Se llega tocando
   su foto en la cabecera.

   Las contraseñas NO bajan al móvil con el resto de datos: viajan una a
   una, solo cuando se pulsa "ver", y cada vez queda apuntado quién la
   miró. En el Sheet están cifradas — quien lo abra ve un churro.

   Dicho lo cual, y sin adornos: esto protege de una mirada por encima del
   hombro y de compartir la hoja sin querer. No protege de alguien con
   acceso al proyecto de Apps Script. Para las contraseñas de verdad
   importantes, un gestor de contraseñas sigue siendo mejor sitio.
   ============================================================ */

var GINA_TIPOS = [
  { id:'documento',  nom:'Documento', ico:'📄',
    ay:'Número y fotos de las dos caras. DNI, tarjeta sanitaria, libro de familia…' },
  { id:'numero',     nom:'Solo un número', ico:'🔢',
    ay:'Un código que hay que tener a mano: pasaporte, identificador del cole…' },
  { id:'credencial', nom:'Usuario y contraseña', ico:'🔑',

function pintarGinaFicha(){
  var v = state._gnVer;
  var f = fichasGina().filter(function(x){ return String(x.id) === String(v.id); })[0];
  if(!f) return cerrarHoja();
  var t = ginaTipo(f.tipo);

  var h = '<h3>'+esc(t.ico)+' '+esc(f.titulo)+'</h3>';

  if(f.numero){
    h += '<div class="f-lb">'+(f.tipo==='credencial'?'Número':'Número')+'</div>' +
      '<button class="gn-cp" data-copiar="'+esc(f.numero)+'">' +
        '<b class="mono">'+esc(f.numero)+'</b>'+svg('copiar',16)+'</button>';
  }
  if(f.tipo === 'credencial'){
    if(f.usuario){
      h += '<div class="f-lb">Usuario</div>' +
        '<button class="gn-cp" data-copiar="'+esc(f.usuario)+'">' +
          '<b>'+esc(f.usuario)+'</b>'+svg('copiar',16)+'</button>';
    }
    h += '<div class="f-lb">Contraseña</div>';
    if(!truthy(f.tiene_secreto)){
      h += '<div class="plato-e">No hay ninguna guardada.</div>';
    } else if(v.cargando){
      h += '<div class="plato-e"><i class="sp"></i>Descifrando…</div>';
    } else if(v.secreto === null){
      h += '<button class="gn-cp ver" id="gnVerPass">' +
        '<b class="mono">••••••••</b><span class="vr">'+svg('ojo',15)+' Ver</span></button>';
    } else {
      h += '<button class="gn-cp" data-copiar="'+esc(v.secreto)+'">' +
        '<b class="mono">'+esc(v.secreto)+'</b>'+svg('copiar',16)+'</button>' +
        '<div class="plato-e">Se ha apuntado que la has mirado. Se vuelve a ' +
        'esconder al cerrar.</div>';
    }
  }

  /* Quién lo tiene se cambia AQUÍ mismo, de un toque. Es lo que más
     cambia de toda la ficha —el DNI va y viene cada quince días— y
     obligar a entrar en «Editar» y guardar para eso sobra. */
  if(f.tipo === 'documento'){
    h += '<div class="f-lb">Ahora lo tiene</div><div class="chips">' +
      casasDisponibles().map(function(u){
        var un = String(u.username), on = String(f.en_poder_de||'') === un;
        var k = claveColor(un);
        return '<button class="chip'+(on?' on':'')+'" data-gnpoder="'+esc(un)+'" ' +
          (on ? 'style="background:var(--'+k+'-s);color:var(--'+k+'-d);' +
                'border-color:var(--'+k+')"' : '') + '>' + esc(u.nombre)+'</button>';
      }).join('') +
      '<button class="chip'+(f.en_poder_de?'':' on')+'" data-gnpoder="">No se sabe</button>' +
      '</div>' + (v.guardandoPoder
        ? '<div class="plato-e"><i class="sp"></i>Guardando…</div>' : '');
  }

  [['foto_a','Anverso'],['foto_b','Reverso']].forEach(function(par){
    if(!f[par[0]]) return;
    /* class="ico-img" para que, si la foto no carga, el respaldo sustituya
       LA IMAGEN por un texto con estilo, y no deje un enlace azul pelado
       dentro de la tarjeta. */
    h += '<div class="f-lb">'+par[1]+'</div>' +
      '<a class="gn-foto" href="'+esc(f[par[0]])+'" target="_blank" rel="noopener">' +
        '<img class="ico-img" src="'+esc(f[par[0]])+'" alt="'+par[1]+'" ' +
        'data-fb="Abrir la foto">' +
      '</a>';
  });

  if(f.notas){
    h += '<div class="f-lb">Notas</div><div class="aviso">'+esc(f.notas)+'</div>';
  }

  h += '<button class="btn sec" data-ginaedit="'+esc(f.id)+'">Editar</button>' +
       '<button class="btn sec" id="gnVolver">Volver</button>';
  abrirHoja(h);
}

/** Sube una foto del DNI. Se reduce como cualquier otra: 1200px basta. */
function fotoGinaElegida(input, campo){
  var f = input.files && input.files[0];
  if(!f) return;
  input.value = '';
  leerFormGina();
  var img = new Image();
  img.onload = function(){
    var e = Math.min(1, 1200 / Math.max(img.width, img.height));
    var cv = document.createElement('canvas');
    cv.width = Math.round(img.width * e);
    cv.height = Math.round(img.height * e);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    var url;
    try { url = cv.toDataURL('image/jpeg', 0.82); }
    catch(err){ toast('No he podido leer la foto', true); return; }
    URL.revokeObjectURL(img.src);
    borradorGina.subiendo = campo;
    pintarFormGina();
    llamarPost({ action:'subirArchivo', payload:{
      archivo:url, mime:'image/jpeg',
      titulo:(borradorGina.titulo||'Documento')+' · '+(campo==='foto_a'?'anverso':'reverso'),
      fecha:state.data.hoy, creado_por:state.user } })
      .then(function(d){
        borradorGina.subiendo = '';
        borradorGina[campo] = d.url;
        pintarFormGina();
      })
      .catch(function(err){
        borradorGina.subiendo = '';
        pintarFormGina();
        toast(String(err.message||err), true);
      });
  };
  img.onerror = function(){ toast('No he podido leer la foto', true); };
  img.src = URL.createObjectURL(f);
}

function guardarGina(){
  leerFormGina();
  var b = borradorGina;
  if(!b.titulo){ toast('Ponle un nombre para saber qué es', true); return; }
  var btn = $('#gnGuardar');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
  var carga = { id:b.id, tipo:b.tipo, titulo:b.titulo, numero:b.numero,
                usuario:b.tipo==='credencial' ? b.usuario : '',
                foto_a:b.tipo==='documento' ? b.foto_a : '',
                foto_b:b.tipo==='documento' ? b.foto_b : '',
                notas:b.notas, actualizado_por:state.user };
  /* Mandar `secreto` solo si se ha escrito algo: si no se manda, el backend
     conserva la que ya había. Mandarlo vacío la borraría. */
  if(b.secreto !== null) carga.secreto = b.secreto;
  if(b.tipo !== 'credencial') carga.secreto = '';
  llamarPost({ action:'saveGinaFicha', payload:carga })
    .then(function(){ toast('Guardado'); return recargar(); })
    .then(function(){ hojaGina(); })
    .catch(function(err){
      toast(String(err.message||err), true);
      if(btn){ btn.disabled = false; btn.textContent = 'Guardar'; }
    });
}

function borrarGina(){
  llamarPost({ action:'deleteGinaFicha', id:borradorGina.id, creado_por:state.user })
    .then(function(){ toast('Borrado'); return recargar(); })

/** Copiar sin depender de la API moderna, que en http:// no existe. */
function copiar(txt){
  function ok(){ toast('Copiado'); }
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, aPelo);
      return;
    }
  } catch(e){}
  aPelo();
  function aPelo(){
    try {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var bien = document.execCommand('copy');
      document.body.removeChild(ta);
      bien ? ok() : toast('No he podido copiarlo', true);
    } catch(e){ toast('No he podido copiarlo', true); }
  }
}
